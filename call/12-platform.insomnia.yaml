type: collection.insomnia.rest/5.0
schema_version: '5.1'
name: Commerce API — Platform
meta:
  id: wrk_121f2abc744770c94ae151cf354b7e28
  description: Manage applications and keys and retrieve reference data. Uses the shared Commerce API global environment.
collection:
- name: Apps
  meta:
    id: fld_d56f6359d240f69e4164425b599d0886
    description: Create, retrieve, and update applications when the calling key has the required authority.
  authentication:
    type: bearer
    token: '{{ api_key }}'
    prefix: Bearer
  scripts:
    preRequest: |-
      insomnia.variables.set(
        'future_timestamp',
        new Date(Date.now() + 7 * 24 * 60 * 60 * 1000).toISOString(),
      );
    afterResponse: |-
      insomnia.test('Returns a successful HTTP status', () => {
        insomnia.expect(insomnia.response.code).to.be.within(200, 299);
      });
  children:
  - name: Create an app
    url: '{{ base_url }}/apps/create'
    method: POST
    meta:
      id: req_7f080b18c7e45eb3362ab100269289a4
      description: 'Public reference: https://studio.inttegro.com/apps#create-an-app'
    headers:
    - name: Content-Type
      value: application/json
    body:
      mimeType: application/json
      text: |-
        {
          "alias": "acme-prod-api",
          "description": "Production Commerce API for Acme Marketplace",
          "legal_entity_type": "business",
          "name": "Acme Production API"
        }
    scripts:
      afterResponse: |-
        if (insomnia.response.code >= 200 && insomnia.response.code < 300) {
          const jsonBody = insomnia.response.json();
          const app_id = jsonBody?.app?.id;
          insomnia.test('Returns app.id', () => {
            insomnia.expect(app_id).to.be.a('string').and.not.be.empty;
          });
          if (app_id) insomnia.globals.set("app_id", app_id);
        }
  - name: Lookup an app
    url: '{{ base_url }}/apps/lookup'
    method: POST
    meta:
      id: req_1370f932d5a2962b288e930b109c058f
      description: 'Public reference: https://studio.inttegro.com/apps#lookup-an-app'
  - name: Update an app
    url: '{{ base_url }}/apps/update'
    method: POST
    meta:
      id: req_b870ad365624f1e9cf59535fee8f8989
      description: 'Public reference: https://studio.inttegro.com/apps#update-an-app'
    headers:
    - name: Idempotency-Key
      value: '{{ idempotency_key }}'
    - name: Content-Type
      value: application/json
    body:
      mimeType: application/json
      text: |-
        {
          "alias": "acme-checkout-api",
          "description": "Checkout API for Acme Marketplace",
          "legal_entity_type": "business",
          "name": "Acme Checkout API"
        }
- name: API keys
  meta:
    id: fld_48a53f0774c8ceff574a1fdcb0d470db
    description: Generate an API key. The returned token is shown once; never store it in this collection.
  authentication:
    type: bearer
    token: '{{ api_key }}'
    prefix: Bearer
  scripts:
    preRequest: |-
      insomnia.variables.set(
        'future_timestamp',
        new Date(Date.now() + 7 * 24 * 60 * 60 * 1000).toISOString(),
      );
    afterResponse: |-
      insomnia.test('Returns a successful HTTP status', () => {
        insomnia.expect(insomnia.response.code).to.be.within(200, 299);
      });
  children:
  - name: Generate a key
    url: '{{ base_url }}/keys/generate'
    method: POST
    meta:
      id: req_d3a02579122d4ea2770c0db0e0d6704d
      description: 'Public reference: https://studio.inttegro.com/keys#generate-a-key'
    headers:
    - name: Content-Type
      value: application/json
    body:
      mimeType: application/json
      text: |-
        {
          "label": "checkout-api"
        }
    scripts:
      afterResponse: |-
        if (insomnia.response.code >= 200 && insomnia.response.code < 300) {
          const jsonBody = insomnia.response.json();
          const secret_key_id = jsonBody?.key?.id;
          insomnia.test('Returns key.id', () => {
            insomnia.expect(secret_key_id).to.be.a('string').and.not.be.empty;
          });
          if (secret_key_id) insomnia.globals.set("secret_key_id", secret_key_id);
        }
  - name: Page API keys
    url: '{{ base_url }}/keys/page'
    method: POST
    meta:
      id: req_936830ebf528540b8b0077ec9afad3fe
      description: 'Public reference: https://studio.inttegro.com/keys#page-api-keys'
    headers:
    - name: Content-Type
      value: application/json
    body:
      mimeType: application/json
      text: |-
        {
          "page": 1,
          "size": 20
        }
  - name: Lookup an API key
    url: '{{ base_url }}/keys/lookup'
    method: POST
    meta:
      id: req_6111ed9b8c8e090da84727f54da5ea54
      description: 'Public reference: https://studio.inttegro.com/keys#lookup-an-api-key'
    headers:
    - name: Content-Type
      value: application/json
    body:
      mimeType: application/json
      text: |-
        {
          "secret_key_id": "{{ secret_key_id }}"
        }
  - name: Update an API key
    url: '{{ base_url }}/keys/update'
    method: POST
    meta:
      id: req_7b5bd8380ce18cdbe70d43c05e8d16ae
      description: 'Public reference: https://studio.inttegro.com/keys#update-an-api-key'
    headers:
    - name: Content-Type
      value: application/json
    body:
      mimeType: application/json
      text: |-
        {
          "secret_key_id": "{{ secret_key_id }}",
          "label": "checkout-api-primary"
        }
  - name: Revoke an API key
    url: '{{ base_url }}/keys/destroy'
    method: POST
    meta:
      id: req_8b9f5db19f8c9c0d502f5c0a1c838d17
      description: 'Public reference: https://studio.inttegro.com/keys#revoke-an-api-key'
    headers:
    - name: Content-Type
      value: application/json
    - name: Idempotency-Key
      value: '{{ idempotency_key }}'
    body:
      mimeType: application/json
      text: |-
        {
          "secret_key_id": "{{ secret_key_id }}"
        }
  - name: Retrieve API key usage
    url: '{{ base_url }}/keys/usage'
    method: POST
    meta:
      id: req_7002ea69b5a938c1a5de20ab6b3888d2
      description: 'Public reference: https://studio.inttegro.com/keys#retrieve-api-key-usage'
    headers:
    - name: Content-Type
      value: application/json
    body:
      mimeType: application/json
      text: |-
        {
          "secret_key_id": "{{ secret_key_id }}",
          "page": 1,
          "size": 20
        }
- name: Reference data
  meta:
    id: fld_e45d4cbade71ec65c6bf518246dc9bd7
    description: Retrieve public country and payment-method specifications.
  authentication:
    type: bearer
    token: '{{ api_key }}'
    prefix: Bearer
  scripts:
    preRequest: |-
      insomnia.variables.set(
        'future_timestamp',
        new Date(Date.now() + 7 * 24 * 60 * 60 * 1000).toISOString(),
      );
    afterResponse: |-
      insomnia.test('Returns a successful HTTP status', () => {
        insomnia.expect(insomnia.response.code).to.be.within(200, 299);
      });
  children:
  - name: Get country specifications
    url: '{{ base_url }}/spec/countries'
    method: POST
    meta:
      id: req_8345faf03dbded455bf8b60df52f7468
      description: 'Public reference: https://studio.inttegro.com/countries#get-country-specifications'
    authentication:
      type: none
    headers:
    - name: Content-Type
      value: application/json
environments:
  name: Base Environment
  meta:
    id: env_900a29cd4a33e0828257b045766592ce
  data: {}
