type: collection.insomnia.rest/5.0
schema_version: '5.1'
name: Inttegro API — Balances
meta:
  id: wrk_bd7a529b5b969e2c2fd1042a34e9dc06
  description: Read balance snapshots and balance ledger entries. Uses the shared Inttegro API global environment.
collection:
- name: Balances
  meta:
    id: fld_ca75286f2c7875b8b5d80d59c8bce4a6
    description: Retrieve the current balance snapshot.
  authentication:
    type: bearer
    token: '{{ api_key }}'
    prefix: Bearer
  scripts:
    preRequest: |-
      insomnia.variables.set(
        'future_timestamp',
        new Date(Date.now() + 7 * 24 * 60 * 60 * 1000).toISOString(),
      );
    afterResponse: |-
      insomnia.test('Returns a successful HTTP status', () => {
        insomnia.expect(insomnia.response.code).to.be.within(200, 299);
      });
  children:
  - name: Retrieve your balance
    url: '{{ base_url }}/balances'
    method: POST
    meta:
      id: req_8434d934d8d31744f7ead74bee162f47
      description: 'Public reference: https://studio.inttegro.com/balances#retrieve-your-balance'
    headers:
    - name: Content-Type
      value: application/json
    body:
      mimeType: application/json
      text: '{}'
    scripts:
      afterResponse: |-
        insomnia.test('Returns the current GHS balance snapshot', () => {
          insomnia.expect(insomnia.response.code).to.equal(200);
          const balances = insomnia.response.json()?.balances;
          insomnia.expect(balances?.ghs).to.be.an('object');
          insomnia.expect(balances).not.to.have.property('usd');
          for (const field of ['available', 'pending', 'refund', 'reserved']) {
            insomnia.expect(balances.ghs?.[field]?.amount).to.be.a('number');
          }
          insomnia.expect(balances.ghs?.includes_transactions_before).to.be.a('string');
        });
- name: Balance transactions
  meta:
    id: fld_84e7274fb3af07e83c4ce4581d331f28
    description: Retrieve and page balance ledger entries.
  authentication:
    type: bearer
    token: '{{ api_key }}'
    prefix: Bearer
  scripts:
    preRequest: |-
      insomnia.variables.set(
        'future_timestamp',
        new Date(Date.now() + 7 * 24 * 60 * 60 * 1000).toISOString(),
      );
    afterResponse: |-
      insomnia.test('Returns a successful HTTP status', () => {
        insomnia.expect(insomnia.response.code).to.be.within(200, 299);
      });
  children:
  - name: Look up a balance transaction
    url: '{{ base_url }}/balance_transactions/lookup'
    method: POST
    meta:
      id: req_636e1bbcff797682033df08daa0073b8
      description: 'Public reference: https://studio.inttegro.com/balance-transactions#look-up-a-balance-transaction'
    headers:
    - name: Content-Type
      value: application/json
    body:
      mimeType: application/json
      text: |-
        {
          "transaction_id": "{{ balance_transaction_id }}"
        }
    scripts:
      afterResponse: |-
        insomnia.test('Returns the requested balance transaction', () => {
          insomnia.expect(insomnia.response.code).to.equal(200);
          const transaction = insomnia.response.json()?.transaction;
          insomnia.expect(transaction?.id).to.equal(insomnia.variables.get('balance_transaction_id'));
          insomnia.expect(transaction?.order_id).to.be.a('string');
          insomnia.expect(transaction?.created_at).to.be.a('string');
          insomnia.expect(transaction?.amount?.currency).to.be.a('string');
          insomnia.expect(transaction?.amount?.value).to.be.a('number');
        });
  - name: Page through balance transactions
    url: '{{ base_url }}/balance_transactions/page'
    method: POST
    meta:
      id: req_c615c76cf9ec3a45bef47c853fc8e23a
      description: 'Public reference: https://studio.inttegro.com/balance-transactions#page-through-balance-transactions'
    headers:
    - name: Content-Type
      value: application/json
    body:
      mimeType: application/json
      text: |-
        {
          "page_number": 1,
          "page_size": 2
        }
    scripts:
      afterResponse: |-
        insomnia.test('Returns the first page newest first', () => {
          insomnia.expect(insomnia.response.code).to.equal(200);
          const jsonBody = insomnia.response.json();
          insomnia.expect(jsonBody?.page?.number).to.equal(1);
          insomnia.expect(jsonBody?.page?.size).to.be.a('number');
          if (jsonBody?.page?.transactions !== undefined) {
            insomnia.expect(jsonBody.page.transactions).to.be.an('array');
            const created = jsonBody.page.transactions.map((transaction) => Date.parse(transaction.created_at));
            insomnia.expect(created).to.deep.equal([...created].sort((a, b) => b - a));
          }
        });
environments:
  name: Base Environment
  meta:
    id: env_03c8e94c50cceda77c408faa002626a9
  data: {}
