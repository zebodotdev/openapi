type: collection.insomnia.rest/5.0
schema_version: '5.1'
name: Inttegro API — One-Time Passwords
meta:
  id: wrk_3b8be7bb233f4fea482b8f3f2710d0fa
  description: 'Initiate, verify, and retrieve SMS one-time-password transactions. Uses the shared Inttegro API global environment. Error reference: https://studio.inttegro.com/error-codes#one-time-passwords'
collection:
- name: One-time passwords
  meta:
    id: fld_a4c6490c1f27341357976458d321349f
    description: Initiate, verify, and retrieve SMS one-time-password transactions.
  authentication:
    type: bearer
    token: '{{ api_key }}'
    prefix: Bearer
  scripts:
    preRequest: |-
      insomnia.variables.set(
        'future_timestamp',
        new Date(Date.now() + 7 * 24 * 60 * 60 * 1000).toISOString(),
      );
    afterResponse: |-
      insomnia.test('Returns a successful HTTP status', () => {
        insomnia.expect(insomnia.response.code).to.be.within(200, 299);
      });
  children:
  - name: Initiate OTP transaction
    url: '{{ base_url }}/otp/initiate'
    method: POST
    meta:
      id: req_080a4f8ee9820ee4242e101ed4c802f0
      description: 'Public reference: https://studio.inttegro.com/otps#initiate-otp-transaction'
    headers:
    - name: Content-Type
      value: application/json
    - name: Idempotency-Key
      value: call-otp-initiate-{{ customer_phone }}
    body:
      mimeType: application/json
      text: |-
        {
          "message_template": "Your {service} code is {token}.",
          "purpose": "transaction_confirm",
          "recipient": "{{ customer_phone }}",
          "sender": "{{ otp_sender }}",
          "service_name": "{{ otp_service_name }}",
          "token_alphabet_type": "numeric",
          "token_size": 6,
          "validity_duration_in_minutes": 10
        }
    scripts:
      afterResponse: |-
        insomnia.test('Returns an initiated OTP transaction', () => {
          insomnia.expect(insomnia.response.code).to.equal(200);
          const jsonBody = insomnia.response.json();
          const otp_transaction_id = jsonBody?.transaction?.id;
          insomnia.expect(otp_transaction_id).to.be.a('string').and.not.be.empty;
          insomnia.expect(jsonBody?.transaction?.status).to.be.oneOf(['pending', 'pending_delivery', 'pending_verification']);
          insomnia.expect(jsonBody?.transaction?.full_message).to.include('{token}');
          if (otp_transaction_id) insomnia.globals.set("otp_transaction_id", otp_transaction_id);
        });
  - name: Verify OTP
    url: '{{ base_url }}/otp/verify'
    method: POST
    meta:
      id: req_3eaf8a80375083ba90ecbfc096ce196d
      description: 'Public reference: https://studio.inttegro.com/otps#verify-otp'
    headers:
    - name: Content-Type
      value: application/json
    - name: Idempotency-Key
      value: call-otp-verify-{{ otp_transaction_id }}-{{ otp_code }}
    body:
      mimeType: application/json
      text: |-
        {
          "recipient": "{{ customer_phone }}",
          "token": "{{ otp_code }}",
          "transaction_id": "{{ otp_transaction_id }}"
        }
    scripts:
      afterResponse: |-
        insomnia.test('Returns a recorded OTP verification attempt', () => {
          insomnia.expect(insomnia.response.code).to.equal(200);
          const jsonBody = insomnia.response.json();
          insomnia.expect(jsonBody?.verification_attempt?.presented_token).to.equal(insomnia.variables.get('otp_code'));
          insomnia.expect(jsonBody?.verification_attempt?.result?.verdict).to.be.oneOf(['pass', 'fail']);
        });
  - name: Lookup OTP transaction
    url: '{{ base_url }}/otp/lookup'
    method: POST
    meta:
      id: req_b8adc18c57d29c176669f2f0a3fe03d9
      description: 'Public reference: https://studio.inttegro.com/otps#lookup-otp-transaction'
    headers:
    - name: Content-Type
      value: application/json
    body:
      mimeType: application/json
      text: |-
        {
          "transaction_id": "{{ otp_transaction_id }}"
        }
    scripts:
      afterResponse: |-
        insomnia.test('Returns the OTP transaction without a generated token', () => {
          insomnia.expect(insomnia.response.code).to.equal(200);
          const transaction = insomnia.response.json()?.transaction;
          insomnia.expect(transaction?.id).to.equal(insomnia.variables.get('otp_transaction_id'));
          insomnia.expect(transaction?.full_message).to.include('{token}');
          insomnia.expect(transaction).not.to.have.property('token');
        });
environments:
  name: Base Environment
  meta:
    id: env_5551fc1207d63e921f0018a1efb30ac0
  data: {}
