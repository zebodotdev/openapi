type: collection.insomnia.rest/5.0
schema_version: '5.1'
name: Commerce API — Checkout and Orders
meta:
  id: wrk_7f1e34bb97341f0565d7ab3820dd7605
  description: Create hosted checkout sessions and manage the complete order lifecycle. Uses the shared Commerce API global
    environment.
collection:
- name: Checkout and orders
  meta:
    id: fld_1c168adb00d208e42f93314529f1fa9c
    description: Create and manage orders. Start with Create an order, then open checkout_url or use Lookup an order to poll
      status.
  authentication:
    type: bearer
    token: '{{ api_key }}'
    prefix: Bearer
  scripts:
    preRequest: |-
      insomnia.variables.set(
        'future_timestamp',
        new Date(Date.now() + 7 * 24 * 60 * 60 * 1000).toISOString(),
      );
    afterResponse: |-
      insomnia.test('Returns a successful HTTP status', () => {
        insomnia.expect(insomnia.response.code).to.be.within(200, 299);
      });
  children:
  - name: Create an order
    url: '{{ base_url }}/orders/create'
    method: POST
    meta:
      id: req_b9eabb5dcab52ea543d7359be9172d38
      description: 'Public reference: https://studio.inttegro.com/orders#create-an-order'
    headers:
    - name: Content-Type
      value: application/json
    body:
      mimeType: application/json
      text: |-
        {
          "request_meta": {
            "idempotency_key": "{{ idempotency_key }}"
          },
          "number": "{{ order_number }}",
          "finalize": true,
          "checkout_settings": {
            "redirect_url": "{{ checkout_success_url }}",
            "cancel_url": "{{ checkout_cancel_url }}"
          },
          "customer_data": {
            "name": "{{ customer_name }}",
            "email_address": "{{ customer_email }}",
            "phone_number": "{{ customer_phone }}"
          },
          "line_items": [
            {
              "type": "product",
              "product": {
                "type": "physical",
                "name": "{{ product_name }}",
                "quantity": 1,
                "price": {
                  "currency": "{{ currency }}",
                  "value": 20000
                }
              }
            }
          ]
        }
    scripts:
      afterResponse: |-
        if (insomnia.response.code >= 200 && insomnia.response.code < 300) {
          const jsonBody = insomnia.response.json();
          const order_id = jsonBody?.order?.id;
          if (order_id) insomnia.globals.set("order_id", order_id);
          const payment_id = jsonBody?.order?.payment?.id;
          if (payment_id) insomnia.globals.set("payment_id", payment_id);
          const confirmation_id = jsonBody?.order?.payment?.next_action?.confirm_payment?.request?.id;
          if (confirmation_id) insomnia.globals.set("confirmation_id", confirmation_id);
          const checkout_url = jsonBody?.order?.invoice?.format?.web?.url;
          if (checkout_url) insomnia.globals.set("checkout_url", checkout_url);
          insomnia.test('Returns an order identifier', () => {
            insomnia.expect(order_id).to.be.a('string').and.not.be.empty;
          });
          insomnia.test('Returns a hosted checkout URL', () => {
            insomnia.expect(checkout_url).to.be.a('string').and.match(/^https?:\/\//);
          });
        }
  - name: Create an order using the compatibility route
    url: '{{ base_url }}/orders/new'
    method: POST
    meta:
      id: req_0f0b946d6b8fd64a43a408076c074f97
      description: |-
        Public reference: https://studio.inttegro.com/orders#create-an-order
        Compatibility route for the same create-order contract. Choose either this request or Create an order; do not send both for one logical order.
    headers:
    - name: Content-Type
      value: application/json
    body:
      mimeType: application/json
      text: |-
        {
          "request_meta": {
            "idempotency_key": "{{ idempotency_key }}"
          },
          "number": "{{ order_number }}",
          "finalize": true,
          "checkout_settings": {
            "redirect_url": "{{ checkout_success_url }}",
            "cancel_url": "{{ checkout_cancel_url }}"
          },
          "customer_data": {
            "name": "{{ customer_name }}",
            "email_address": "{{ customer_email }}",
            "phone_number": "{{ customer_phone }}"
          },
          "line_items": [
            {
              "type": "product",
              "product": {
                "type": "physical",
                "name": "{{ product_name }}",
                "quantity": 1,
                "price": {
                  "currency": "{{ currency }}",
                  "value": 20000
                }
              }
            }
          ]
        }
  - name: Pay for an order
    url: '{{ base_url }}/orders/pay'
    method: POST
    meta:
      id: req_17973aff414d87c35f53f896d0efc411
      description: 'Public reference: https://studio.inttegro.com/orders#pay-for-an-order'
    headers:
    - name: Content-Type
      value: application/json
    body:
      mimeType: application/json
      text: |-
        {
          "order_id": "{{ order_id }}",
          "payment_method_data": {
            "type": "mobile_money",
            "mobile_money": {
              "network": "mtn",
              "account_number": "{{ mobile_money_account_number }}"
            }
          }
        }
    scripts:
      afterResponse: |-
        if (insomnia.response.code >= 200 && insomnia.response.code < 300) {
          const jsonBody = insomnia.response.json();
          const payment_id = jsonBody?.order?.payment?.id;
          if (payment_id) insomnia.globals.set("payment_id", payment_id);
          const confirmation_id = jsonBody?.order?.payment?.next_action?.confirm_payment?.request?.id;
          if (confirmation_id) insomnia.globals.set("confirmation_id", confirmation_id);
        }
  - name: Confirm a payment
    url: '{{ base_url }}/orders/confirm_payment'
    method: POST
    meta:
      id: req_38bb6f1168e91d79d90a734c8635a93c
      description: 'Public reference: https://studio.inttegro.com/orders#confirm-a-payment'
    headers:
    - name: Content-Type
      value: application/json
    body:
      mimeType: application/json
      text: |-
        {
          "confirmation_id": "{{ confirmation_id }}",
          "order_id": "{{ order_id }}",
          "payment_id": "{{ payment_id }}",
          "token": "{{ confirmation_token }}"
        }
  - name: Request confirmation
    url: '{{ base_url }}/orders/request_confirmation'
    method: POST
    meta:
      id: req_26e6325af60dab964f16ab1ee05656e0
      description: 'Public reference: https://studio.inttegro.com/orders#request-confirmation'
    headers:
    - name: Content-Type
      value: application/json
    body:
      mimeType: application/json
      text: |-
        {
          "order_id": "{{ order_id }}"
        }
    scripts:
      afterResponse: |-
        if (insomnia.response.code >= 200 && insomnia.response.code < 300) {
          const jsonBody = insomnia.response.json();
          const payment_id = jsonBody?.order?.payment?.id;
          if (payment_id) insomnia.globals.set("payment_id", payment_id);
          const confirmation_id = jsonBody?.order?.payment?.next_action?.confirm_payment?.request?.id;
          if (confirmation_id) insomnia.globals.set("confirmation_id", confirmation_id);
        }
  - name: Update an order
    url: '{{ base_url }}/orders/update'
    method: POST
    meta:
      id: req_23d54d4eb5703e09c5438c0bd55fcf06
      description: 'Public reference: https://studio.inttegro.com/orders#update-an-order'
    headers:
    - name: Content-Type
      value: application/json
    body:
      mimeType: application/json
      text: |-
        {
          "order_id": "{{ order_id }}",
          "receipt_number": "RCPT-2025-041-REV1",
          "line_items": [
            {
              "type": "product",
              "product": {
                "name": "Quarterly support retainer",
                "type": "digital",
                "price": {
                  "currency": "ghs",
                  "value": 15000
                },
                "quantity": 1
              }
            },
            {
              "type": "fee",
              "fee": {
                "label": "Service fee",
                "amount": {
                  "currency": "ghs",
                  "value": 500
                }
              }
            }
          ],
          "statement_descriptor": "ORDER REVISION",
          "custom_data": {
            "channel": "dashboard",
            "edited_by": "ops"
          },
          "finalize": true
        }
  - name: Finalize an order
    url: '{{ base_url }}/orders/finalize'
    method: POST
    meta:
      id: req_440d3be66b72eeb649744c6536fa38cd
      description: 'Public reference: https://studio.inttegro.com/orders#finalize-an-order'
    headers:
    - name: Content-Type
      value: application/json
    body:
      mimeType: application/json
      text: |-
        {
          "order_id": "{{ order_id }}"
        }
  - name: Send an invoice
    url: '{{ base_url }}/orders/send_invoice'
    method: POST
    meta:
      id: req_f05c7e422151fa011fcfad883cd58c8b
      description: 'Public reference: https://studio.inttegro.com/orders#send-an-invoice'
    headers:
    - name: Content-Type
      value: application/json
    - name: Idempotency-Key
      value: '{{ idempotency_key }}'
    body:
      mimeType: application/json
      text: |-
        {
          "order_id": "{{ order_id }}"
        }
  - name: Send a receipt
    url: '{{ base_url }}/orders/send_receipt'
    method: POST
    meta:
      id: req_3272a2c3a2217b9f92eff637053b2dbe
      description: 'Public reference: https://studio.inttegro.com/orders#send-a-receipt'
    headers:
    - name: Content-Type
      value: application/json
    - name: Idempotency-Key
      value: '{{ idempotency_key }}'
    body:
      mimeType: application/json
      text: |-
        {
          "order_id": "{{ order_id }}"
        }
  - name: Complete an order
    url: '{{ base_url }}/orders/complete'
    method: POST
    meta:
      id: req_4d656a29aa1dfc57595c93b08ea6484f
      description: 'Public reference: https://studio.inttegro.com/orders#complete-an-order'
    headers:
    - name: Content-Type
      value: application/json
    body:
      mimeType: application/json
      text: |-
        {
          "order_id": "{{ order_id }}"
        }
  - name: Lookup an order
    url: '{{ base_url }}/orders/lookup'
    method: POST
    meta:
      id: req_f527be43cb09f4aa441f0fb536748616
      description: 'Public reference: https://studio.inttegro.com/orders#lookup-an-order'
    headers:
    - name: Content-Type
      value: application/json
    body:
      mimeType: application/json
      text: |-
        {
          "order_id": "{{ order_id }}"
        }
  - name: Cancel an order
    url: '{{ base_url }}/orders/cancel'
    method: POST
    meta:
      id: req_0940d0b487c63851610fd1c2e8ae1b9c
      description: 'Public reference: https://studio.inttegro.com/orders#cancel-an-order'
    headers:
    - name: Content-Type
      value: application/json
    body:
      mimeType: application/json
      text: |-
        {
          "order_id": "{{ order_id }}",
          "reason": "customer_request",
          "execute_refund": false
        }
  - name: Page through orders
    url: '{{ base_url }}/orders/page'
    method: POST
    meta:
      id: req_33211617adf2f14d3239261650169c52
      description: 'Public reference: https://studio.inttegro.com/orders#page-through-orders'
    headers:
    - name: Content-Type
      value: application/json
    body:
      mimeType: application/json
      text: |-
        {
          "page_number": 0,
          "page_size": 25
        }
environments:
  name: Base Environment
  meta:
    id: env_81c7d05aaf81bf6d3140a8d095acf218
  data: {}
