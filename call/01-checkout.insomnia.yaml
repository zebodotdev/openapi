type: collection.insomnia.rest/5.0
schema_version: '5.1'
name: Inttegro API — Checkout and Orders
meta:
  id: wrk_7f1e34bb97341f0565d7ab3820dd7605
  description: Create hosted checkout sessions and manage the complete order lifecycle. Uses the shared Inttegro API global
    environment.
collection:
- name: Checkout and orders
  meta:
    id: fld_1c168adb00d208e42f93314529f1fa9c
    description: Create and manage orders. Start with Create an order, then open checkout_url or use Lookup an order to poll
      status.
  authentication:
    type: bearer
    token: '{{ api_key }}'
    prefix: Bearer
  scripts:
    preRequest: |-
      insomnia.variables.set(
        'future_timestamp',
        new Date(Date.now() + 7 * 24 * 60 * 60 * 1000).toISOString(),
      );
    afterResponse: |-
      insomnia.test('Returns a successful HTTP status', () => {
        insomnia.expect(insomnia.response.code).to.be.within(200, 299);
      });
  children:
  - name: Create an order
    url: '{{ base_url }}/orders/create'
    method: POST
    meta:
      id: req_b9eabb5dcab52ea543d7359be9172d38
      description: 'Public reference: https://studio.inttegro.com/orders#create-an-order. To execute immediately, provide payment_method_data together with execute_payment. Conflict reference: https://studio.inttegro.com/e/payment_transition_conflict'
    headers:
    - name: Content-Type
      value: application/json
    body:
      mimeType: application/json
      text: |-
        {
          "request_meta": {
            "idempotency_key": "{{ idempotency_key }}"
          },
          "number": "{{ order_number }}",
          "finalize": true,
          "checkout_settings": {
            "redirect_url": "{{ checkout_success_url }}",
            "cancel_url": "{{ checkout_cancel_url }}"
          },
          "customer_data": {
            "name": "{{ customer_name }}",
            "email_address": "{{ customer_email }}",
            "phone_number": "{{ customer_phone }}"
          },
          "line_items": [
            {
              "type": "product",
              "product": {
                "type": "physical",
                "name": "{{ product_name }}",
                "quantity": 1,
                "price": {
                  "currency": "{{ currency }}",
                  "value": 20000
                }
              }
            }
          ]
        }
    scripts:
      afterResponse: |-
        if (insomnia.response.code >= 200 && insomnia.response.code < 300) {
          const jsonBody = insomnia.response.json();
          const order_id = jsonBody?.order?.id;
          if (order_id) insomnia.globals.set("order_id", order_id);
          const payment_id = jsonBody?.order?.payment?.id;
          if (payment_id) insomnia.globals.set("payment_id", payment_id);
          const confirmation_id = jsonBody?.order?.payment?.next_action?.confirm_payment?.request?.id;
          if (confirmation_id) insomnia.globals.set("confirmation_id", confirmation_id);
          const checkout_url = jsonBody?.order?.invoice?.format?.web?.url;
          if (checkout_url) insomnia.globals.set("checkout_url", checkout_url);
          insomnia.test('Returns an order identifier', () => {
            insomnia.expect(order_id).to.be.a('string').and.not.be.empty;
          });
          insomnia.test('Returns a hosted checkout URL', () => {
            insomnia.expect(checkout_url).to.be.a('string').and.match(/^https?:\/\//);
          });
          const line_items = jsonBody?.order?.line_item_group?.line_items ?? [];
          const line_item_ids = line_items
            .map((line_item) => line_item?.product?.id ?? line_item?.fee?.id ?? line_item?.shipping?.id)
            .filter(Boolean);
          if (line_item_ids[0]) insomnia.globals.set("order_line_item_id", line_item_ids[0]);
          insomnia.test('Returns typed order line item identifiers', () => {
            insomnia.expect(line_items).to.be.an('array').and.not.be.empty;
            insomnia.expect(line_item_ids.length).to.equal(line_items.length);
            for (const line_item_id of line_item_ids) {
              insomnia.expect(line_item_id).to.match(/^oli_/);
            }
          });
        }
  - name: Pay for an order
    url: '{{ base_url }}/orders/pay'
    method: POST
    meta:
      id: req_17973aff414d87c35f53f896d0efc411
      description: 'Public reference: https://studio.inttegro.com/orders#pay-for-an-order. Conflict reference: https://studio.inttegro.com/e/payment_transition_conflict'
    headers:
    - name: Content-Type
      value: application/json
    - name: Idempotency-Key
      value: call-order-pay-{{ order_id }}
    body:
      mimeType: application/json
      text: |-
        {
          "order_id": "{{ order_id }}",
          "payment_method_data": {
            "type": "mobile_money",
            "mobile_money": {
              "network": "mtn",
              "account_number": "{{ mobile_money_account_number }}"
            }
          }
        }
    scripts:
      afterResponse: |-
        if (insomnia.response.code >= 200 && insomnia.response.code < 300) {
          const jsonBody = insomnia.response.json();
          const payment_id = jsonBody?.order?.payment?.id;
          if (payment_id) insomnia.globals.set("payment_id", payment_id);
          const confirmation_id = jsonBody?.order?.payment?.next_action?.confirm_payment?.request?.id;
          if (confirmation_id) insomnia.globals.set("confirmation_id", confirmation_id);
        }
  - name: Confirm a payment
    url: '{{ base_url }}/orders/confirm_payment'
    method: POST
    meta:
      id: req_38bb6f1168e91d79d90a734c8635a93c
      description: 'Public reference: https://studio.inttegro.com/orders#confirm-a-payment. Conflict reference: https://studio.inttegro.com/e/payment_transition_conflict'
    headers:
    - name: Content-Type
      value: application/json
    - name: Idempotency-Key
      value: call-order-confirm-{{ confirmation_id }}
    body:
      mimeType: application/json
      text: |-
        {
          "confirmation_id": "{{ confirmation_id }}",
          "order_id": "{{ order_id }}",
          "payment_id": "{{ payment_id }}",
          "token": "{{ confirmation_token }}"
        }
  - name: Request confirmation
    url: '{{ base_url }}/orders/request_confirmation'
    method: POST
    meta:
      id: req_26e6325af60dab964f16ab1ee05656e0
      description: 'Public reference: https://studio.inttegro.com/orders#request-confirmation'
    headers:
    - name: Content-Type
      value: application/json
    - name: Idempotency-Key
      value: call-order-request-confirmation-{{ order_id }}
    body:
      mimeType: application/json
      text: |-
        {
          "order_id": "{{ order_id }}"
        }
    scripts:
      afterResponse: |-
        if (insomnia.response.code >= 200 && insomnia.response.code < 300) {
          const jsonBody = insomnia.response.json();
          const payment_id = jsonBody?.order?.payment?.id;
          if (payment_id) insomnia.globals.set("payment_id", payment_id);
          const confirmation_id = jsonBody?.order?.payment?.next_action?.confirm_payment?.request?.id;
          if (confirmation_id) insomnia.globals.set("confirmation_id", confirmation_id);
        }
  - name: Update an order
    url: '{{ base_url }}/orders/update'
    method: POST
    meta:
      id: req_23d54d4eb5703e09c5438c0bd55fcf06
      description: 'Public reference: https://studio.inttegro.com/orders#update-an-order'
    headers:
    - name: Content-Type
      value: application/json
    - name: Idempotency-Key
      value: call-order-update-{{ order_id }}
    body:
      mimeType: application/json
      text: |-
        {
          "order_id": "{{ order_id }}",
          "receipt_number": "RCPT-2025-041-REV1",
          "line_items": [
            {
              "type": "product",
              "product": {
                "name": "Quarterly support retainer",
                "type": "digital",
                "price": {
                  "currency": "ghs",
                  "value": 15000
                },
                "quantity": 1
              }
            },
            {
              "type": "fee",
              "fee": {
                "label": "Service fee",
                "amount": {
                  "currency": "ghs",
                  "value": 500
                }
              }
            }
          ],
          "statement_descriptor": "ORDER REVISION",
          "custom_data": {
            "channel": "dashboard",
            "edited_by": "ops"
          },
          "finalize": true
        }
  - name: Finalize an order
    url: '{{ base_url }}/orders/finalize'
    method: POST
    meta:
      id: req_440d3be66b72eeb649744c6536fa38cd
      description: 'Public reference: https://studio.inttegro.com/orders#finalize-an-order'
    headers:
    - name: Content-Type
      value: application/json
    - name: Idempotency-Key
      value: call-order-finalize-{{ order_id }}
    body:
      mimeType: application/json
      text: |-
        {
          "order_id": "{{ order_id }}"
        }
  - name: Send an invoice
    url: '{{ base_url }}/orders/send_invoice'
    method: POST
    meta:
      id: req_f05c7e422151fa011fcfad883cd58c8b
      description: 'Public reference: https://studio.inttegro.com/orders#send-an-invoice'
    headers:
    - name: Content-Type
      value: application/json
    - name: Idempotency-Key
      value: call-order-send-invoice-{{ order_id }}
    body:
      mimeType: application/json
      text: |-
        {
          "order_id": "{{ order_id }}"
        }
  - name: Send a receipt
    url: '{{ base_url }}/orders/send_receipt'
    method: POST
    meta:
      id: req_3272a2c3a2217b9f92eff637053b2dbe
      description: 'Public reference: https://studio.inttegro.com/orders#send-a-receipt'
    headers:
    - name: Content-Type
      value: application/json
    - name: Idempotency-Key
      value: call-order-send-receipt-{{ order_id }}
    body:
      mimeType: application/json
      text: |-
        {
          "order_id": "{{ order_id }}"
        }
  - name: Complete an order
    url: '{{ base_url }}/orders/complete'
    method: POST
    meta:
      id: req_4d656a29aa1dfc57595c93b08ea6484f
      description: 'Public reference: https://studio.inttegro.com/orders#complete-an-order. Conflict reference: https://studio.inttegro.com/e/payment_transition_conflict'
    headers:
    - name: Content-Type
      value: application/json
    - name: Idempotency-Key
      value: call-order-complete-{{ order_id }}
    body:
      mimeType: application/json
      text: |-
        {
          "order_id": "{{ order_id }}"
        }
  - name: Lookup an order
    url: '{{ base_url }}/orders/lookup'
    method: POST
    meta:
      id: req_f527be43cb09f4aa441f0fb536748616
      description: 'Public reference: https://studio.inttegro.com/orders#lookup-an-order'
    headers:
    - name: Content-Type
      value: application/json
    body:
      mimeType: application/json
      text: |-
        {
          "order_id": "{{ order_id }}"
        }
  - name: Cancel an order
    url: '{{ base_url }}/orders/cancel'
    method: POST
    meta:
      id: req_0940d0b487c63851610fd1c2e8ae1b9c
      description: 'Public reference: https://studio.inttegro.com/orders#cancel-an-order'
    headers:
    - name: Content-Type
      value: application/json
    - name: Idempotency-Key
      value: call-order-cancel-{{ order_id }}
    body:
      mimeType: application/json
      text: |-
        {
          "order_id": "{{ order_id }}",
          "reason": "customer_request",
          "execute_refund": false
        }
  - name: Page through orders
    url: '{{ base_url }}/orders/page'
    method: POST
    meta:
      id: req_33211617adf2f14d3239261650169c52
      description: 'Public reference: https://studio.inttegro.com/orders#page-through-orders'
    headers:
    - name: Content-Type
      value: application/json
    body:
      mimeType: application/json
      text: |-
        {
          "page_number": 0,
          "page_size": 25
        }
- name: Public checkout
  meta:
    id: fld_79b956d2f8b949c39cc2ed5f047c91cc
    description: Inspect and pay a finalized Order from a client application without an Inttegro secret API key.
  authentication:
    type: none
  scripts:
    afterResponse: |-
      insomnia.test('Returns a handled HTTP status', () => {
        insomnia.expect(insomnia.response.code).to.be.within(200, 504);
      });
  children:
  - name: Look up a public checkout order
    url: '{{ base_url }}/checkout/lookup'
    method: POST
    meta:
      id: req_86406f777146480684c6ea920a00d953
      description: 'OpenAPI operation: POST /checkout/lookup'
    headers:
    - name: Content-Type
      value: application/json
    body:
      mimeType: application/json
      text: |-
        {
          "order_id": "{{ order_id }}"
        }
  - name: Pay a public checkout order
    url: '{{ base_url }}/checkout/pay'
    method: POST
    meta:
      id: req_c282b42c7dbd4ba3a590509ba5e13d1d
      description: |-
        OpenAPI operation: POST /checkout/pay
        This example supplies payer billing details for a new payment method without changing shipping or saving the method.
    headers:
    - name: Content-Type
      value: application/json
    - name: Idempotency-Key
      value: call-checkout-pay-{{ order_id }}
    body:
      mimeType: application/json
      text: |-
        {
          "order_id": "{{ order_id }}",
          "payment_method_data": {
            "type": "mobile_money",
            "mobile_money": {
              "network": "mtn",
              "account_number": "+233544998605"
            },
            "billing_details": {
              "name": "Ama Mensah",
              "phone_number": "+233544998605",
              "address": {
                "line1": "15 Main Street",
                "city": "Accra",
                "region": "Greater Accra",
                "country": "GH"
              }
            }
          },
          "save_payment_method": false
        }
  - name: Request public checkout confirmation
    url: '{{ base_url }}/checkout/request_confirmation'
    method: POST
    meta:
      id: req_3b6603115a6b47f0b2aa89a4750d67fc
      description: 'OpenAPI operation: POST /checkout/request_confirmation'
    headers:
    - name: Content-Type
      value: application/json
    - name: Idempotency-Key
      value: call-checkout-request-confirmation-{{ order_id }}
    body:
      mimeType: application/json
      text: |-
        {
          "order_id": "{{ order_id }}"
        }
  - name: Confirm a public checkout payment
    url: '{{ base_url }}/checkout/confirm_payment'
    method: POST
    meta:
      id: req_97d0dce56a634fb8a20e29a5a6cc7a55
      description: 'OpenAPI operation: POST /checkout/confirm_payment'
    headers:
    - name: Content-Type
      value: application/json
    - name: Idempotency-Key
      value: call-checkout-confirm-payment-{{ order_id }}
    body:
      mimeType: application/json
      text: |-
        {
          "order_id": "{{ order_id }}",
          "token": "{{ confirmation_token }}"
        }
environments:
  name: Base Environment
  meta:
    id: env_81c7d05aaf81bf6d3140a8d095acf218
  data: {}
