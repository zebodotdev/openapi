type: collection.insomnia.rest/5.0
schema_version: '5.1'
name: Commerce API — Catalog
meta:
  id: wrk_260fc3dcee7afa1e9132f8696556869e
  description: Create and manage products and prices. Uses the shared Commerce API global environment.
collection:
- name: Products
  meta:
    id: fld_0a3e27b8ca818264d75c8d816c12922c
    description: Create and manage products in the catalog.
  authentication:
    type: bearer
    token: '{{ api_key }}'
    prefix: Bearer
  scripts:
    preRequest: |-
      insomnia.variables.set(
        'future_timestamp',
        new Date(Date.now() + 7 * 24 * 60 * 60 * 1000).toISOString(),
      );
    afterResponse: |-
      insomnia.test('Returns a successful HTTP status', () => {
        insomnia.expect(insomnia.response.code).to.be.within(200, 299);
      });
  children:
  - name: Create a product
    url: '{{ base_url }}/products/create'
    method: POST
    meta:
      id: req_f425e96e754cec2194c451d2e3407a24
      description: 'Public reference: https://studio.inttegro.com/products#create-a-product'
    headers:
    - name: Content-Type
      value: application/json
    body:
      mimeType: application/json
      text: |-
        {
          "name": "Premium Cotton T-Shirt",
          "type": "physical",
          "description": "Comfortable everyday wear",
          "about": "Our premium cotton t-shirt is made from 100% organic cotton...",
          "category": "clothing",
          "attributes": [
            {
              "name": "Size",
              "value": "Medium"
            },
            {
              "name": "Color",
              "value": "Blue"
            }
          ],
          "media": {
            "hero_image": "file_abc123",
            "gallery": [
              "file_def456",
              "file_ghi789"
            ]
          },
          "custom_data": {
            "season": "summer",
            "material": "organic_cotton"
          }
        }
    scripts:
      afterResponse: |-
        if (insomnia.response.code >= 200 && insomnia.response.code < 300) {
          const jsonBody = insomnia.response.json();
          const product_id = jsonBody?.product?.id;
          insomnia.test('Returns product.id', () => {
            insomnia.expect(product_id).to.be.a('string').and.not.be.empty;
          });
          if (product_id) insomnia.globals.set("product_id", product_id);
        }
  - name: Lookup a product
    url: '{{ base_url }}/products/lookup'
    method: POST
    meta:
      id: req_d3f536c6b931a94a39b20909ad39c063
      description: 'Public reference: https://studio.inttegro.com/products#lookup-a-product'
    headers:
    - name: Content-Type
      value: application/json
    body:
      mimeType: application/json
      text: |-
        {
          "product_id": "{{ product_id }}"
        }
  - name: Add a price to a product
    url: '{{ base_url }}/products/add_price'
    method: POST
    meta:
      id: req_12345083dabf30e819783fa191cba34e
      description: 'Public reference: https://studio.inttegro.com/products#add-a-price-to-a-product'
    headers:
    - name: Content-Type
      value: application/json
    body:
      mimeType: application/json
      text: |-
        {
          "product_id": "{{ product_id }}",
          "label": "Wholesale",
          "about": "Preferred rate for repeat buyers",
          "amount": {
            "currency": "ghs",
            "value": 85000
          }
        }
    scripts:
      afterResponse: |-
        if (insomnia.response.code >= 200 && insomnia.response.code < 300) {
          const jsonBody = insomnia.response.json();
          const price_id = jsonBody?.price?.id;
          insomnia.test('Returns price.id', () => {
            insomnia.expect(price_id).to.be.a('string').and.not.be.empty;
          });
          if (price_id) insomnia.globals.set("price_id", price_id);
        }
  - name: Update a product
    url: '{{ base_url }}/products/update'
    method: POST
    meta:
      id: req_af182e02c8057e11132b44425369b485
      description: 'Public reference: https://studio.inttegro.com/products#update-a-product'
    headers:
    - name: Content-Type
      value: application/json
    body:
      mimeType: application/json
      text: |-
        {
          "product_id": "{{ product_id }}",
          "description": "Premium everyday comfort",
          "category": "apparel"
        }
  - name: Publish a product
    url: '{{ base_url }}/products/publish'
    method: POST
    meta:
      id: req_2854e514c69fbb215d19b7e69b57899b
      description: 'Public reference: https://studio.inttegro.com/products#publish-a-product'
    headers:
    - name: Content-Type
      value: application/json
    body:
      mimeType: application/json
      text: |-
        {
          "product_id": "{{ product_id }}"
        }
  - name: Unpublish a product
    url: '{{ base_url }}/products/unpublish'
    method: POST
    meta:
      id: req_d26dde2c01ef63f6b53601cf115bf07d
      description: 'Public reference: https://studio.inttegro.com/products#unpublish-a-product'
    headers:
    - name: Content-Type
      value: application/json
    body:
      mimeType: application/json
      text: |-
        {
          "product_id": "{{ product_id }}"
        }
  - name: Archive a product
    url: '{{ base_url }}/products/archive'
    method: POST
    meta:
      id: req_61448b22f9f5da5c07c79b9f55b0a5e8
      description: 'Public reference: https://studio.inttegro.com/products#archive-a-product'
    headers:
    - name: Content-Type
      value: application/json
    body:
      mimeType: application/json
      text: |-
        {
          "product_id": "{{ product_id }}"
        }
  - name: Page through products
    url: '{{ base_url }}/products/page'
    method: POST
    meta:
      id: req_9b5837cc437243e2f03f3c26447eca24
      description: 'Public reference: https://studio.inttegro.com/products#page-through-products'
    headers:
    - name: Content-Type
      value: application/json
    body:
      mimeType: application/json
      text: |-
        {
          "page_number": 1,
          "page_size": 50
        }
