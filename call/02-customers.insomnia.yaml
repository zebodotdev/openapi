type: collection.insomnia.rest/5.0
schema_version: '5.1'
name: Commerce API — Customers
meta:
  id: wrk_584fcff54163c843eb640247b717a86a
  description: Create, retrieve, update, and page customer records. Uses the shared Commerce API global environment.
collection:
- name: Customers
  meta:
    id: fld_21eb2153dd1483cd67a621fb2c7b2f65
    description: Create, retrieve, update, and list customer records.
  authentication:
    type: bearer
    token: '{{ api_key }}'
    prefix: Bearer
  scripts:
    preRequest: |-
      insomnia.variables.set(
        'future_timestamp',
        new Date(Date.now() + 7 * 24 * 60 * 60 * 1000).toISOString(),
      );
    afterResponse: |-
      insomnia.test('Returns a successful HTTP status', () => {
        insomnia.expect(insomnia.response.code).to.be.within(200, 299);
      });
  children:
  - name: Create customer
    url: '{{ base_url }}/customers/create'
    method: POST
    meta:
      id: req_6c0520c6f42bee7c2ef256a6b8025a64
      description: 'Public reference: https://studio.inttegro.com/customers#create-customer'
    headers:
    - name: Content-Type
      value: application/json
    - name: Idempotency-Key
      value: '{{ idempotency_key }}'
    body:
      mimeType: application/json
      text: |-
        {
          "name": "Jane Mensah",
          "title": "Ms.",
          "reference": "user_123456",
          "email_address": "{{ customer_email }}",
          "phone_number": "{{ customer_phone }}",
          "custom_data": {
            "loyalty_tier": "gold",
            "account_manager": "am_789"
          }
        }
    scripts:
      afterResponse: |-
        if (insomnia.response.code >= 200 && insomnia.response.code < 300) {
          const jsonBody = insomnia.response.json();
          const customer_id = jsonBody?.customer?.id;
          const balance = jsonBody?.customer?.balance;
          insomnia.test('Returns customer.id', () => {
            insomnia.expect(customer_id).to.be.a('string').and.not.be.empty;
          });
          insomnia.test('Returns customer.balance as an object', () => {
            insomnia.expect(balance).to.be.an('object');
          });
          insomnia.test('Returns required customer.guest', () => {
            insomnia.expect(jsonBody?.customer?.guest).to.be.a('boolean');
          });
          if (customer_id) insomnia.globals.set("customer_id", customer_id);
        }
  - name: Lookup customer
    url: '{{ base_url }}/customers/lookup'
    method: POST
    meta:
      id: req_bae580c845a925882e98ba293674e643
      description: 'Public reference: https://studio.inttegro.com/customers#lookup-customer'
    headers:
    - name: Content-Type
      value: application/json
    body:
      mimeType: application/json
      text: |-
        {
          "customer_id": "{{ customer_id }}"
        }
    scripts:
      afterResponse: |-
        if (insomnia.response.code >= 200 && insomnia.response.code < 300) {
          const jsonBody = insomnia.response.json();
          insomnia.test('Returns customer.balance as an object', () => {
            insomnia.expect(jsonBody?.customer?.balance).to.be.an('object');
          });
          insomnia.test('Returns required customer.guest', () => {
            insomnia.expect(jsonBody?.customer?.guest).to.be.a('boolean');
          });
        }
  - name: Update customer
    url: '{{ base_url }}/customers/update'
    method: POST
    meta:
      id: req_4f5efc1e1ec847ad9317d93ce762e71f
      description: 'Public reference: https://studio.inttegro.com/customers#update-customer'
    headers:
    - name: Content-Type
      value: application/json
    - name: Idempotency-Key
      value: '{{ idempotency_key }}'
    body:
      mimeType: application/json
      text: |-
        {
          "customer_id": "{{ customer_id }}",
          "title": "Dr.",
          "reference": "user_123456_updated",
          "custom_data": {
            "loyalty_tier": "platinum"
          },
          "shipping_address": {
            "country": "GH",
            "city": "Accra"
          }
        }
    scripts:
      afterResponse: |-
        insomnia.test('Returns the replacement customer data', () => {
          insomnia.expect(insomnia.response.code).to.equal(200);
          const customer = insomnia.response.json()?.customer;
          insomnia.expect(customer?.guest).to.be.a('boolean');
          insomnia.expect(customer?.balance).to.be.an('object');
          insomnia.expect(customer?.updated_at).to.be.a('string');
          insomnia.expect(customer?.reference).to.equal('user_123456_updated');
          insomnia.expect(customer?.custom_data).to.deep.equal({ loyalty_tier: 'platinum' });
          insomnia.expect(customer?.shipping_address?.country).to.equal('GH');
        });
  - name: Page through customers
    url: '{{ base_url }}/customers/page'
    method: POST
    meta:
      id: req_073ac11a4cd034d12098f8bd44f0ab0e
      description: 'Public reference: https://studio.inttegro.com/customers#page-through-customers'
    headers:
    - name: Content-Type
      value: application/json
    body:
      mimeType: application/json
      text: |-
        {
          "page_number": 1,
          "page_size": 50
        }
    scripts:
      afterResponse: |-
        if (insomnia.response.code >= 200 && insomnia.response.code < 300) {
          const jsonBody = insomnia.response.json();
          const customers = jsonBody?.page?.customers;
          insomnia.test('Returns customer balances as objects', () => {
            insomnia.expect(customers).to.be.an('array');
            for (const customer of customers) {
              insomnia.expect(customer?.balance).to.be.an('object');
              insomnia.expect(customer?.guest).to.be.a('boolean');
            }
          });
        }
environments:
  name: Base Environment
  meta:
    id: env_6640a9b3d09d942b4f280911141502bd
  data: {}
