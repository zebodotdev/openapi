                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                '404':
                    description: Secret key not found for the authenticated application
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                '409':
                    description: A request with this idempotency key is still in progress
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                '422':
                    description: Unprocessable entity - invalid parameters or update failure
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                '503':
                    description: Idempotency or key storage is temporarily unavailable
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
    /keys/destroy:
        post:
            summary: Revoke a secret key
            description: Revokes a secret key owned by the authenticated application. A revoked key cannot authenticate future requests but remains visible as public metadata.
            operationId: destroySecretKey
            tags:
                - API Keys
            parameters:
                - $ref: '#/components/parameters/IdempotencyKey'
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
