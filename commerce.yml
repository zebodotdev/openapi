                    $ref: '#/components/schemas/Order'
        Order:
            type: object
            description: Complete order record with line items, customer details, payment state, and fulfillment information
            required:
                - customer
                - id
                - initiated_at
                - status
            properties:
                canceled_at:
                    type: string
                    format: date-time
                    description: When the order was canceled. Omitted otherwise.
                checkout_settings:
                    type: object
                    description: Checkout and payment flow configuration for this order
                    properties:
                        redirect_url:
                            type: string
                            format: uri
                            description: URL to redirect the customer after payment completion
                        cancel_url:
                            type: string
                            format: uri
                            description: URL to redirect the customer after canceling checkout
                completed_at:
                    type: string
                    format: date-time
                    description: When the order was completed. Omitted otherwise.
                created_from:
                    type: object
                    description: Attribution for the public resource that created this order, when available.
                    properties:
                        source:
                            type: string
                        resource_type:
                            type: string
                            enum: [purchase_intent]
                        resource_id:
                            type: string
                custom_data:
                    type: object
                    description: Order-level custom metadata. Omitted when empty.
                    additionalProperties:
                        type: string
                customer:
                    type: object
                    required:
                        - guest
                        - id
                        - name
                    properties:
                        id:
                            type: string
                        guest:
                            type: boolean
                        name:
                            type: string
                        email_address:
                            type: string
                            format: email
                        phone_number:
                            type: string
                        billing_address:
                            $ref: '#/components/schemas/OrderAddress'
                        shipping_address:
                            $ref: '#/components/schemas/OrderAddress'
                expires_at:
                    type: string
                    format: date-time
                    description: When the order expires. Omitted when no expiry is set.
                id:
                    type: string
                    description: Unique identifier for this order
                    example: "or_48ZW7BGvYUBWc1i6WBkL2jr0iPQP5jUy76mmmHpt"
                initiated_at:
                    type: string
                    format: date-time
                    description: When order processing began
                invoice:
                    type: object
                    properties:
                        number:
                            type: string
                        format:
                            type: object
                            required: [web, pdf]
                            properties:
                                web:
                                    $ref: '#/components/schemas/OrderDocumentFormat'
                                pdf:
                                    $ref: '#/components/schemas/OrderDocumentFormat'
                                receipt:
                                    $ref: '#/components/schemas/OrderDocumentFormat'
                number:
                    type: string
                    description: Human-readable order number
                    example: "ORDER-12345"
                receipt_number:
                    type: string
                    description: Merchant-provided receipt number, when set
                    example: "RCPT-12345"
                invoice_settings:
                    $ref: '#/components/schemas/InvoiceSettings'
                status:
                    type: string
                    enum: [preparing, requires_payment, paid, completed, canceled, expired, unknown]
                    description: Current lifecycle state of the order
                    example: "completed"
                sealed_at:
                    type: string
                    format: date-time
                    description: When the order was finalized and became immutable—ready for payment or fulfillment
                    example: "2025-09-14T16:24:41.312701813Z"
                line_item_group:
                    type: object
                    description: Cart contents and totals
                    required:
                        - line_items
                        - total
                    properties:
                        line_items:
                            type: array
                            description: Array of products, fees, and shipping charges
                            items:
                                $ref: '#/components/schemas/OrderLineItem'
                        total:
                            $ref: '#/components/schemas/Money'
                payment:
                    type: object
                    description: Payment intent tied to this order
                    required:
                        - amount
                        - id
                        - initiated_at
                        - statement_descriptor
                        - status
                    properties:
                        id:
                            type: string
                            description: Payment intent ID
                            example: "py_OHFv6I3OZBvB1R46TQQGNxPPtgbPR6CXpQ8En9wl"
                        status:
                            type: string
                            enum: [initiated, requires_action, overdue, executed, paid, canceled, expired, failed, unknown]
                            description: Payment state
                            example: "paid"
                        statement_descriptor:
                            type: string
                            description: Optional statement descriptor shown on the customer's bank statement
                            example: "STATEMENT"
                        amount:
                            $ref: '#/components/schemas/Money'
                        payment_method:
                            $ref: '#/components/schemas/OrderPaymentMethod'
                        latest_attempt:
                            type: object
                            description: Most recent payment attempt details
                            properties:
                                payment_method_type:
                                    type: string
                                    example: "mobile_money"
                                payment_method_id:
                                    type: string
                                    example: "pm_hg7D2A5qT6g6mVDSJu6zweKXwsiiNWf3Q85book6"
                                reference:
                                    type: string
                                    description: External payment reference
                                    example: "68c6ecbc3bf0a6548973b598"
                                status:
                                    type: string
                                    enum: [initiated, executed, succeeded, canceled, expired, failed, unknown]
                                    example: "succeeded"
                                initiated_at:
                                    type: string
                                    format: date-time
                                succeeded_at:
                                    type: string
                                    format: date-time
                        next_action:
                            $ref: '#/components/schemas/PaymentNextAction'
                        initiated_at:
                            type: string
                            format: date-time
                            description: When we kicked off the payment intent
                        executed_at:
                            type: string
                            format: date-time
                            description: When payment execution started
                        paid_at:
                            type: string
                            format: date-time
                            description: When payment completed successfully
                        canceled_at:
                            type: string
                            format: date-time
                            description: When payment was canceled
                        due_at:
                            type: string
                            format: date-time
                            description: When payment becomes overdue
                        expired_at:
                            type: string
                            format: date-time
                            description: When payment expired
                        failed_at:
                            type: string
                            format: date-time
                            description: When payment failed
                        paid_offline:
                            type: boolean
                            description: Whether payment was recorded as received outside Commerce
                        payment_method_types:
                            type: array
                            items:
                                type: string
                        payout_configuration:
                            type: object
                            description: Payout configuration for this payment
                            nullable: true
                            properties:
                                enable_fx:
                                    type: boolean
                                    enum: [false]
                                    description: Compatibility flag. Cross-currency payout execution is not currently available.
                                    example: false
                                destination:
                                    type: object
                                    description: Where the funds will be paid out
                                    properties:
                                        financial_account_id:
                                            type: string
                                            description: ID of the financial account receiving the payout
                                            example: "fa_1234567890abcdef"
                paid_at:
                    type: string
                    format: date-time
                    description: When the order became paid
                payment_due_at:
                    type: string
                    format: date-time
                    description: When the order payment becomes overdue
                payout_settings:
                    type: object
                    description: Order-level payout settings when configured
                reference:
                    type: string
                    description: External order reference when present
                shipping:
                    type: object
                    description: Shipping details when present
