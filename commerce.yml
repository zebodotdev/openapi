---
openapi: 3.0.3
info:
    title: the commerce http api
    description: machine-readable representation of the commerce http api
    version: 0.1.0-beta1
    contact:
        name: Zebo Engineering
        url: "https://inttegro.com"
        email: "engineering@inttegro.com"
servers:
    - url: "https://api.inttegro.com"
      description: Production
security:
    - bearerAuth: []
paths:
    /otp/initiate:
        post:
            summary: Initiate OTP transaction
            description: |
                Generate a one-time password and deliver it by SMS. Store the returned transaction ID
                and use it with the recipient's submitted code at the verification endpoint. Retry an
                uncertain initiation with the same idempotency key and body.
            operationId: initiateOTP
            tags:
                - OTP
            parameters:
                - $ref: '#/components/parameters/IdempotencyKey'
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/InitiateOTPRequest'
            responses:
                '200':
                    description: OTP transaction initiated successfully
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/InitiateOTPResponse'
                '400':
                    description: Bad request - invalid parameters
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorEnvelope'
                '401':
                    description: Unauthorized - invalid or missing API key
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorEnvelope'
                '422':
                    description: OTP transaction could not be initiated
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorEnvelope'
    /otp/verify:
        post:
            summary: Verify OTP token
            description: |
                Check the code submitted by the recipient and record the attempt. A completed request
                returns a `pass` or `fail` verdict; retry an uncertain verification with the same
                idempotency key and body.
            operationId: verifyOTP
            tags:
                - OTP
            parameters:
                - $ref: '#/components/parameters/IdempotencyKey'
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/VerifyOTPRequest'
            responses:
                '200':
                    description: Verification attempt completed (check verdict in response)
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/VerifyOTPResponse'
                '400':
                    description: Bad request - invalid parameters
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorEnvelope'
                '401':
                    description: Unauthorized - invalid or missing API key
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorEnvelope'
                '422':
                    description: OTP token could not be verified
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorEnvelope'
    /otp/lookup:
        post:
            summary: Lookup OTP transaction
            description: |
                Retrieve the delivery, verification, and expiry state of an OTP transaction by ID.
                The generated token is never returned by this endpoint.
            operationId: lookupOTP
            tags:
                - OTP
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/LookupOTPRequest'
            responses:
                '200':
                    description: OTP transaction retrieved successfully
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/LookupOTPResponse'
                '400':
                    description: Bad request - invalid parameters
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorEnvelope'
                '401':
                    description: Unauthorized - invalid or missing API key
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorEnvelope'
                '422':
                    description: OTP transaction could not be found or loaded
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorEnvelope'
    /chimes/send:
        post:
            summary: Send a Chime
            description: Send one SMS or email notification immediately.
            operationId: sendChime
            tags: [Chimes]
            parameters:
                - $ref: '#/components/parameters/IdempotencyKey'
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/SendChimeRequest'
            responses:
                '200':
                    description: Chime sent
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ChimeResponse'
                '400':
                    description: Invalid request
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorEnvelope'
                '401':
                    description: Authorization is required
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorEnvelope'
                '404':
                    description: Referenced template not found
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorEnvelope'
                '409':
                    description: Referenced template is not usable
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorEnvelope'
                '422':
                    description: Chime could not be sent or the idempotency key conflicts
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorEnvelope'
                '500':
                    description: Chime send failed unexpectedly
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorEnvelope'
                '503':
                    description: Chime send hit a transient dependency failure
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorEnvelope'
    /chimes/lookup:
        post:
            summary: Look up a Chime
            description: Retrieve a sent Chime and its current transmission state.
            operationId: lookupChime
            tags: [Chimes]
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/LookupChimeRequest'
            responses:
                '200':
                    description: Chime found
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ChimeResponse'
                '400':
                    description: Invalid request
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorEnvelope'
                '401':
                    description: Authorization is required
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorEnvelope'
                '422':
                    description: Chime could not be found
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorEnvelope'
