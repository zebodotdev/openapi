                                                        example: "oli_VyxdsD4iP6K3H2z76eBdP9NSqmJLeDbxqnsl1Zhr"
                                                    name:
                                                        type: string
                                                        description: Product name
                                                        example: "Bespoke Ceramic Cheese"
                                                    about:
                                                        type: string
