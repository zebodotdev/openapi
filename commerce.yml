    /chimes/broadcast:
        post:
            summary: Broadcast Chimes
            description: Start an asynchronous SMS or email broadcast to one or more recipients.
            operationId: broadcastChime
            tags: [Chimes]
            parameters:
                - $ref: '#/components/parameters/IdempotencyKey'
