                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/BroadcastRequest'
            responses:
                '202':
                    description: Broadcast accepted
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/BroadcastResponse'
                '400':
                    description: Invalid request
