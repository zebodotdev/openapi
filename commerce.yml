                '401':
                    description: Unauthorized - invalid or missing API key
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorEnvelope'
                '422':
                    description: Balance transactions could not be retrieved
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorEnvelope'

    /payouts/schedule:
        post:
            summary: Schedule a payout
            description: |
                Create and schedule a payout to move funds from your available balance to a
                connected financial account. The request chooses the destination, caps the
                maximum amount that may leave your balance, and optionally delays execution
                until a future timestamp.
            operationId: schedulePayout
            tags:
                - Payouts
            parameters:
                - $ref: '#/components/parameters/IdempotencyKey'
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            required:
                                - destination_id
                                - reference
                            properties:
                                destination_id:
                                    type: string
                                    description: Financial account that should receive the payout
                                    example: "fa_1234567890abcdef"
                                execute_after:
                                    type: string
                                    format: date-time
                                    description: Optional future time after which execution may begin
                                    example: "2026-08-05T09:00:00Z"
                                max_amount:
                                    type: integer
                                    minimum: 1
                                    description: Maximum amount, in the smallest currency unit, that this payout may transfer
                                    example: 250000
                                reference:
                                    type: string
                                    description: Merchant reference carried on the payout
                                    example: "PAYOUT-APR-15"
            responses:
                '200':
                    description: Payout scheduled successfully
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    payout:
                                        $ref: '#/components/schemas/Payout'
                '400':
                    description: Bad request - invalid schedule parameters
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                '401':
                    description: Unauthorized - Missing or invalid authentication
                '500':
                    description: Internal server error - payout scheduling failed unexpectedly
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
    /payouts/lookup:
        post:
            summary: Lookup a payout
            description: |
                Retrieve the current state of a payout by ID. Use this to monitor execution,
                inspect timestamps, review bundled balance transactions, and reconcile the
                final amount that moved to the destination account.
            operationId: lookupPayout
            tags:
                - Payouts
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            required:
                                - payout_id
                            properties:
                                payout_id:
                                    type: string
                                    description: Payout identifier returned when the payout was created
                                    example: "po_yQ2wXm5Dc7Pk9Ls1Vn0RgHaB"
            responses:
                '200':
                    description: Payout found successfully
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    payout:
                                        $ref: '#/components/schemas/Payout'
                '400':
                    description: Bad request - invalid payout identifier
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                '401':
                    description: Unauthorized - Missing or invalid authentication
                '500':
                    description: Internal server error - payout lookup failed unexpectedly
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
    /payouts/set_destinations:
        post:
            summary: Set payout destinations
            description: |
                Configure which financial account should be used for payouts in each currency.
                This endpoint accepts a map of currency codes to financial account IDs. Each financial
                account must be owned by your application, have push operations enabled, and its currency
                must match the currency key in the destinations map.
            operationId: setPayoutDestinations
            tags:
                - Payouts
            parameters:
                - $ref: '#/components/parameters/IdempotencyKey'
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            required:
                                - destinations
                            properties:
                                destinations:
                                    type: object
                                    description: Map of currency codes to financial account IDs
                                    additionalProperties:
                                        type: string
                                    example:
                                        ghs: "fa_1234567890abcdef"
            responses:
                '200':
                    description: Payout destinations set successfully
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    settings:
                                        $ref: '#/components/schemas/PayoutSettingsMutation'
                '401':
                    description: Unauthorized - Missing or invalid authentication
                '400':
                    description: Bad request - invalid destination settings
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                '500':
                    description: Internal server error - payout settings update failed unexpectedly
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
    /payouts/settings:
        post:
            summary: Get payout settings
            description: |
                Retrieve the current payout settings for your application, including configured
                payout destinations and schedule information.
            operationId: getPayoutSettings
            tags:
                - Payouts
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            description: Send an empty JSON object.
                            additionalProperties: false
            responses:
                '200':
                    description: Payout settings retrieved successfully
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    settings:
                                        $ref: '#/components/schemas/PayoutSettingsLookup'
                '401':
                    description: Unauthorized - Missing or invalid authentication
                '400':
                    description: Bad request - invalid request body
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                '500':
                    description: Internal server error - payout settings lookup failed unexpectedly
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
    /payouts/disable:
        post:
            summary: Disable automatic payouts
            description: |
                Disables automatic payouts for your application by switching the payout schedule
                to manual mode. When automatic payouts are disabled, the system will not
                automatically schedule payouts - you must manually trigger them using the
                /payouts/schedule endpoint. Balance transactions must still be at least 7 days
                old before they can be paid out, but the payout will only occur when you
                explicitly request it.
            operationId: disableAutomaticPayouts
            tags:
                - Payouts
            parameters:
                - $ref: '#/components/parameters/IdempotencyKey'
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            description: Send an empty JSON object.
                            additionalProperties: false
            responses:
                '200':
                    description: Automatic payouts disabled successfully
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    settings:
                                        $ref: '#/components/schemas/PayoutSettingsMutation'
                                example:
                                    settings:
                                        id: "ps_1234567890abcdef"
                                        schedule:
                                            id: "PAYOUT_SCHEDULE_MANUAL_11_21_2025"
                                            name: "manual"
                                            type: "manual"
                                            interval: "manual"
                                            schedule_on: "never"
                                            description: "Manual payout schedule. Used when automatic payouts are disabled."
                                            spec:
                                                id: "PAYOUT_SCHEDULE_SPEC_MANUAL_11_21_2025"
                                                t_plus: "168h"
                                                label: "manual"
                                                abide: "strictly"
                                        destinations:
                                            ghs: "fa_1234567890abcdef"
                '401':
                    description: Unauthorized - Missing or invalid authentication
                '400':
                    description: Bad request - invalid request body
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                '500':
                    description: Internal server error - payout settings update failed unexpectedly
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'

    /payouts/enable:
        post:
            summary: Enable automatic payouts
            description: |
                Re-enable automatic payouts for your application. Commerce restores the
                configured automatic payout schedule so eligible balance transactions can be
                queued without a manual scheduling request.
            operationId: enableAutomaticPayouts
            tags:
                - Payouts
            parameters:
                - $ref: '#/components/parameters/IdempotencyKey'
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            description: Send an empty JSON object.
                            additionalProperties: false
            responses:
                '200':
                    description: Automatic payouts enabled successfully
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    settings:
                                        $ref: '#/components/schemas/PayoutSettingsMutation'
                '401':
                    description: Unauthorized - Missing or invalid authentication
                '400':
                    description: Bad request - invalid request body
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                '500':
                    description: Internal server error - payout settings update failed unexpectedly
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
    /payouts/page:
        post:
            summary: Page through payouts
            description: Retrieve a page of payouts for the authenticated application.
            operationId: pagePayouts
            tags:
                - Payouts
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            required:
                                - page_number
                            properties:
                                page_number:
                                    type: integer
                                    minimum: 1
                                    maximum: 10
                                    description: 1-based page index to fetch (1-10 inclusive)
                                page_size:
                                    type: integer
                                    minimum: 1
                                    maximum: 256
                                    default: 256
                                    description: Maximum number of payouts to return (1-256)
            responses:
                '200':
                    description: Page retrieved successfully
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    page:
                                        type: object
                                        required:
                                            - number
                                            - size
                                        properties:
                                            number:
                                                type: integer
                                                description: Page number returned
                                            size:
                                                type: integer
                                                description: Number of payouts returned
                                            payouts:
                                                type: array
                                                items:
                                                    $ref: '#/components/schemas/Payout'
                '401':
                    description: Unauthorized - missing or invalid API key
                '400':
                    description: Bad request - invalid page parameters
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                '500':
                    description: Internal server error - payout lookup failed unexpectedly
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
    /payouts/cancel:
        post:
            summary: Cancel a scheduled payout
            description: |
                Cancel a payout that is still scheduled for a future execution time. A payout
                that has started processing, completed, was already canceled, or whose execution
                time has passed cannot be canceled.
            operationId: cancelPayout
            tags:
                - Payouts
            parameters:
                - $ref: '#/components/parameters/IdempotencyKey'
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            required:
                                - payout_id
                            properties:
                                payout_id:
                                    type: string
                                    description: Scheduled payout ID
                                    example: "po_yQ2wXm5Dc7Pk9Ls1Vn0RgHaB"
            responses:
                '200':
                    description: Payout canceled successfully
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    payout:
                                        $ref: '#/components/schemas/Payout'
                '401':
                    description: Unauthorized - missing or invalid API key
                '400':
                    description: Bad request - payout cannot be canceled
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                '500':
                    description: Internal server error - payout cancellation failed unexpectedly
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
