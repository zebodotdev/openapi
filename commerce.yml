                        application/json:
                            schema:
                                $ref: '#/components/schemas/PageSecretKeysResponse'
                '401':
                    description: Unauthorized - invalid or missing API key
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                '422':
                    description: Unprocessable entity - invalid parameters or read failure
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
    /keys/lookup:
        post:
            summary: Retrieve a secret key
            description: Retrieves public metadata for a secret key owned by the authenticated application. The bearer token is never returned.
            operationId: lookupSecretKey
            tags:
                - API Keys
