---
openapi: 3.0.3
info:
    title: the commerce http api
    description: machine-readable representation of the commerce http api
    version: 0.1.0-beta1
    contact:
        name: Zebo Engineering
        url: "https://zebocommerce.com"
        email: "engineering@zebo.dev"
servers:
    - url: "https://api.zebo.dev"
security:
    - bearerAuth: []
paths:
    /otp/initiate:
        post:
            summary: Initiate OTP transaction
            description: |
                Generate a one-time password and deliver it via SMS or email. Returns a transaction ID
                for subsequent verification. The actual token is never stored - only a cryptographic
                digest (HMAC-SHA256) is retained. Enforces idempotency and rate limiting to prevent
                abuse and duplicate sends.
            operationId: initiateOTP
            tags:
                - OTP
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/InitiateOTPRequest'
            responses:
                '200':
                    description: OTP transaction initiated successfully
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/InitiateOTPResponse'
                '400':
                    description: Bad request - invalid parameters
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                '401':
                    description: Unauthorized - invalid or missing API key
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                '503':
                    description: Service unavailable - retryable send failure
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
    /otp/verify:
        post:
            summary: Verify OTP token
            description: |
                Verify a one-time password by comparing the user-submitted token against the
                transaction's cryptographic digest. Uses constant-time comparison to prevent
                timing attacks. Records all verification attempts regardless of success.
            operationId: verifyOTP
            tags:
                - OTP
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/VerifyOTPRequest'
            responses:
                '200':
                    description: Verification attempt completed (check verdict in response)
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/VerifyOTPResponse'
                '400':
                    description: Bad request - invalid parameters
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                '401':
                    description: Unauthorized - invalid or missing API key
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                '503':
                    description: Service unavailable - retryable scheduling failure
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
    /otp/lookup:
        post:
            summary: Lookup OTP transaction
            description: |
                Retrieve details of an existing OTP transaction by its ID. Returns the complete
                transaction object with status, transmission details, and expiry information.
                Does not include the actual token value.
            operationId: lookupOTP
            tags:
                - OTP
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/LookupOTPRequest'
            responses:
                '200':
                    description: OTP transaction retrieved successfully
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/LookupOTPResponse'
                '400':
                    description: Bad request - invalid parameters
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                '401':
                    description: Unauthorized - invalid or missing API key
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                '404':
                    description: Transaction not found
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
    /otp/cancel:
        post:
            summary: Cancel OTP transaction
            description: |
                Cancel an active OTP transaction to prevent further verification attempts.
                Canceled transactions cannot be verified even if the token hasn't expired.
                Useful when a user requests a new code or needs to abort the verification flow.
            operationId: cancelOTP
            tags:
                - OTP
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/CancelOTPRequest'
            responses:
                '200':
                    description: OTP transaction canceled successfully
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/CancelOTPResponse'
                '400':
                    description: Bad request - invalid parameters
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                '401':
                    description: Unauthorized - invalid or missing API key
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                '404':
                    description: Transaction not found
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
    /chimes/send:
        post:
            summary: Send a chime to a recipient
            description: |
                Sends a notification message (chime) to a single recipient via SMS or email.
                The chime is delivered immediately based on `recipient.transport`.
            operationId: sendChime
            tags:
                - Chimes
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/SendChimeRequest'
            responses:
                '200':
                    description: Chime sent successfully
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ChimeResponse'
                '400':
                    description: Bad request - invalid parameters
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                '401':
                    description: Unauthorized - invalid or missing API key
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                '503':
                    description: Service unavailable - retryable send failure
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
    /chimes/lookup:
        post:
            summary: Look up a chime by ID
            description: |
                Retrieves the details of a previously sent chime by its ID.
                Returns full chime information including transmission status and delivery details.
            operationId: lookupChime
            tags:
                - Chimes
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/LookupChimeRequest'
            responses:
                '200':
                    description: Chime retrieved successfully
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ChimeResponse'
                '400':
                    description: Bad request - invalid parameters
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                '401':
                    description: Unauthorized - invalid or missing API key
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                '404':
                    description: Chime not found
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
    /chimes/page:
        post:
            summary: Retrieve a page of chimes
            description: |
                Retrieves a page of Chimes for the authenticated application.
                Results are sorted by `created_at` in descending order so page 1 contains the newest activity first.
            operationId: pageChimes
            tags:
                - Chimes
            requestBody:
                required: false
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/PageChimesRequest'
            responses:
                '200':
                    description: Chimes retrieved successfully
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/PageChimesResponse'
                '401':
                    description: Unauthorized - invalid or missing API key
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                '422':
                    description: Unprocessable entity - validation failed
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
    /chimes/schedule:
        post:
            summary: Schedule a chime for future delivery
            description: |
                Schedules a notification message for delivery at a specific time.
                Provide `recipients` as recipient objects. Each recipient must include `transport` and either inline contact details or `customer_id` so Commerce can resolve the destination address.
                The chime will be delivered on or after the specified time.
            operationId: scheduleChime
            tags:
                - Chimes
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/ScheduleChimeRequest'
            responses:
                '200':
                    description: Chime scheduled successfully
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ScheduleResponse'
                '400':
                    description: Bad request - invalid parameters
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                '401':
                    description: Unauthorized - invalid or missing API key
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                '503':
                    description: Service unavailable - retryable scheduling failure
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
    /chimes/broadcast:
        post:
            summary: Broadcast a chime immediately
            description: |
                Sends a notification message immediately to one or many recipients.
                Provide `recipients` as recipient objects. Each recipient must include `transport` and either inline contact details or `customer_id` so Commerce can resolve the destination address.
            operationId: broadcastChime
            tags:
                - Chimes
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/BroadcastRequest'
            responses:
                '202':
                    description: Broadcast accepted successfully
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/BroadcastResponse'
                '400':
                    description: Bad request - invalid parameters
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                '401':
                    description: Unauthorized - invalid or missing API key
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                '503':
                    description: Service unavailable - retryable broadcast failure
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
    /schedules/lookup:
        post:
            summary: Look up a scheduled chime by ID
            description: |
                Retrieves the details of a scheduled chime, including all individual chimes
                that were created and their delivery status. Useful for tracking execution
                of scheduled broadcasts and viewing recipient-level delivery results.
            operationId: lookupScheduledChime
            tags:
                - Schedules
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/LookupScheduleRequest'
            responses:
                '200':
                    description: Schedule retrieved successfully
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ScheduleLookupResponse'
                '400':
                    description: Bad request - invalid parameters
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                '401':
                    description: Unauthorized - invalid or missing API key
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                '404':
                    description: Schedule not found
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
    /schedules/cancel:
        post:
            summary: Cancel a scheduled chime
            description: |
                Cancels a scheduled chime before it executes. Once canceled, the schedule
                will not send messages to any recipients. If the schedule has already
                executed or been canceled, this request will fail. Returns the canceled
                schedule with its current state.
            operationId: cancelScheduledChime
            tags:
                - Schedules
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/CancelScheduleRequest'
            responses:
                '200':
                    description: Schedule canceled successfully
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ScheduleCancelResponse'
                '400':
                    description: Bad request - invalid parameters
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                '401':
                    description: Unauthorized - invalid or missing API key
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                '404':
                    description: Schedule not found
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                '422':
                    description: Schedule already executed or canceled
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
    /broadcasts/lookup:
        post:
            summary: Lookup a broadcast
            description: |
                Retrieves details of a broadcast chime, including all individual chimes
                that were created and their delivery status. Use this to track the progress
                and outcome of a broadcast operation.
            operationId: lookupBroadcast
            tags:
                - Broadcasts
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/LookupBroadcastRequest'
            responses:
                '200':
                    description: Broadcast retrieved successfully
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/LookupBroadcastResponse'
                '400':
                    description: Bad request - invalid parameters
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                '401':
                    description: Unauthorized - invalid or missing API key
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                '404':
                    description: Broadcast not found
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
    /broadcasts/cancel:
        post:
            summary: Cancel a broadcast
            description: |
                Cancels a broadcast that hasn't completed yet. Once canceled, no additional
                messages will be sent to recipients. If the broadcast has already completed
                or been canceled, this request will fail. Returns the canceled broadcast
                with its current state.
            operationId: cancelBroadcast
            tags:
                - Broadcasts
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/CancelBroadcastRequest'
            responses:
                '200':
                    description: Broadcast canceled successfully
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/BroadcastCancelResponse'
                '400':
                    description: Bad request - invalid parameters
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                '401':
                    description: Unauthorized - invalid or missing API key
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                '404':
                    description: Broadcast not found
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                '422':
                    description: Broadcast already completed or canceled
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
    /message_templates/create:
        post:
            summary: Create a message template
            description: |
                Creates an app-scoped reusable SMS or email message template. The API generates
                the template `id`; clients must not supply an `id`, `template_id`, or template key.
            operationId: createMessageTemplate
            tags:
                - Message Templates
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/CreateMessageTemplateRequest'
            responses:
                '200':
                    description: Message template created successfully
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/MessageTemplateEnvelope'
                '401':
                    description: Unauthorized - invalid or missing API key
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                '400':
                    description: Bad request - invalid parameters
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                '503':
                    description: Service unavailable - retryable create failure
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
    /message_templates/update:
        post:
            summary: Update a message template
            description: |
                Updates a reusable message template and creates a new draft version. Published
                versions remain stable until the draft is explicitly published.
            operationId: updateMessageTemplate
            tags:
                - Message Templates
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/UpdateMessageTemplateRequest'
            responses:
                '200':
                    description: Message template updated successfully
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/MessageTemplateEnvelope'
                '401':
                    description: Unauthorized - invalid or missing API key
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                '400':
                    description: Bad request - invalid parameters
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                '404':
                    description: Message template not found
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                '409':
                    description: Message template is archived
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                '503':
                    description: Service unavailable - retryable update failure
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
    /message_templates/publish:
        post:
            summary: Publish a message template
            description: Publishes the current draft version of a reusable message template.
            operationId: publishMessageTemplate
            tags:
                - Message Templates
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/MessageTemplateIDRequest'
            responses:
                '200':
                    description: Message template published successfully
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/MessageTemplateEnvelope'
                '401':
                    description: Unauthorized - invalid or missing API key
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                '400':
                    description: Bad request - invalid parameters
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                '404':
                    description: Message template not found
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                '409':
                    description: Message template is archived
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                '503':
                    description: Service unavailable - retryable publish failure
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
    /message_templates/archive:
        post:
            summary: Archive a message template
            description: Archives a reusable message template so it cannot be updated or used for new sends.
            operationId: archiveMessageTemplate
            tags:
                - Message Templates
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/MessageTemplateIDRequest'
            responses:
                '200':
                    description: Message template archived successfully
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/MessageTemplateEnvelope'
                '401':
                    description: Unauthorized - invalid or missing API key
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                '400':
                    description: Bad request - invalid parameters
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                '404':
                    description: Message template not found
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                '503':
                    description: Service unavailable - retryable archive failure
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
    /message_templates/lookup:
        post:
            summary: Look up a message template
            description: Retrieves a reusable message template by its API-generated `id`.
            operationId: lookupMessageTemplate
            tags:
                - Message Templates
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/MessageTemplateIDRequest'
            responses:
                '200':
                    description: Message template retrieved successfully
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/MessageTemplateEnvelope'
                '401':
                    description: Unauthorized - invalid or missing API key
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                '400':
                    description: Bad request - invalid parameters
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                '404':
                    description: Message template not found
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
    /message_templates/page:
        post:
            summary: Page message templates
            description: Retrieves a page of app-scoped reusable message templates.
            operationId: pageMessageTemplates
            tags:
                - Message Templates
            requestBody:
                required: false
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/PageMessageTemplatesRequest'
            responses:
                '200':
                    description: Message templates retrieved successfully
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/MessageTemplatesPageEnvelope'
                '401':
                    description: Unauthorized - invalid or missing API key
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                '400':
                    description: Bad request - invalid parameters
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
    /message_templates/render_preview:
        post:
            summary: Render a message template preview
            description: Renders a draft-aware preview of a reusable message template with bundled variables.
            operationId: renderMessageTemplatePreview
            tags:
                - Message Templates
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/RenderMessageTemplatePreviewRequest'
            responses:
                '200':
                    description: Message template rendered successfully
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/RenderMessageTemplatePreviewResponse'
                '401':
                    description: Unauthorized - invalid or missing API key
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                '400':
                    description: Bad request - validation failed or unsafe rendered output
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                '404':
                    description: Message template not found
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
    /customers/create:
        post:
            summary: Create a customer
            description: |
                Creates a new customer record with contact information. The customer record stores
                name, contact details, and custom metadata. Use this to create reusable customer
                profiles for orders and payments.
            operationId: createCustomer
            tags:
                - Customers
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/CreateCustomerRequest'
            responses:
                '200':
                    description: Customer created successfully
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/CustomerResponse'
                '400':
                    description: Bad request - invalid parameters
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                '401':
                    description: Unauthorized - invalid or missing API key
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                '422':
                    description: Unprocessable entity - validation failed
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
    /customers/lookup:
        post:
            summary: Lookup a customer
            description: |
                Retrieves a customer's details by ID. Returns the full customer record including
                all contact information and custom data.
            operationId: lookupCustomer
            tags:
                - Customers
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/LookupCustomerRequest'
            responses:
                '200':
                    description: Customer found successfully
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/CustomerResponse'
                '400':
                    description: Bad request - invalid parameters
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                '401':
                    description: Unauthorized - invalid or missing API key
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                '404':
                    description: Customer not found
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                '422':
                    description: Unprocessable entity - validation failed
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
    /customers/page:
        post:
            summary: Page through customers
            description: |
                Retrieve a paginated list of customers for the authenticated application.
                Customers are sorted by created_at in descending order, so page 1 contains
                the most recently created customers and subsequent pages step back in time.
            operationId: pageCustomers
            tags:
                - Customers
            requestBody:
                required: false
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                page_number:
                                    type: integer
                                    minimum: 1
                                    maximum: 10
                                    description: 1-based page index to fetch (1-10 inclusive)
                                    default: 1
                                page_size:
                                    type: integer
                                    minimum: 1
                                    maximum: 256
                                    description: Number of customers per page (1-256)
                                    default: 256
            responses:
                '200':
                    description: Page retrieved successfully
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    page:
                                        type: object
                                        properties:
                                            number:
                                                type: integer
                                                description: The page number returned
                                            size:
                                                type: integer
                                                description: The number of customers in this page
                                            customers:
                                                type: array
                                                items:
                                                    $ref: '#/components/schemas/Customer'
                '401':
                    description: Unauthorized - invalid or missing API key
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                '422':
                    description: Unprocessable entity - validation failed
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
    /orders/create:
        post:
            summary: Create a new order
            description: |
                Creates a new order in the Commerce platform. This endpoint supports two flows:
                1. New customer flow: Provide `customer_data` to create a new customer and order
                2. Existing customer flow: Provide `customer_id` and optionally `payment_method_id` for known customers

                The order can be configured to execute payment immediately or require manual payment later.
            operationId: createOrder
            tags:
                - Orders
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            oneOf:
                                - $ref: '#/components/schemas/CreateOrderNewCustomer'
                                - $ref: '#/components/schemas/CreateOrderExistingCustomer'
            responses:
                '200':
                    description: Order created successfully
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/OrderCreateResponse'
                '400':
                    description: Bad request - invalid parameters
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                '401':
                    description: Unauthorized - invalid or missing API key
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
    /orders/new:
        post:
            summary: Create a new order
            description: |
                Creates a new order in the Commerce platform. This endpoint supports two flows:
                1. New customer flow: Provide `customer_data` to create a new customer and order
                2. Existing customer flow: Provide `customer_id` and optionally `payment_method_id` for known customers

                The order can be configured to execute payment immediately or require manual payment later.
            operationId: createOrderAlias
            tags:
                - Orders
            requestBody:
                required: true
