                            properties:
                                order_id:
                                    type: string
                                    description: Unique identifier of the order
                                    example: "JoPtqOmsjgZKwkPvqTrqGsopu07wfC7ttoWqmfwt"
                                token:
                                    type: string
                                    description: Verification token (OTP) sent to customer
                                    example: "302673"
            responses:
                '200':
                    description: Payment confirmed successfully
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Order'
                '400':
