    /financial_accounts/connect:
        post:
            summary: Connect a financial account
            description: |
                Creates a new financial account for an application. This endpoint supports wallet, bank, and dosh account types.
                Wallet accounts currently support mobile money. Bank and dosh types are placeholders for future implementation.
                This endpoint is an alias for creating financial accounts.
            operationId: connectFinancialAccount
            tags:
                - Financial Accounts
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            required:
                                - label
                                - type
                                - reference
                                - currency
                                - owner
                            properties:
                                label:
                                    type: string
                                    minLength: 5
                                    maxLength: 40
                                    description: Account label (5-40 characters)
                                    example: "My Mobile Money Account"
                                type:
                                    type: string
                                    enum: [wallet, bank_account, dosh_account]
                                    description: Type of financial account
                                    example: "wallet"
                                description:
                                    type: string
                                    maxLength: 200
                                    description: Optional account description (0-200 characters)
                                    example: "Primary mobile money account for payouts"
                                reference:
                                    type: string
                                    minLength: 5
                                    maxLength: 40
                                    description: External reference ID (5-40 characters)
                                    example: "REF-2024-001"
                                currency:
                                    type: string
                                    enum: [ghs]
                                    description: Account currency (currently only GHS is supported)
                                    example: "ghs"
                                pull_configuration:
                                    type: object
                                    description: Configuration for pulling funds from this account. When enabled, a mandate is automatically created using request metadata (user agent and IP address).
                                    properties:
                                        enabled:
                                            type: boolean
                                            description: Whether pulling funds is enabled. When true, a payment mandate is created automatically.
                                            example: true
                                        mandate:
                                            type: object
                                            description: Optional mandate parameters. User agent and IP address are captured automatically from request headers.
                                            properties: {}
                                push_configuration:
                                    type: object
                                    description: Configuration for pushing funds to this account
                                    properties:
                                        enabled:
                                            type: boolean
                                            description: Whether pushing funds is enabled
                                            example: true
                                wallet:
                                    type: object
                                    description: Required when type is 'wallet'
                                    required:
                                        - type
                                    properties:
                                        type:
                                            type: string
                                            enum: [mobile_money]
                                            description: Wallet type (currently only mobile_money is supported)
                                            example: "mobile_money"
                                        mobile_money:
                                            type: object
                                            description: Required when wallet type is 'mobile_money'
                                            required:
                                                - account_number
                                                - network
                                            properties:
                                                account_number:
                                                    type: string
                                                    description: Mobile money account number
                                                    example: "0241234567"
                                                network:
                                                    type: string
                                                    description: Mobile money network
                                                    example: "mtn"
                                bank_account:
                                    type: object
                                    description: Required when type is 'bank_account'
                                    required:
                                        - type
                                    properties:
                                        type:
                                            type: string
                                            enum: [ghana_bank_account]
                                            description: Bank account type (currently only ghana_bank_account is supported)
                                            example: "ghana_bank_account"
                                        ghana_bank_account:
                                            type: object
                                            description: Required when bank account type is 'ghana_bank_account'. At least one of sort_code or swift_code must be provided to identify the banking institution.
                                            required:
                                                - number
                                                - owner
                                            properties:
                                                number:
                                                    type: string
                                                    description: Bank account number
                                                    example: "1234567890"
                                                sort_code:
                                                    type: string
                                                    description: Bank sort code (required if swift_code is not provided)
                                                    example: "040127"
                                                swift_code:
                                                    type: string
                                                    description: Bank SWIFT/BIC code (required if sort_code is not provided)
                                                    example: "CBGHGHAC"
                                                holder:
                                                    type: object
                                                    description: Account owner information
                                                    required:
                                                        - name
                                                        - address
                                                    properties:
                                                        name:
                                                            type: string
                                                            description: Account holder's full name
                                                            example: "John Doe"
                                                        address:
                                                            type: object
                                                            description: Account holder's address
                                                            required:
                                                                - name
                                                                - line_1
                                                                - city
                                                                - region
                                                                - country
                                                            properties:
                                                                name:
                                                                    type: string
                                                                    description: Name or title of the address
                                                                    example: "Home Address"
                                                                phone:
                                                                    type: string
                                                                    description: Contact phone number
                                                                    example: "+233241234567"
                                                                line_1:
                                                                    type: string
                                                                    description: First line of the address
                                                                    example: "123 Main Street"
                                                                line_2:
                                                                    type: string
                                                                    description: Second line of the address (optional)
                                                                    example: "Apartment 4B"
                                                                city:
                                                                    type: string
                                                                    description: City or town
                                                                    example: "Accra"
                                                                region:
                                                                    type: string
                                                                    description: Region or state
                                                                    example: "Greater Accra"
                                                                post_code:
                                                                    type: string
                                                                    description: Postal or ZIP code (optional)
                                                                    example: "GA-123-4567"
                                                                country:
                                                                    type: string
                                                                    description: Country code or name
                                                                    example: "Ghana"
                                dosh_account:
                                    type: object
                                    description: Required when type is 'dosh_account' (currently not implemented)
                                    properties: {}
                                custom_data:
                                    type: object
                                    additionalProperties:
                                        type: string
                                    description: Your own key-value pairs for custom data and tracking
                                    example:
                                        merchant_id: "merch_123"
                                        location: "store_west"
                                owner:
                                    type: object
                                    description: Financial account owner information (required for payout identification). For bank-account requests, missing owner name or address fields are filled from bank_account.ghana_bank_account.holder.
                                    required:
                                        - name
                                        - address
                                    properties:
                                        name:
                                            type: string
                                            description: Owner's full name
                                            example: "Jane Smith"
                                        address:
                                            type: object
                                            description: Owner's address
                                            required:
                                                - name
                                                - line_1
                                                - city
                                                - region
                                                - country
                                            properties:
                                                name:
                                                    type: string
                                                    description: Name or title of the address
                                                    example: "Business Address"
                                                phone:
                                                    type: string
                                                    description: Contact phone number
                                                    example: "+233241234567"
                                                line_1:
                                                    type: string
                                                    description: First line of the address
                                                    example: "456 Business Road"
                                                line_2:
                                                    type: string
                                                    description: Second line of the address
                                                    example: "Suite 200"
                                                city:
                                                    type: string
                                                    description: City or town
                                                    example: "Accra"
                                                region:
                                                    type: string
                                                    description: Region or state
                                                    example: "Greater Accra"
                                                post_code:
                                                    type: string
                                                    description: Postal or ZIP code
                                                    example: "GA-456-7890"
                                                country:
                                                    type: string
                                                    description: Country name
                                                    example: "Ghana"
            responses:
                '200':
                    description: Financial account connected successfully
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    account:
                                        $ref: '#/components/schemas/FinancialAccount'
                '401':
                    description: Unauthorized - Missing or invalid authentication
                '422':
                    description: Unprocessable Entity - Invalid request parameters
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    error:
                                        $ref: '#/components/schemas/Error'
    /financial_accounts/update:
        post:
            summary: Update a financial account
            description: |
                Update an existing financial account. All fields except account_id are optional (PATCH semantics).

                **Custom Data Merge Semantics:**
                - New keys are added to existing custom_data
                - Existing keys are updated with new values
                - Empty string ("") updates the field to empty string (not deletion)
                - JSON null explicitly deletes the key
                - Keys not present in the update are preserved from existing data

                **Example:** If existing custom_data is `{"key1": "value1", "key2": "value2"}` and you send `{"key2": "new_value", "key3": null}`, the result will be `{"key1": "value1", "key2": "new_value"}` (key3 not added because it was null, key1 preserved).
            operationId: updateFinancialAccount
            tags:
                - Financial Accounts
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            required:
                                - account_id
                            properties:
                                account_id:
                                    type: string
                                    description: The ID of the financial account to update
                                    example: "fa_1234567890abcdef"
                                label:
                                    type: string
                                    minLength: 5
                                    maxLength: 40
                                    description: Account label (5-40 characters)
                                    example: "Updated Mobile Money Account"
                                description:
                                    type: string
                                    maxLength: 200
                                    description: Account description (0-200 characters)
                                    example: "Updated description"
                                reference:
                                    type: string
                                    minLength: 5
                                    maxLength: 40
                                    description: External reference ID (5-40 characters)
                                    example: "REF-2024-002"
                                custom_data:
                                    type: object
                                    additionalProperties:
                                        type: string
                                    description: Key-value pairs for custom data. Merges with existing data (see description for semantics).
                                    example:
                                        updated_field: "new_value"
                                        delete_this: null
                                owner:
                                    type: object
                                    description: Financial account owner information
                                    required:
                                        - name
                                        - address
                                    properties:
                                        name:
                                            type: string
                                            description: Owner's full name
                                            example: "Jane Smith"
                                        address:
                                            type: object
                                            description: Owner's address
                                            required:
                                                - name
                                                - line_1
                                                - city
                                                - region
                                                - country
                                            properties:
                                                name:
                                                    type: string
                                                    description: Name or title of the address
                                                    example: "Updated Business Address"
                                                phone:
                                                    type: string
                                                    description: Contact phone number
                                                    example: "+233241234567"
                                                line_1:
                                                    type: string
                                                    description: First line of the address
                                                    example: "789 New Street"
                                                line_2:
                                                    type: string
                                                    description: Second line of the address
                                                    example: "Floor 3"
                                                city:
                                                    type: string
                                                    description: City or town
                                                    example: "Kumasi"
                                                region:
                                                    type: string
                                                    description: Region or state
                                                    example: "Ashanti"
                                                post_code:
                                                    type: string
                                                    description: Postal or ZIP code
                                                    example: "AK-789-0123"
                                                country:
                                                    type: string
                                                    description: Country name
                                                    example: "Ghana"
            responses:
                '200':
                    description: Financial account updated successfully
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    account:
                                        $ref: '#/components/schemas/FinancialAccount'
                '401':
                    description: Unauthorized - Missing or invalid authentication
                '422':
                    description: Unprocessable Entity - Invalid request parameters
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    error:
                                        $ref: '#/components/schemas/Error'
    /financial_accounts/enable_push:
        post:
            summary: Enable push configuration (payouts)
            description: |
                Enable push configuration for a financial account, allowing it to receive payouts.
                Returns the account ID and push configuration details with the timestamp when it was enabled.
            operationId: enablePushConfiguration
            tags:
                - Financial Accounts
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            required:
                                - account_id
                            properties:
                                account_id:
                                    type: string
                                    description: The ID of the financial account
                                    example: "fa_1234567890abcdef"
            responses:
                '200':
                    description: Push configuration enabled successfully
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    account:
                                        $ref: '#/components/schemas/FinancialAccount'
                '401':
                    description: Unauthorized - Missing or invalid authentication
                '422':
                    description: Unprocessable Entity - Invalid request parameters
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    error:
                                        $ref: '#/components/schemas/Error'
    /financial_accounts/disable_push:
        post:
            summary: Disable push configuration (payouts)
            description: |
                Disable push configuration for a financial account, completely removing push capability.
                If the account is configured as a payout destination for any currency, the request fails
                unless you first remove it from payout destinations or set unset_as_payout_destination to true.
                This prevents accidentally breaking automatic payouts.
            operationId: disablePushConfiguration
            tags:
                - Financial Accounts
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            required:
                                - account_id
                            properties:
                                account_id:
                                    type: string
                                    description: The ID of the financial account
                                    example: "fa_1234567890abcdef"
                                unset_as_payout_destination:
                                    type: boolean
                                    description: |
                                        When true, automatically removes this financial account from all payout
                                        destinations before disabling push. Defaults to false. Use this if the account
                                        is currently configured as a payout destination.
                                    example: true
            responses:
                '200':
                    description: Push configuration disabled successfully
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    account:
                                        $ref: '#/components/schemas/FinancialAccount'
                '401':
                    description: Unauthorized - Missing or invalid authentication
                '422':
                    description: Unprocessable Entity - Invalid request parameters or financial account is a payout destination (remove from destinations or set unset_as_payout_destination to true)
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    error:
                                        $ref: '#/components/schemas/Error'
    /financial_accounts/disconnect:
        post:
            summary: Disconnect a financial account
            description: |
                Permanently disconnect a financial account, marking it as no longer usable for payouts or charges.
                The account remains visible in lookups and listings for historical reference but cannot be used for
                new operations. If the account is configured as a payout destination for any currency, the request
                fails unless you first remove it from payout destinations or set unset_as_payout_destination to true.
                This operation is idempotent.
            operationId: disconnectFinancialAccount
            tags:
                - Financial Accounts
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            required:
                                - account_id
                            properties:
                                account_id:
                                    type: string
                                    description: The ID of the financial account to disconnect
                                    example: "fa_1234567890abcdef"
                                unset_as_payout_destination:
                                    type: boolean
                                    description: |
                                        When true, automatically removes this financial account from all payout
                                        destinations before disconnecting. Defaults to false.
                                    example: true
            responses:
                '200':
                    description: Financial account disconnected successfully
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    account:
                                        type: object
                                        properties:
                                            id:
                                                type: string
                                                description: Financial account ID
                                                example: "fa_1234567890abcdef"
                                            currency:
                                                type: string
                                                description: Account currency
                                                example: "ghs"
                                            type:
                                                type: string
                                                description: Account type
                                                example: "wallet"
                                            label:
                                                type: string
                                                description: Account label
                                                example: "Vendor settlement - MTN"
                                            description:
                                                type: string
                                                description: Account description
                                                example: "Payout destination for marketplace vendor"
                                            disconnected_at:
                                                type: string
                                                format: date-time
                                                description: When the account was disconnected
                                                example: "2025-03-22T14:35:18.221Z"
                                            created_at:
                                                type: string
                                                format: date-time
                                                description: When the account was created
                                                example: "2025-01-15T09:12:33.445Z"
                '401':
                    description: Unauthorized - Missing or invalid authentication
                '422':
                    description: Unprocessable Entity - Invalid request parameters or financial account is a payout destination (remove from destinations or set unset_as_payout_destination to true)
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    error:
                                        $ref: '#/components/schemas/Error'
    /financial_accounts/reconnect:
        post:
            summary: Reconnect a financial account
            description: |
                Reconnect a previously disconnected financial account by clearing its local disconnected state.
                This makes the account usable again for Commerce operations while preserving the same account ID
                and historical record. It does not restore payout-destination mappings that were removed during
                disconnect. This endpoint does not perform provider-side authorization; any provider authorization
                happens separately in later capability flows.
                This operation is idempotent.
            operationId: reconnectFinancialAccount
            tags:
                - Financial Accounts
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            required:
                                - account_id
                            properties:
                                account_id:
                                    type: string
                                    description: The ID of the financial account to reconnect
                                    example: "fa_1234567890abcdef"
            responses:
                '200':
                    description: Financial account reconnected successfully
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    account:
                                        type: object
                                        properties:
                                            id:
                                                type: string
                                                description: Financial account ID
                                                example: "fa_1234567890abcdef"
                                            currency:
                                                type: string
                                                description: Account currency
                                                example: "ghs"
                                            type:
                                                type: string
                                                description: Account type
                                                example: "wallet"
                                            label:
                                                type: string
                                                description: Account label
                                                example: "Vendor settlement - MTN"
                                            description:
                                                type: string
                                                description: Account description
                                                example: "Payout destination for marketplace vendor"
                                            disconnected_at:
                                                type: string
                                                format: date-time
                                                nullable: true
                                                description: Present only while the account is disconnected; cleared after reconnect
                                            created_at:
                                                type: string
                                                format: date-time
                                                description: When the account was created
                                                example: "2025-01-15T09:12:33.445Z"
                '401':
                    description: Unauthorized - Missing or invalid authentication
                '422':
                    description: Unprocessable Entity - Invalid request parameters
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    error:
                                        $ref: '#/components/schemas/Error'
    /financial_accounts/enable_pull:
        post:
            summary: Enable pull configuration (charges)
            description: |
                Enable pull configuration for a financial account, allowing it to be charged.
                Creates a payment mandate automatically using request metadata (user agent and IP address).
                Returns the account ID and pull configuration details including the mandate.
