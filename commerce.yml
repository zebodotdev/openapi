        Payout:
            type: object
            description: A payout scheduled from your Commerce balance to a destination financial account
            required:
                - destination_id
                - execute_after
                - id
                - initiated_at
                - max_amount
                - status
            properties:
                amount:
                    type: object
                    allOf:
                        - $ref: '#/components/schemas/Money'
                    nullable: true
                    description: Actual transferred amount once the payout settles
                balance_transactions:
                    type: array
                    description: Balance transaction IDs bundled into this payout
                    items:
                        type: string
                canceled_at:
                    type: string
                    format: date-time
                    nullable: true
                    description: When the payout was canceled
                custom_data:
                    type: object
                    description: Merchant metadata stored on the payout
                    additionalProperties:
                        type: string
                destination_id:
                    type: string
                    description: Financial account receiving the funds
                    example: "fa_1234567890abcdef"
                error:
                    type: object
                    nullable: true
                    description: Structured failure details when execution fails
                    properties:
                        cause:
                            type: string
                            description: Underlying provider or transport cause
                        message:
                            type: string
                            description: Human-readable failure message
                        occurred_at:
                            type: string
                            format: date-time
                            description: When the error occurred
                        type:
                            type: string
                            description: Machine-readable failure type
                execute_after:
                    type: string
                    format: date-time
                    description: Earliest moment payout execution may begin
                    example: "2026-08-05T09:00:00Z"
                executed_by:
                    type: string
                    description: Actor that executed the payout
                expected_at:
                    type: string
                    format: date-time
                    nullable: true
                    description: Expected execution time after the payout is queued
                failed_at:
                    type: string
                    format: date-time
                    nullable: true
                    description: When the payout finally failed
                id:
                    type: string
                    description: Unique payout identifier
                    example: "po_yQ2wXm5Dc7Pk9Ls1Vn0RgHaB"
                initiated_at:
                    type: string
                    format: date-time
                    description: When the payout was created
                initiated_by:
                    type: string
                    description: Actor that initiated the payout
                max_amount:
                    $ref: '#/components/schemas/Money'
                reference:
                    type: string
                    description: Merchant reference carried on the payout
                    example: "PAYOUT-APR-15"
                schedule_id:
                    type: string
                    description: Payout schedule identifier when the payout was schedule-driven
                scheduled_at:
                    type: string
                    format: date-time
                    nullable: true
                    description: When the payout was queued for execution
                scheduled_by:
                    type: string
                    description: Actor that scheduled the payout
                sent_at:
                    type: string
                    format: date-time
                    nullable: true
                    description: When the transfer left Commerce for the payout provider
                source_id:
                    type: string
                    description: Source identifier used by the payout implementation
                status:
                    type: string
                    enum: [initialized, scheduled, pending, processing, executing, succeeded, invalid, canceled]
                    description: Current payout lifecycle state
                succeeded_at:
                    type: string
                    format: date-time
                    nullable: true
                    description: When the payout succeeded
        PayoutSettings:
            type: object
            description: Payout settings configuration for an application
            properties:
                fx_enabled:
                    type: boolean
                    description: Whether foreign exchange conversion is enabled for payouts
                    default: false
                    example: false
                destinations:
                    type: object
                    description: Map of currency codes to financial account IDs for payout destinations
                    additionalProperties:
                        type: string
                    example:
                        ghs: "fa_1234567890abcdef"
                schedule:
                    type: object
                    nullable: true
                    description: Payout schedule configuration
                    properties:
                        name:
                            type: string
                            description: Schedule name
                            example: "weekly"
                        type:
                            type: string
                            description: Schedule type
                            example: "automatic"
                        interval:
                            type: string
                            description: Payout interval (e.g., daily, weekly, monthly)
                            example: "weekly"
                        schedule_on:
                            type: string
                            description: When the payout is scheduled
                            example: "sunday"
                        description:
                            type: string
                            description: Schedule description
                            example: "Automatic weekly payout. Default."
                        aging_spec:
                            type: object
                            description: Aging specification - defines how long balance transactions must age before payout
                            properties:
                                t_plus:
                                    type: string
                                    description: Time delay specification in Go duration format (e.g., 168h for 7 days)
                                    example: "168h"
                                label:
                                    type: string
                                    description: Machine-readable label for the aging specification
                                    example: "168_hours"
                                abide:
                                    type: string
                                    description: Enforcement mode - how strictly the aging rules are applied
                                    example: "strictly"
        PaymentMethodObject:
            type: object
            description: A tokenized payment instrument tied to a customer
            required:
                - id
                - active
                - customer_id
                - type
                - created_at
            properties:
                active:
                    type: boolean
                    description: Whether this payment method is active and reusable in new payment flows
                    example: true
                archived_at:
                    type: string
                    format: date-time
                    nullable: true
                    description: Timestamp when the payment method was archived. Null when the payment method is not archived
                    example: null
                bank_account:
                    type: object
                    description: Bank account details (present when type is bank_account)
                    nullable: true
                    properties:
                        ghana_bank_account:
                            type: object
                            description: Ghana bank account details
                            nullable: true
                            properties:
                                branch:
                                    type: string
                                    description: Branch name
                                    example: "Accra Main"
                                name:
                                    type: string
                                    description: Account holder name
                                    example: "John Doe"
                                account_number:
                                    type: string
                                    description: Account number
                                    example: "1234567890"
                                sort_code:
                                    type: string
                                    description: Bank sort code
                                    example: "030100"
                                swift_code:
                                    type: string
                                    description: SWIFT/BIC code
                                    example: "GHBAGHAACCRA"
                        type:
                            type: string
                            description: Bank account sub-type
                            example: "ghana"
                card:
                    type: object
                    description: Card details (present when type is card)
                    nullable: true
                    properties:
                        brand:
                            type: string
                            description: Card network brand
                            example: "visa"
                        expires_on:
                            type: string
                            format: date-time
                            description: Card expiry date
                            example: "2028-12-01T00:00:00Z"
                        issuer:
                            type: object
                            description: Institution that issued this card
                            properties:
                                email_address:
                                    type: string
                                    example: "support@bank.com"
                                name:
                                    type: string
                                    example: "Ghana Commercial Bank"
                                phone_number:
                                    type: string
                                    example: "+233302123456"
                                type:
                                    type: string
                                    example: "bank"
                        owner:
                            type: object
                            description: Card owner details
                            properties:
                                email_address:
                                    type: string
                                    example: "john@example.com"
                                name:
                                    type: string
                                    example: "John Doe"
                                phone_number:
                                    type: string
                                    example: "+233241234567"
                        type:
                            type: string
                            description: Card type
                            example: "debit"
                created_at:
                    type: string
                    format: date-time
                    description: When this payment method was tokenized
                    example: "2025-11-23T13:00:00Z"
                custom_data:
                    type: object
                    description: Custom key-value metadata
                    additionalProperties:
                        type: string
                    example: {}
                customer_id:
                    type: string
                    description: Customer who owns this payment method
                    example: "cu_a1b2c3d4e5"
                expires_on:
                    type: string
                    format: date-time
                    description: When this payment method expires
                    nullable: true
                    example: null
                id:
                    type: string
                    description: Unique identifier for this payment method
                    example: "pm_xyz789"
                mobile_money:
                    type: object
                    description: Mobile money wallet details (present when type is mobile_money)
                    nullable: true
                    properties:
                        account_number:
                            type: string
                            description: Mobile money wallet number
                            example: "0241234567"
                        network:
                            type: string
                            enum: [mtn, telecel, airtel, telecel]
                            description: Mobile network operator
                            example: "mtn"
                owner:
                    type: object
                    description: Owner identity captured during tokenization when provided
                    nullable: true
                    properties:
                        address:
                            type: object
                            description: Postal address for the owner when available
                            nullable: true
                            properties:
                                city:
                                    type: string
                                    description: City or locality
                                    nullable: true
                                    example: "Accra"
                                country:
                                    type: string
                                    description: Two-letter ISO country code
                                    example: "GH"
                                line_1:
                                    type: string
                                    description: First line of the street address
                                    nullable: true
                                    example: "1 High Street"
                                line_2:
                                    type: string
                                    description: Second line of the street address
                                    nullable: true
                                    example: null
                                name:
                                    type: string
                                    description: Recipient name at this address, if different from owner name
                                    nullable: true
                                    example: null
                                phone_number:
                                    type: string
                                    description: Phone number for this address
                                    nullable: true
                                    example: null
                                post_code:
                                    type: string
                                    description: Postal or ZIP code
                                    nullable: true
                                    example: null
                                region:
                                    type: string
                                    description: Region, state, or province
                                    nullable: true
                                    example: null
                        name:
                            type: string
                            description: Owner full legal name
                            example: "Yaw Boakye"
                type:
                    type: string
                    enum: [mobile_money, bank_account, card, motito]
                    description: Payment rail type
                    example: "mobile_money"
                verification:
                    type: object
                    description: Verification details (present when method has been verified)
                    nullable: true
                    properties:
                        completed_at:
                            type: string
                            format: date-time
                            description: When verification was completed
                            nullable: true
                            example: "2025-11-23T13:07:00Z"
                        initiated_at:
                            type: string
                            format: date-time
                            description: When verification was initiated
                            example: "2025-11-23T13:00:00Z"
                        mechanism:
                            type: string
                            description: Verification mechanism used
                            example: "otp"
                        request_id:
                            type: string
                            description: ID of the verification request
                            example: "req_abc123"
                        type:
                            type: string
                            description: Verification type
                            example: "sms_otp"
                verified:
                    type: boolean
                    description: Whether customer has confirmed ownership via OTP
                    example: true
                verified_at:
                    type: string
                    format: date-time
                    description: When ownership verification was completed
                    nullable: true
                    example: "2025-11-23T13:07:00Z"

        PaymentMethodData:
            type: object
            description: Payment instrument details for tokenization
            required:
                - type
            properties:
                type:
                    type: string
                    enum: [mobile_money]
                    description: Payment rail type (currently only mobile_money supported)
                    example: "mobile_money"
                mobile_money:
                    type: object
                    description: Mobile money wallet details (required when type is mobile_money)
                    required:
                        - network
                        - account_number
                    properties:
                        network:
                            type: string
                            enum: [mtn, telecel, airteltigo]
                            description: Mobile money network provider
                            example: "mtn"
                        account_number:
                            type: string
                            description: Mobile money account number (international or local format)
                            example: "+233242057831"
                            pattern: '^(\+?\d{10,15})$'
        PaymentMethodSettings:
            type: object
            description: Payment method acceptance configuration for an application
            properties:
                mobile_money:
                    $ref: '#/components/schemas/PaymentMethodTypeSetting'
                bank_account:
                    $ref: '#/components/schemas/PaymentMethodTypeSetting'
                card:
                    $ref: '#/components/schemas/PaymentMethodTypeSetting'
                motito:
                    $ref: '#/components/schemas/PaymentMethodTypeSetting'
        PaymentMethodTypeSetting:
            type: object
            description: Settings for a specific payment method type
            properties:
                type:
                    type: string
                    enum: [mobile_money, bank_account, card, motito]
                    description: Payment method type
                    example: "mobile_money"
                name:
                    type: string
                    description: Human-readable name
                    example: "Mobile Money"
                description:
                    type: string
                    description: Description of this payment method
                    example: "Pay with MTN, Telecel, or AirtelTigo mobile wallets"
                enabled:
                    type: boolean
                    description: Whether this payment type can be used
                    example: true
                confirms_use:
                    type: boolean
                    description: Whether customers must explicitly agree before using
                    example: true
        CountrySpecification:
            type: object
            description: Complete specification for a country including supported features and requirements
            properties:
                country_code:
                    type: string
                    description: ISO 3166-1 alpha-2 country code
                    example: "gh"
                country_name:
                    type: string
                    description: Full country name
                    example: "Ghana"
                currencies:
                    type: array
                    description: Supported currencies in this country
                    items:
                        type: string
                    example: ["ghs", "usd"]
                payment_methods:
                    type: array
                    description: Supported payment methods in this country
                    items:
                        type: string
                    example: ["mobile_money", "bank_account", "payment_card", "motito"]
                payout_schedules:
                    type: array
                    description: Available payout schedules for this country
                    items:
                        type: string
                    example: ["weekly", "manual"]
                bt_aging_specs:
                    type: array
                    description: Balance transaction aging specifications available
                    items:
                        type: string
                    example: ["twenty_four_hourly", "forty_eight_hourly", "hundred_sixty_eight_hourly"]
                legal_entity_types:
                    type: array
                    description: Legal entity types that can operate in this country
                    items:
                        $ref: '#/components/schemas/LegalEntityType'
                financial_account_types:
                    type: array
                    description: Financial account types available in this country
                    items:
                        $ref: '#/components/schemas/FinancialAccountType'
                id_document_types:
                    type: array
                    description: Identification document types accepted in this country
                    items:
                        $ref: '#/components/schemas/IDDocumentType'
                banks:
                    $ref: '#/components/schemas/CountryBankDirectory'
        CountryBankDirectory:
            type: object
            description: Bank reference data available for country-specific bank accounts
            properties:
                bank_account_type:
                    type: string
                    description: Country-specific bank account subtype used by financial account APIs
                    example: "ghana_bank_account"
                code_scheme:
                    type: string
                    description: Identifier scheme used for bank branch codes
                    example: "sort_code"
                items:
                    type: array
                    description: Banking institutions available in this country
                    items:
                        $ref: '#/components/schemas/CountryBank'
        CountryBank:
            type: object
            description: A banking institution available in a country
            properties:
                id:
                    type: string
                    description: Stable bank identifier
                    example: "absa_gh_ltd"
                name:
                    type: string
                    description: Bank display name
                    example: "ABSA (GH) LTD"
                swift_code:
                    type: string
                    description: SWIFT/BIC code for the bank, when available
                    example: "BARCGHAC"
                sort_code_prefix:
                    type: string
                    description: Ghana sort code prefix for the bank
                    example: "03"
                branches:
                    type: array
                    description: Branches available for this bank
                    items:
                        $ref: '#/components/schemas/CountryBankBranch'
        CountryBankBranch:
            type: object
            description: A bank branch in a country bank directory
            properties:
                id:
                    type: string
                    description: Stable branch identifier
                    example: "absa_gh_ltd_kasoa_branch"
                name:
                    type: string
                    description: Branch display name
                    example: "ABSA (GH) LTD-KASOA BRANCH"
                sort_code:
                    type: string
                    description: Ghana bank branch sort code
                    example: "030101"
        LegalEntityType:
            type: object
            description: A type of legal entity that can operate in a country
            properties:
                type:
                    type: string
                    description: Machine-readable type identifier
                    example: "individual"
                name:
                    type: string
                    description: Human-readable name
                    example: "Individual"
                description:
                    type: string
                    description: Detailed description of this entity type
                    example: "Individual person. They have a tax identification number (TIN) and can operate a business in their own name."
        FinancialAccountType:
            type: object
            description: A type of financial account available in a country
            properties:
                name:
                    type: string
                    description: Machine-readable name
                    example: "wallet"
                label:
                    type: string
                    description: Human-readable label
                    example: "Wallet"
                description:
                    type: string
                    description: Description of this account type
                    example: "Mobile money wallet account"
                subtypes:
                    type: array
                    description: Specific subtypes of this account type
                    items:
                        type: string
                    example: ["mobile_money"]
        IDDocumentType:
            type: object
            description: A type of identification document accepted in a country
            properties:
                name:
                    type: string
                    description: Machine-readable name
                    example: "ghana_card"
                label:
                    type: string
                    description: Human-readable label
                    example: "Ghana Card"
                description:
                    type: string
                    description: Description of this document type
                    example: "National identification card issued by NIA"
        LookupChimeRequest:
            type: object
            description: Request to look up a chime by ID
            required:
                - chime_id
            properties:
                chime_id:
                    type: string
                    description: Unique identifier of the chime to look up
                    example: "ch_1234567890abcdef1234567890abcdef12345678"
        PageChimesRequest:
            type: object
            description: Request to retrieve a page of chimes
            properties:
                customer_id:
                    type: string
                    description: Restrict the page to chimes associated with this customer
                    example: "cu_abc123def456"
                page_number:
                    type: integer
                    minimum: 1
                    maximum: 10
                    default: 1
                    description: 1-based page index to fetch
                    example: 1
                page_size:
                    type: integer
                    minimum: 1
                    maximum: 256
                    default: 256
                    description: Number of chimes to return
                    example: 25
                recipient:
                    type: string
                    description: Restrict the page to chimes whose recipient exactly matches this phone number or email address
                    example: "+233544998605"
        SendChimeRequest:
            type: object
            description: |
                Request to send a chime to a recipient.
                SMS recipients accept either `full_message` or `message_template`.
                Email recipients accept either `email` or `message_template`.
            required:
                - recipient
            properties:
                recipient:
                    $ref: '#/components/schemas/ChimeRecipient'
                full_message:
                    type: string
                    description: Complete SMS message content. Use only with SMS recipients.
                    example: "Your verification code is 123456. It expires in 10 minutes."
                email:
                    $ref: '#/components/schemas/ChimeEmailMessageInput'
                message_template:
                    $ref: '#/components/schemas/MessageTemplateReference'
                sender:
                    type: string
                    description: Sender identifier shown to recipient. Uses default sender if not provided.
                    example: "YourBrand"
                purpose:
                    type: string
                    description: Purpose of this chime for categorization and analytics
                    example: "verification"
                custom_data:
                    type: object
                    additionalProperties:
                        type: string
                    description: Your own key-value pairs for custom data and tracking
                    example:
                        user_id: "usr_123"
                        flow: "signup"
                idempotency_key:
                    type: string
                    description: Unique key to prevent duplicate sends. Auto-generated if not provided.
                    example: "chime_send_20231214_abc123"
        ChimeRecipient:
            type: object
            description: Recipient contact information. Use `transport` to select sms or email delivery.
            required:
                - transport
            properties:
                transport:
                    type: string
                    enum: [sms, email]
                    description: Delivery transport used to resolve recipient contact details
                    example: "sms"
                customer_id:
                    type: string
                    description: Optional Commerce customer identifier. When provided, `recipient` should include only `transport` and `customer_id`.
                    example: "cu_abc123def456"
                name:
                    type: string
                    description: Recipient name for personalization when using inline contact details
                    example: "John Doe"
                phone:
                    type: object
                    description: Required when `transport` is `sms` and `customer_id` is not provided
                    properties:
                        number:
                            type: string
                            description: Phone number in international or local format
                            example: "+233544998605"
                email:
                    type: object
                    description: Required when `transport` is `email` and `customer_id` is not provided
                    properties:
                        address:
                            type: string
                            description: Email address
                            example: "user@example.com"
        ChimeResponse:
            type: object
            description: Response containing chime details
            properties:
                chime:
                    $ref: '#/components/schemas/Chime'
        PageChimesResponse:
            type: object
            description: Response containing a page of chimes
            properties:
                page:
                    type: object
                    required:
                        - number
                        - size
                        - chimes
                    properties:
                        number:
                            type: integer
                            description: Page number returned
                            example: 1
                        size:
                            type: integer
                            description: Page size returned
                            example: 25
                        chimes:
                            type: array
                            description: Chimes in this page
                            items:
                                $ref: '#/components/schemas/Chime'
        Chime:
            type: object
            description: A notification message sent to a recipient
            properties:
                id:
                    type: string
                    description: Unique identifier for this chime
                    example: "ch_WkPvqTrqGsopu07wfC7ttoWqmfwt48ZW7BGvYU"
                created_at:
                    type: string
                    format: date-time
                    description: When this chime was created
                    example: "2025-12-10T10:30:00Z"
                full_message:
                    type: string
                    description: Complete message content that was sent
                    example: "Your verification code is 123456. It expires in 10 minutes."
                recipient:
                    $ref: '#/components/schemas/ChimeRecipientResponse'
                sender_id:
                    type: string
                    description: Sender identifier used for delivery
                    example: "YourBrand"
                purpose:
                    type: string
                    description: Purpose of this chime
                    example: "verification"
                    nullable: true
                custom_data:
                    type: object
                    additionalProperties:
                        type: string
                    description: Your custom data associated with this chime
                delivery:
                    type: object
                    description: Delivery details for this chime
                    nullable: true
                email:
                    $ref: '#/components/schemas/ChimeEmailMessage'
                transmission:
                    type: object
                    description: Transmission details and delivery status
                    nullable: true
                    properties:
                        created_at:
                            type: string
                            format: date-time
                            description: When this transmission was initiated
                            example: "2025-12-10T10:30:00Z"
                        delivered_at:
                            type: string
                            format: date-time
                            description: When the message was delivered to the recipient
                            example: "2025-12-10T10:30:15Z"
                            nullable: true
                        failed_at:
                            type: string
                            format: date-time
                            description: When the transmission failed (null unless status is failed)
                            example: "2025-12-10T10:30:10Z"
                            nullable: true
                        sent_at:
                            type: string
                            format: date-time
                            description: When the message was handed off for delivery
                            example: "2025-12-10T10:30:05Z"
                            nullable: true
                        sent_via:
                            type: string
                            description: Delivery medium used (sms, whatsapp, or email)
                            example: "sms"
                            nullable: true
                        status:
                            type: string
                            description: Current transmission status
                            example: "sent"
        ChimeEmailMessageInput:
            type: object
            description: Email content accepted for email chimes, broadcasts, and schedules.
            required:
                - subject
                - text
                - from
            properties:
                subject:
                    type: string
                    description: Email subject.
                    example: "Your receipt"
                text:
                    type: string
                    description: Plain-text email body.
                    example: "Your receipt is ready."
                html:
                    type: string
                    description: Optional HTML email body. Unsafe HTML is rejected or sanitized before delivery.
                from:
                    $ref: '#/components/schemas/ChimeEmailMailbox'
                reply_to:
                    type: string
                    format: email
                    description: Optional reply-to email address.
                    example: "support@example.com"
                headers:
                    type: object
                    additionalProperties:
                        type: string
                    description: Optional provider-neutral email headers.
        ChimeEmailMessage:
            type: object
            description: Email content, safety scan result, and system-generated schema markup for email chimes.
            properties:
                subject:
                    type: string
                    description: Email subject
                    example: "Your receipt"
                text:
                    type: string
                    description: Plain-text email body
                    example: "Your receipt is ready."
                html:
                    type: string
                    description: Optional HTML email body before provider-specific rendering
                    nullable: true
                from:
                    $ref: '#/components/schemas/ChimeEmailMailbox'
                reply_to:
                    $ref: '#/components/schemas/ChimeEmailMailbox'
                headers:
                    type: object
                    additionalProperties:
                        type: string
                    description: Provider-neutral email headers after validation
                safety:
                    $ref: '#/components/schemas/ChimeEmailSafetyResult'
                schema:
                    $ref: '#/components/schemas/ChimeEmailSchemaMarkup'
        ChimeEmailMailbox:
            type: object
            properties:
                name:
                    type: string
                    description: Optional display name
                    example: "Zebo"
                address:
                    type: string
                    format: email
                    description: Email address
                    example: "notifications@zebo.dev"
        ChimeEmailSafetyResult:
            type: object
            description: Result of the email safety scan
            properties:
                status:
                    type: string
                    enum: [allowed, rejected, quarantined]
                    description: Safety decision for the email content
                reason_codes:
                    type: array
                    items:
                        type: string
                    description: Machine-readable reasons for non-allowed results
                sanitized_html:
                    type: string
                    description: Sanitized HTML body used for provider send when present
                    nullable: true
                normalized_text:
                    type: string
                    description: Normalized plain-text body used by the scanner
                links:
                    type: array
                    items:
                        $ref: '#/components/schemas/ChimeEmailScannedLink'
                scanner:
                    type: string
                    description: Scanner implementation name
                    example: "local-static-v1"
                content_hash:
                    type: string
                    description: Hash of the scanned email content
                quarantine_notes:
                    type: string
                    nullable: true
        ChimeEmailScannedLink:
            type: object
            properties:
                raw:
                    type: string
                scheme:
                    type: string
                host:
                    type: string
                status:
                    type: string
                    enum: [allowed, rejected, quarantined]
                reason:
                    type: string
        ChimeEmailSchemaMarkup:
            type: object
            description: Schema.org JSON-LD markup generated at email send time.
            properties:
                kind:
                    type: string
                    enum: [gmail_view_action, schema_org_order, schema_org_invoice]
                    description: Classification for the generated markup
                json_ld:
                    type: object
                    additionalProperties: true
                    description: Schema.org JSON-LD object inserted into the HTML email
        ChimeRecipientResponse:
            type: object
            description: Recipient information in response
            properties:
                type:
                    type: string
                    enum: [phone, email]
                    description: Contact type
                    example: "phone"
                name:
                    type: string
                    description: Recipient name
                    example: "John Doe"
                phone:
                    type: object
                    properties:
                        number:
                            type: string
                            example: "+233544998605"
                email:
                    type: object
                    properties:
                        address:
                            type: string
                            example: "user@example.com"
        ScheduleChimeRequest:
            type: object
            required:
                - recipients
                - send_after
            properties:
                idempotency_key:
                    type: string
                    description: Unique key to prevent duplicate schedules. If not provided, one is generated automatically.
                    example: "schedule_20231214_abc123"
                recipients:
                    type: array
                    description: Recipient objects for this scheduled chime. Each item must include `transport` and either inline contact details or `customer_id`.
                    items:
                        $ref: '#/components/schemas/ChimeRecipient'
                    minItems: 1
                    example:
                        - transport: "sms"
                          phone:
                              number: "+233544998605"
                        - transport: "email"
                          customer_id: "cu_abc123def456"
                send_after:
                    type: string
                    format: date-time
                    description: ISO 8601 timestamp for when to send the chime (must be in the future)
                    example: "2025-12-15T10:00:00Z"
                full_message:
                    type: string
                    description: Complete SMS message content. Use only with SMS recipients.
                    example: "Reminder: Your appointment is tomorrow at 10 AM."
                email:
                    $ref: '#/components/schemas/ChimeEmailMessageInput'
                message_template:
                    $ref: '#/components/schemas/MessageTemplateReference'
                sender_id:
                    type: string
                    description: Sender identifier displayed to recipients
                    example: "YourBrand"
                purpose:
                    type: string
                    description: Optional purpose or category for this scheduled chime
                    example: "appointment_reminder"
        ScheduleResponse:
            type: object
            description: Response containing scheduled chime details
            properties:
                scheduled_chime:
                    type: object
                    description: A chime scheduled for future delivery
                    properties:
                        id:
                            type: string
                            description: Unique identifier for this scheduled chime
                            example: "sch_abc123def456ghi789"
                        recipients:
                            type: array
                            description: List of recipient addresses
                            items:
                                type: string
                            example: ["+233544998605", "user@example.com"]
                        full_message:
                            type: string
                            description: Complete message content that will be sent
                            example: "Reminder: Your appointment is tomorrow at 10 AM."
                        email:
                            $ref: '#/components/schemas/ChimeEmailMessage'
                        sender_id:
                            type: string
                            description: Sender identifier
                            example: "YourBrand"
                        purpose:
                            type: string
                            description: Optional purpose or category for this scheduled chime
                            example: "appointment_reminder"
                            nullable: true
                        send_after:
                            type: string
                            format: date-time
                            description: When this chime will be sent
                            example: "2025-12-15T10:00:00Z"
                        created_at:
                            type: string
                            format: date-time
                            description: When this schedule was created
                            example: "2025-12-10T10:30:00Z"
                        executed_at:
                            type: string
                            format: date-time
                            description: When this schedule was executed (null if not yet executed)
                            nullable: true
        LookupScheduleRequest:
            type: object
            required:
                - schedule_id
            properties:
                schedule_id:
                    type: string
                    description: Unique identifier for the scheduled chime
                    example: "sch_abc123def456ghi789"
        CancelScheduleRequest:
            type: object
            required:
                - schedule_id
            properties:
                schedule_id:
                    type: string
                    description: Unique identifier for the scheduled chime to cancel
                    example: "sch_abc123def456ghi789"
        ScheduleLookupResponse:
            type: object
            description: Response containing scheduled chime details and all created chimes
            properties:
                scheduled_chime:
                    $ref: '#/components/schemas/ScheduleDetail'
        ScheduleCancelResponse:
            type: object
            description: Response containing canceled schedule details
            properties:
                scheduled_chime:
                    $ref: '#/components/schemas/ScheduleDetail'
        ScheduleDetail:
            type: object
            description: |
                Detailed information about a scheduled chime including execution status
                and all individual chimes created
            properties:
                id:
                    type: string
                    description: Unique identifier for this scheduled chime
                    example: "sch_abc123def456ghi789"
                recipients:
                    type: array
                    description: |
                        List of recipient addresses (phone numbers or email addresses)
                    items:
                        type: string
                    example:
                        - "+233244123456"
                        - "+233501234567"
                        - "user@example.com"
                content:
                    type: string
                    description: Message content that was or will be sent to all recipients
                    example: "Hello! This is your scheduled reminder."
                sender_id:
                    type: string
                    description: Sender identifier used for delivery
                    example: "YourBrand"
                purpose:
                    type: string
                    description: Purpose of this scheduled chime
                    example: "reminder"
                    nullable: true
                send_after:
                    type: string
                    format: date-time
                    description: When this chime should be (or was) sent
                    example: "2026-01-18T10:00:00Z"
                created_at:
                    type: string
                    format: date-time
                    description: When this schedule was created
                    example: "2026-01-17T15:30:00Z"
                executed_at:
                    type: string
                    format: date-time
                    description: When the schedule was executed (null if not yet executed)
                    example: "2026-01-18T10:00:15Z"
                    nullable: true
                canceled_at:
                    type: string
                    format: date-time
                    description: When the schedule was canceled (null if not canceled)
                    example: "2026-01-18T09:55:00Z"
                    nullable: true
                errors:
                    type: array
                    description: |
                        Errors encountered when scheduling chimes for specific recipients
                        (e.g., invalid phone number, invalid email format)
                    items:
                        $ref: '#/components/schemas/ScheduleError'
                chime_ids:
                    type: array
                    description: |
                        List of chime IDs created for each recipient. Use the
                        /chimes/lookup endpoint to fetch full details for any chime.
                    items:
                        type: string
                    example:
                        - "ch_abc123def456ghi789"
                        - "ch_xyz789abc123def456"
        ScheduleError:
            type: object
            description: Error encountered when scheduling a chime for a specific recipient
            properties:
                recipient:
                    type: string
                    description: Recipient address that caused the error
                    example: "+233invalid"
                fix_code:
                    type: string
                    description: Code indicating how to fix this error
                    example: "INVALID_PHONE_NUMBER"
                type:
                    type: string
                    description: Error type classification
                    example: "validation_error"
        BroadcastRequest:
            type: object
            required:
                - recipients
                - sender
            properties:
                idempotency_key:
                    type: string
                    description: Unique key to prevent duplicate broadcasts during retries.
                    example: "broadcast_20231214_abc123"
                message_template:
                    oneOf:
                        - type: string
                          description: Raw SMS message content for SMS broadcasts.
                          example: "Your order #12345 has shipped."
                        - $ref: '#/components/schemas/MessageTemplateReference'
                    description: Raw SMS content for SMS broadcasts, or a stored message template reference for SMS or email broadcasts.
                email:
                    $ref: '#/components/schemas/ChimeEmailMessageInput'
                purpose:
                    type: string
                    description: Category or intent for this broadcast.
                    example: "order_notification"
                recipients:
                    type: array
                    description: Recipient objects for this broadcast. Each item must include `transport` and either inline contact details or `customer_id`.
                    items:
                        $ref: '#/components/schemas/ChimeRecipient'
                    minItems: 1
                    example:
                        - transport: "email"
                          email:
                              address: "user@example.com"
                        - transport: "sms"
                          customer_id: "cu_abc123def456"
                sender:
                    type: string
                    description: Sender identifier displayed to recipients.
                    example: "YourBrand"
        BroadcastResponse:
            type: object
            description: Response containing broadcast details
            properties:
                broadcast:
                    type: object
                    description: A broadcast accepted for immediate delivery
                    properties:
                        id:
                            type: string
                            description: Unique identifier for this broadcast
                            example: "brc_abc123def456ghi789"
                        customer_ids:
                            type: array
                            description: Commerce customer identifiers resolved into recipients for this broadcast.
                            items:
                                type: string
                            example: ["cu_abc123def456", "cu_def456ghi789"]
                        recipients:
                            type: array
                            description: List of resolved recipient addresses
                            items:
                                type: string
                            example: ["+233544998605", "user@example.com"]
                        content:
                            type: string
                            description: Message content that will be sent to all recipients
                            example: "Your order #12345 has shipped."
                        email:
                            $ref: '#/components/schemas/ChimeEmailMessage'
                        sender_id:
                            type: string
                            description: Sender identifier
                            example: "YourBrand"
                        purpose:
                            type: string
                            description: Optional purpose or category for this broadcast
                            example: "order_notification"
                            nullable: true
                        send_after:
                            type: string
                            format: date-time
                            description: When this broadcast was queued for delivery
                            example: "2025-12-15T10:00:00Z"
                        created_at:
                            type: string
                            format: date-time
                            description: When this broadcast was created
                            example: "2025-12-15T10:00:00Z"
        LookupBroadcastRequest:
            type: object
            required:
                - broadcast_id
            properties:
                broadcast_id:
                    type: string
                    description: Unique identifier for the broadcast to lookup
                    example: "brc_abc123def456ghi789"
        LookupBroadcastResponse:
            type: object
            description: Response containing broadcast details and delivery status
            properties:
                broadcast:
                    $ref: '#/components/schemas/BroadcastDetail'
        CancelBroadcastRequest:
            type: object
            required:
                - broadcast_id
            properties:
                broadcast_id:
                    type: string
                    description: Unique identifier for the broadcast to cancel
                    example: "brc_abc123def456ghi789"
        BroadcastCancelResponse:
            type: object
            description: Response containing canceled broadcast details
            properties:
                broadcast:
                    $ref: '#/components/schemas/BroadcastDetail'
        BroadcastDetail:
            type: object
            description: |
                Detailed information about a broadcast including execution status
                and all individual chimes created for recipients
            properties:
                id:
                    type: string
                    description: Unique identifier for this broadcast
                    example: "brc_abc123def456ghi789"
                recipients:
                    type: array
                    description: |
                        List of recipient addresses (phone numbers or email addresses)
                        that received or will receive the broadcast
                    items:
                        type: string
                    example:
                        - "+233244123456"
                        - "+233501234567"
                        - "user@example.com"
                content:
                    type: string
                    description: Message content sent to all recipients
                    example: "Hello! This is your broadcast notification."
                sender_id:
                    type: string
                    description: Sender identifier used for delivery
                    example: "YourBrand"
                purpose:
                    type: string
                    description: Purpose of this broadcast
                    example: "notification"
                    nullable: true
                send_after:
                    type: string
                    format: date-time
                    description: When this broadcast was scheduled (typically immediate)
                    example: "2026-01-18T10:00:00Z"
                created_at:
                    type: string
                    format: date-time
                    description: When this broadcast was created
                    example: "2026-01-18T10:00:00Z"
                executed_at:
                    type: string
                    format: date-time
                    description: When the broadcast execution started (null if not yet executed)
                    example: "2026-01-18T10:00:02Z"
                    nullable: true
                canceled_at:
                    type: string
                    format: date-time
                    description: When the broadcast was canceled (null if not canceled)
                    example: null
                    nullable: true
                errors:
                    type: array
                    description: |
                        Errors encountered when broadcasting to specific recipients
                        (e.g., invalid phone number, invalid email format)
                    items:
                        $ref: '#/components/schemas/BroadcastError'
                chime_ids:
                    type: array
                    description: |
                        List of chime IDs created for each recipient. Use the
                        /chimes/lookup endpoint to fetch full details for any chime.
                    items:
                        type: string
                    example:
                        - "ch_abc123def456ghi789"
                        - "ch_xyz789abc123def456"
        BroadcastError:
            type: object
            description: Error encountered when broadcasting to a specific recipient
            properties:
                recipient:
                    type: string
                    description: Recipient address that caused the error
                    example: "+233invalid"
                fix_code:
                    type: string
                    description: Code indicating how to fix this error
                    example: "INVALID_PHONE_NUMBER"
                type:
                    type: string
                    description: Error type classification
                    example: "validation_error"
        InitiateOTPRequest:
            type: object
            required:
                - idempotency_key
                - recipient
                - sender
                - service_name
            properties:
                idempotency_key:
                    type: string
                    description: Unique key to prevent duplicate OTP sends (16-128 characters)
                    minLength: 16
                    maxLength: 128
                    example: "txn_67890_otp_20231215"
                recipient:
                    type: string
                    description: Phone number in international format (E.164)
                    example: "+233241234567"
                sender:
                    type: string
                    description: Sender identifier shown to recipient (3-11 characters)
                    minLength: 3
                    maxLength: 11
                    example: "Acme"
                service_name:
                    type: string
                    description: Service name shown in the message (3-30 characters)
                    minLength: 3
                    maxLength: 30
                    example: "Acme Bank"
                message_template:
                    type: string
                    description: Custom message template (must include {{TOKEN}} and {{SERVICE_NAME}} placeholders)
                    example: "Your {{SERVICE_NAME}} code is {{TOKEN}}. Valid for 10 minutes."
                preferred_gateway:
                    type: string
                    description: SMS gateway to use for delivery
                    enum: [twilio, vonage, africas-talking, termii]
                    example: "twilio"
                purpose:
                    type: string
                    description: Purpose of this OTP for analytics/tracking
                    example: "transaction_confirm"
                token_alphabet:
                    type: string
                    description: Custom alphabet for token generation (mutually exclusive with token_alphabet_type)
                    example: "0123456789ABCDEF"
                token_alphabet_type:
                    type: string
                    description: Predefined alphabet type (mutually exclusive with token_alphabet)
                    enum: [numeric, alpha, alphanumeric]
                    example: "numeric"
                token_size:
                    type: integer
                    description: Length of generated token (4-10 characters)
                    minimum: 4
                    maximum: 10
                    example: 6
                validity_duration_in_minutes:
                    type: integer
                    description: How long token remains valid (1-60 minutes)
                    minimum: 1
                    maximum: 60
                    example: 10
        InitiateOTPResponse:
            type: object
            properties:
                transaction:
                    $ref: '#/components/schemas/OTPTransaction'
                error:
                    $ref: '#/components/schemas/Error'
        VerifyOTPRequest:
            type: object
            required:
                - transaction_id
                - recipient
                - token
            properties:
                transaction_id:
                    type: string
                    description: ID of the OTP transaction to verify (with ot_ prefix)
                    example: "ot_3f8a9c7e2d1b4a6f"
                recipient:
                    type: string
                    description: Phone number that received the OTP
                    example: "+233241234567"
                token:
                    type: string
                    description: OTP token submitted by the user
                    example: "847293"
        VerifyOTPResponse:
            type: object
            properties:
                transaction:
                    $ref: '#/components/schemas/OTPTransaction'
                verification_attempt:
                    $ref: '#/components/schemas/OTPVerificationAttempt'
                error:
                    $ref: '#/components/schemas/Error'
        LookupOTPRequest:
            type: object
            required:
                - transaction_id
            properties:
                transaction_id:
                    type: string
                    description: ID of the OTP transaction to lookup (with ot_ prefix)
                    example: "ot_3f8a9c7e2d1b4a6f"
                debug_mode:
                    type: integer
                    description: Set to 1 to include verification attempts in response
                    enum: [0, 1]
                    example: 0
        LookupOTPResponse:
            type: object
            properties:
                transaction:
                    $ref: '#/components/schemas/OTPTransaction'
                error:
                    $ref: '#/components/schemas/Error'
        CancelOTPRequest:
            type: object
            required:
                - transaction_id
                - reason
            properties:
                transaction_id:
                    type: string
                    description: ID of the OTP transaction to cancel (with ot_ prefix)
                    example: "ot_3f8a9c7e2d1b4a6f"
                reason:
                    type: string
                    description: Human-readable explanation for cancellation
                    example: "user_requested_new_code"
        CancelOTPResponse:
            type: object
            properties:
                transaction:
                    $ref: '#/components/schemas/OTPCanceledTransaction'
                error:
                    $ref: '#/components/schemas/Error'
        OTPTransaction:
            type: object
            description: OTP transaction object returned by initiate, verify, and lookup endpoints
            properties:
                id:
                    type: string
                    description: Unique identifier with ot_ prefix
                    example: "ot_3f8a9c7e2d1b4a6f"
                status:
                    type: string
                    description: Transaction status
                    enum: [pending, verified, expired, canceled]
                    example: "pending"
                full_message:
                    type: string
                    description: Complete message sent to recipient (token placeholder shown, not actual token)
                    example: "Your Acme Bank code is ******. Valid for 10 minutes."
                initiated_at:
                    type: string
                    format: date-time
                    description: When transaction was created (ISO 8601)
                    example: "2023-12-15T14:30:00Z"
                expires_at:
                    type: string
                    format: date-time
                    description: When token expires (ISO 8601)
                    example: "2023-12-15T14:40:00Z"
                canceled_at:
                    type: string
                    format: date-time
                    nullable: true
                    description: When transaction was canceled (ISO 8601), null if not canceled
                    example: null
                cancel_reason:
                    type: string
                    nullable: true
                    description: Reason for cancellation, null if not canceled
                    example: null
                transmission:
                    type: object
                    nullable: true
                    description: Delivery details from SMS/email gateway
                    properties:
                        recipient:
                            type: string
                            description: Destination phone number or email
                            example: "+233241234567"
                        sender_id:
                            type: string
                            description: Sender identifier
                            example: "Acme"
                        sent_via:
                            type: string
                            description: Delivery mechanism
                            example: "sms"
                        status:
                            type: string
                            description: Transmission status from gateway
                            example: "delivered"
                        sent_at:
                            type: string
                            format: date-time
                            description: When message was sent (ISO 8601)
                            example: "2023-12-15T14:30:01Z"
        OTPCanceledTransaction:
            type: object
            description: OTP transaction object with extended cancellation details
            properties:
                id:
                    type: string
                    description: Unique identifier with ot_ prefix
                    example: "ot_3f8a9c7e2d1b4a6f"
                status:
                    type: string
                    description: Transaction status (always 'canceled' for this response)
                    example: "canceled"
                full_message:
                    type: string
                    description: Complete message that was sent
                    example: "Your Acme Bank code is ******. Valid for 10 minutes."
                recipient:
                    type: string
                    description: Phone number or email where OTP was sent
                    example: "+233241234567"
                sender:
                    type: string
                    description: Sender identifier
                    example: "Acme"
                mechanism:
                    type: string
                    description: Delivery mechanism used
                    example: "sms"
                gateway:
                    type: string
                    description: Gateway used for delivery
                    example: "twilio"
                preferred_gateway:
                    type: string
                    description: Gateway requested for delivery
                    example: "twilio"
                created_at:
                    type: string
                    format: date-time
                    description: When transaction was created
                    example: "2023-12-15T14:30:00Z"
                delivered_at:
                    type: string
                    format: date-time
                    description: When message was delivered
                    example: "2023-12-15T14:30:01Z"
                verifiable_until:
                    type: string
                    format: date-time
                    description: When token expires
                    example: "2023-12-15T14:40:00Z"
                canceled_at:
                    type: string
                    format: date-time
                    description: When transaction was canceled
                    example: "2023-12-15T14:35:00Z"
                cancel_reason:
                    type: string
                    description: Reason for cancellation
                    example: "user_requested_new_code"
        OTPVerificationAttempt:
            type: object
            description: Details of a verification attempt
            properties:
                id:
                    type: string
                    description: Unique identifier for this attempt with ov_ prefix
                    example: "ov_9e8d7c6b5a4f3e2d"
                recipient:
                    type: string
                    description: Recipient provided in verification request
                    example: "+233241234567"
                presented_token:
                    type: string
                    description: Token submitted for verification
                    example: "847293"
                attempted_at:
                    type: string
                    format: date-time
                    description: When verification was attempted (ISO 8601)
                    example: "2023-12-15T14:32:00Z"
                result:
                    type: object
                    description: Verification outcome
                    properties:
                        verdict:
                            type: string
                            description: Verification result
                            enum: [pass, fail, unknown]
                            example: "pass"
                        detail:
                            type: string
                            nullable: true
                            description: Error detail if verification failed, null on success
                            example: null
