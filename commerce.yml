    /payment_methods/tokenize:
        post:
            summary: Tokenize a payment method
            description: |
                Save a new payment method for a customer without charging it. The payment method
                is tokenized and stored for future use. Currently supports mobile money wallets.

                Use this endpoint to:
                - Collect payment details during customer onboarding
                - Let customers save multiple payment instruments
                - Set up payment methods before subscription billing

                After tokenization, you can optionally verify the payment method to confirm
                customer ownership and enable frictionless charging.
            operationId: tokenizePaymentMethod
            tags:
                - Payment Methods
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            required:
                                - customer_id
                                - payment_method_data
                            properties:
                                customer_id:
                                    type: string
                                    description: Customer who will own this payment method
                                    example: "cus_a1b2c3d4e5"
                                payment_method_data:
                                    $ref: '#/components/schemas/PaymentMethodData'
                                verify_immediately:
                                    type: boolean
                                    description: Send verification OTP immediately after tokenization
                                    default: false
            responses:
                '200':
                    description: Payment method tokenized successfully
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    payment_method:
                                        $ref: '#/components/schemas/PaymentMethodObject'
                '400':
                    description: Bad request - invalid parameters
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                '401':
                    description: Unauthorized - Missing or invalid authentication
    /payment_methods/verify:
        post:
            summary: Verify a payment method
            description: |
                Send an OTP to confirm customer ownership of a payment method. For mobile money,
                a 6-digit code is sent via SMS to the registered wallet number. The customer
                submits the token to complete verification.

                Verified payment methods:
                - Can be charged without additional OTP confirmation
                - Meet network provider requirements for stored credentials
                - Have better authorization rates with reduced friction
            operationId: verifyPaymentMethod
            tags:
                - Payment Methods
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            required:
                                - payment_method_id
                            properties:
                                payment_method_id:
                                    type: string
                                    description: ID of the payment method to verify
                                    example: "pm_xyz789"
            responses:
                '200':
                    description: Verification initiated successfully
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    verification:
                                        type: object
                                        properties:
                                            payment_method_id:
                                                type: string
                                            status:
                                                type: string
                                                enum: [pending, verified, failed]
                                            token_sent_at:
                                                type: string
                                                format: date-time
                                            expires_at:
                                                type: string
                                                format: date-time
                                            delivery:
                                                type: object
                                                properties:
                                                    recipient:
                                                        type: string
                                                    channel:
                                                        type: string
                                                        enum: [sms, email]
                                                    sender_id:
                                                        type: string
                '400':
                    description: Bad request - invalid parameters
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                '401':
                    description: Unauthorized - Missing or invalid authentication

    /payment_methods/lookup:
        post:
            summary: Lookup a payment method
            description: |
                Retrieve details for a specific payment method by ID. Returns the full
                payment method object including verification status, creation timestamp,
                masked account details, and owner details when captured.
            operationId: lookupPaymentMethod
            tags:
                - Payment Methods
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            required:
                                - payment_method_id
                            properties:
                                payment_method_id:
                                    type: string
                                    description: ID of the payment method to fetch
                                    example: "pm_xyz789"
            responses:
                '200':
                    description: Payment method found
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    payment_method:
                                        $ref: '#/components/schemas/PaymentMethodObject'
                '404':
                    description: Payment method not found
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                '401':
                    description: Unauthorized - Missing or invalid authentication

    /payment_methods/page:
        post:
            summary: Page payment methods
            description: |
                Retrieve a paginated list of payment methods for the authenticated
                application.

                If `customer_id` is supplied, the page is scoped to payment methods
                that belong to that customer. The supplied customer must belong to
                your authenticated application.
            operationId: pagePaymentMethods
            tags:
                - Payment Methods
            requestBody:
                required: false
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/PaymentMethodPageRequest'
            responses:
                '200':
                    description: Page retrieved successfully
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/PaymentMethodPageResponse'
                '401':
                    description: Unauthorized - Missing or invalid authentication
                '422':
                    description: Unprocessable entity - validation failed
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
    /payment_methods/update:
        post:
            summary: Update a payment method
            description: |
                Update mutable payment method metadata for the authenticated
                application.

                Supported updates:
                - `custom_data` merges into existing metadata
                - `owner` applies patch semantics and updates only the
                  provided owner fields
                - `active` toggles whether the payment method can be reused
                - `archived` archives or unarchives the payment method

                **Custom Data Merge Semantics:**
                - New keys are added to existing custom_data
                - Existing keys are updated with new values
                - JSON null explicitly deletes the key
                - Keys not present in the update are preserved

                When adding a new owner address to a payment method that does
                not already have one, `owner.address.country` is required.

                Archived payment methods reject all updates except a pure
                unarchive request. Unarchiving leaves the payment method
                inactive until you activate it again.
            operationId: updatePaymentMethod
            tags:
                - Payment Methods
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            required:
                                - payment_method_id
                            properties:
                                payment_method_id:
                                    type: string
                                    description: ID of the payment method to update
                                    example: "pm_xyz789"
                                custom_data:
                                    type: object
                                    additionalProperties:
                                        type: string
                                    description: Key-value metadata to merge into the payment method. Use JSON null to delete a key.
                                    example:
                                        segment: "vip"
                                        internal_note: null
                                active:
                                    type: boolean
                                    description: Set to `true` to activate the payment method or `false` to mark it inactive.
                                    example: true
                                archived:
                                    type: boolean
                                    description: Set to `true` to archive the payment method or `false` to unarchive it.
                                    example: false
                                owner:
                                    type: object
                                    description: Owner details to patch onto the payment method.
                                    properties:
                                        name:
                                            type: string
                                            description: Full legal name of the account holder.
                                            example: "Jane Mensah"
                                        address:
                                            type: object
                                            description: Postal address for the payment method owner.
                                            properties:
                                                city:
                                                    type: string
                                                    description: City or locality.
                                                    example: "Accra"
                                                country:
                                                    type: string
                                                    description: Two-letter ISO country code. Required when adding a brand new owner address.
                                                    example: "GH"
                                                line1:
                                                    type: string
                                                    description: First address line.
                                                    example: "1 High Street"
                                                line2:
                                                    type: string
                                                    description: Second address line.
                                                    example: "Osu"
                                                name:
                                                    type: string
                                                    description: Recipient name for the address, if different from owner name.
                                                    example: "Jane Mensah"
                                                phone_number:
                                                    type: string
                                                    description: Phone number for the address.
                                                    example: "+233201234567"
                                                post_code:
                                                    type: string
                                                    description: Postal or ZIP code.
                                                    example: "GA-123-4567"
                                                region:
                                                    type: string
                                                    description: Region, state, or province.
                                                    example: "Greater Accra"
            responses:
                '200':
                    description: Payment method updated successfully
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    payment_method:
                                        $ref: '#/components/schemas/PaymentMethodObject'
                '404':
                    description: Payment method not found
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                '401':
                    description: Unauthorized - Missing or invalid authentication
                '422':
                    description: Unprocessable entity - validation failed
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
    /payment_methods/activate:
        post:
            summary: Activate a payment method
            description: |
                Mark an inactive payment method as active so it can be reused in
                new payment flows.
            operationId: activatePaymentMethod
            tags:
                - Payment Methods
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            required:
                                - payment_method_id
                            properties:
                                payment_method_id:
                                    type: string
                                    description: ID of the payment method to activate
                                    example: "pm_xyz789"
            responses:
                '200':
                    description: Payment method activated successfully
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    payment_method:
                                        $ref: '#/components/schemas/PaymentMethodObject'
                '404':
                    description: Payment method not found
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                '401':
                    description: Unauthorized - Missing or invalid authentication
                '422':
                    description: Unprocessable entity - validation failed
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
    /payment_methods/disactivate:
        post:
            summary: Disactivate a payment method
            description: |
                Mark an active payment method as inactive so it cannot be reused
                in new payment flows until reactivated.
            operationId: disactivatePaymentMethod
            tags:
                - Payment Methods
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            required:
                                - payment_method_id
                            properties:
                                payment_method_id:
                                    type: string
                                    description: ID of the payment method to mark inactive
                                    example: "pm_xyz789"
            responses:
                '200':
                    description: Payment method marked inactive successfully
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    payment_method:
                                        $ref: '#/components/schemas/PaymentMethodObject'
                '404':
                    description: Payment method not found
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                '401':
                    description: Unauthorized - Missing or invalid authentication
                '422':
                    description: Unprocessable entity - validation failed
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
    /payment_methods/archive:
        post:
            summary: Archive a payment method
            description: |
                Archive a payment method. Archived payment methods become
                inactive immediately and reject further updates until they are
                unarchived.
            operationId: archivePaymentMethod
            tags:
                - Payment Methods
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            required:
                                - payment_method_id
                            properties:
                                payment_method_id:
                                    type: string
                                    description: ID of the payment method to archive
                                    example: "pm_xyz789"
            responses:
                '200':
                    description: Payment method archived successfully
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    payment_method:
                                        $ref: '#/components/schemas/PaymentMethodObject'
                '404':
                    description: Payment method not found
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                '401':
                    description: Unauthorized - Missing or invalid authentication
                '422':
                    description: Unprocessable entity - validation failed
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
    /payment_methods/unarchive:
        post:
            summary: Unarchive a payment method
            description: |
                Unarchive an archived payment method so it can be updated again.
                Unarchiving does not automatically reactivate the payment
                method.
            operationId: unarchivePaymentMethod
            tags:
                - Payment Methods
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            required:
                                - payment_method_id
                            properties:
                                payment_method_id:
                                    type: string
                                    description: ID of the payment method to unarchive
                                    example: "pm_xyz789"
            responses:
                '200':
                    description: Payment method unarchived successfully
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    payment_method:
                                        $ref: '#/components/schemas/PaymentMethodObject'
                '404':
                    description: Payment method not found
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                '401':
                    description: Unauthorized - Missing or invalid authentication
                '422':
                    description: Unprocessable entity - validation failed
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
    /payment_methods/delete:
        post:
            summary: Delete a payment method
            description: |
                Permanently remove a payment method from a customer's account. This action
                is irreversible - the tokenized credentials are deleted and the payment
                method can no longer be charged.

                Important notes:
                - Past transactions and balance transactions are not affected
                - Subscriptions using this method will fail on next charge attempt
                - Use `/payment_methods/update` when you only need to adjust metadata or state
            operationId: deletePaymentMethod
            tags:
                - Payment Methods
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            required:
                                - payment_method_id
                            properties:
                                payment_method_id:
                                    type: string
                                    description: ID of the payment method to delete
                                    example: "pm_xyz789"
            responses:
                '200':
                    description: Payment method deleted successfully
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    deleted:
                                        type: boolean
                                        example: true
                                    payment_method_id:
                                        type: string
                                        example: "pm_xyz789"
                '404':
                    description: Payment method not found
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                '401':
                    description: Unauthorized - Missing or invalid authentication
    /payment_methods/settings:
        post:
            summary: Get payment method settings
            description: |
                Retrieve payment method acceptance settings for your application. Returns
                configuration for all supported payment types (mobile money, bank accounts,
                cards, Motito) including whether each type is enabled and requires customer
                confirmation.

                Use this to:
                - Show only enabled payment methods in checkout
                - Require explicit consent when confirms_use is true
                - Display acceptance preferences to merchants
            operationId: getPaymentMethodSettings
            tags:
                - Payment Methods
            requestBody:
                required: false
                content:
                    application/json:
                        schema:
                            type: object
                            description: No request body required
                            properties: {}
            responses:
                '200':
                    description: Settings retrieved successfully
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    settings:
                                        $ref: '#/components/schemas/PaymentMethodSettings'
                '401':
                    description: Unauthorized - Missing or invalid authentication
    /products/create:
        post:
            summary: Create a product
            description: |
                Creates a new product in your catalog. Products represent items you sell—physical goods,
                digital downloads, services, or subscriptions. Each product includes pricing, description,
                and fulfillment details.

                Product types:
                - **physical**: Tangible goods requiring shipping (requires shipment details)
                - **digital**: Electronic content (e-books, software, media) delivered via download/stream
                - **service**: Intangible offerings (consulting, subscriptions, memberships)
                - **voucher**: Gift cards, credits, or promotional codes
                - **custom**: Custom product types for specialized use cases
                - **cause**: Donation or charitable contribution products
            operationId: createProduct
            tags:
                - Products
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/CreateProductRequest'
            responses:
                '200':
                    description: Product created successfully
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ProductResponse'
                '400':
                    description: Bad request - invalid parameters
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                '401':
                    description: Unauthorized - invalid or missing API key
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                '422':
                    description: Unprocessable entity - validation failed
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
