                    description: Pull configuration disabled successfully
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    account:
                                        $ref: '#/components/schemas/FinancialAccount'
                '401':
                    description: Unauthorized - Missing or invalid authentication
                '422':
                    description: Unprocessable Entity - Invalid request parameters
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    error:
                                        $ref: '#/components/schemas/Error'
    /balances:
        post:
            summary: Retrieve your balance
            description: |
                Fetch the current balance state across all currencies for your application.
                Returns the most recent balance snapshot, typically updated hourly by background workflows.
                The snapshot aggregates all balance transactions up to a specific cutoff time.

                Each currency breaks down into four states:
                - Available: Settled funds ready for payout
                - Pending: Funds aging through settlement window
                - Reserved: Platform-managed reserves for disputes/chargebacks
                - Refund: Funds you've set aside for processing refunds
            operationId: getBalances
            tags:
                - Balances
            requestBody:
                required: false
                content:
                    application/json:
                        schema:
                            type: object
                            properties: {}
            responses:
                '200':
                    description: Balance retrieved successfully
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    balances:
                                        type: object
                                        properties:
                                            ghs:
                                                type: object
                                                description: GHS balance breakdown
                                                properties:
                                                    available:
                                                        type: object
                                                        description: Settled funds ready for payout
                                                        properties:
                                                            amount:
                                                                type: integer
                                                                description: Available amount in minor units (pesewas)
                                                                example: 145000
                                                    pending:
                                                        type: object
                                                        description: Funds aging through settlement window
                                                        properties:
                                                            amount:
                                                                type: integer
                                                                description: Pending amount in minor units (pesewas)
                                                                example: 32000
                                                    reserved:
                                                        type: object
                                                        description: Platform-managed reserves for disputes
                                                        properties:
                                                            amount:
                                                                type: integer
                                                                description: Reserved amount in minor units (pesewas)
                                                                example: 0
                                                    refund:
