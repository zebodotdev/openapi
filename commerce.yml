            summary: Tokenize a payment method
            description: |
                Save a mobile-money payment method for an existing customer without charging it.
                Direct tokenization currently supports `mobile_money`; send the wallet details
                and owner identity described by the request schema.

                The returned payment method can be reused only while it is active, unarchived,
                and non-ephemeral. This operation supports idempotency.
            operationId: tokenizePaymentMethod
            tags:
                - Payment Methods
            parameters:
                - name: Idempotency-Key
                  in: header
                  required: false
                  schema:
                      type: string
                  description: Stable key used to replay safe retries without saving the payment method twice.
            requestBody:
