                '404':
                    description: Order not found
    /orders/request_confirmation:
        post:
            summary: Request payment confirmation
            description: Requests a new confirmation token to be sent to the customer for payment verification
            operationId: requestConfirmation
            tags:
                - Orders
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            required:
                                - order_id
                            properties:
                                order_id:
                                    type: string
                                    description: Unique identifier of the order
                                    example: "kAVwBsk6EhQVv2YBUhYAqMf0lktEoQ0S7ZR8y2xi"
            responses:
                '200':
