                                    type:
                                        type: string
                                        enum: [wallet, bank_account, dosh_account]
                                        description: Type of financial account
                                        example: "wallet"
                                    currency:
                                        type: string
                                        description: Three-letter ISO currency code
                                        example: "GHS"
                                    label:
                                        type: string
                                        description: Human-readable label
                                        example: "Primary Payout Account"
                                    description:
                                        type: string
                                        description: Optional description
                                    reference:
                                        type: string
                                        description: External reference ID
                                    created_at:
                                        type: string
                                        format: date-time
                                        description: Account creation timestamp
                                    archived_at:
                                        type: string
                                        format: date-time
                                        description: Archive timestamp (if archived)
                                    custom_data:
                                        type: object
                                        description: Custom key-value data
                                        additionalProperties:
                                            type: string
                error:
                    $ref: '#/components/schemas/Error'
        LineItem:
            oneOf:
                - $ref: '#/components/schemas/ProductLineItem'
                - $ref: '#/components/schemas/FeeLineItem'
                - $ref: '#/components/schemas/ShippingLineItem'
            discriminator:
                propertyName: type
                mapping:
                    product: '#/components/schemas/ProductLineItem'
                    fee: '#/components/schemas/FeeLineItem'
                    shipping: '#/components/schemas/ShippingLineItem'
        ProductLineItem:
            type: object
            required:
                - type
                - product
            properties:
                type:
                    type: string
                    enum: [product]
                    description: Line item type discriminator
                product:
                    $ref: '#/components/schemas/ProductDetails'
        FeeLineItem:
            type: object
            required:
                - type
                - fee
            properties:
                type:
                    type: string
                    enum: [fee]
                    description: Line item type discriminator
                fee:
                    $ref: '#/components/schemas/FeeDetails'
        ShippingLineItem:
            type: object
            required:
                - type
                - shipping
            properties:
                type:
                    type: string
                    enum: [shipping]
                    description: Line item type discriminator
                shipping:
                    $ref: '#/components/schemas/ShippingDetails'
        ProductDetails:
            oneOf:
                - $ref: '#/components/schemas/InlineProductDetails'
                - $ref: '#/components/schemas/CatalogProductWithPriceData'
                - $ref: '#/components/schemas/CatalogProductWithPriceReference'
            description: |
                Provide either inline product data or a `product_id` reference to an existing catalog
                product. Catalog-backed product line items can use an explicit `price` or an existing
                `price_id`. Commerce never falls back to a product's default unit price during order
                creation.
        InlineProductDetails:
            type: object
            required:
                - name
                - price
                - quantity
                - type
            properties:
                about:
                    type: string
                    description: Long-form description or marketing copy
                custom_data:
                    type: object
                    description: Your own key-value pairs—use them for whatever you need. Key and values are strings.
                    additionalProperties: true
                name:
                    type: string
                    description: Product name shown to the customer
                    example: "Premium Widget"
                price:
                    $ref: '#/components/schemas/Money'
                quantity:
                    type: integer
                    minimum: 1
                    description: How many units the customer is purchasing
                    example: 1
                reference:
                    type: string
                    description: Your SKU or internal product reference
                tax_code:
                    type: string
                    description: Tax classification code
                type:
                    type: string
                    enum: [physical, digital, service, voucher, custom, cause]
                    description: Product type—affects shipping requirements
        CatalogProductWithPriceData:
            type: object
            required:
                - price
                - product_id
                - quantity
            properties:
                price:
                    $ref: '#/components/schemas/Money'
                product_id:
                    type: string
                    description: Existing catalog product ID to snapshot onto the order line item
                    example: "prod_abc123xyz"
                quantity:
                    type: integer
                    minimum: 1
                    description: How many units of the catalog product the customer is purchasing
                    example: 1
        CatalogProductWithPriceReference:
            type: object
            required:
                - price_id
                - product_id
                - quantity
            properties:
                price_id:
                    type: string
                    description: Existing product price to snapshot onto the order line item. It must belong to the same application and product.
                    example: "pr_xyz789"
                product_id:
                    type: string
                    description: Existing catalog product ID to snapshot onto the order line item
                    example: "prod_abc123xyz"
                quantity:
                    type: integer
                    minimum: 1
                    description: How many units of the catalog product the customer is purchasing
                    example: 1
        FeeDetails:
            type: object
            required:
                - amount
            properties:
                id:
                    type: string
                    description: Fee identifier
                label:
                    type: string
                    description: Customer-facing label for this fee
                tax_code:
                    type: string
                    description: The tax classification code for the shipping fee
                description:
                    type: string
                    description: Customer-facing description for this fee
                custom_data:
                    type: object
                    description: Your own key-value pairs—use them for whatever you need. Key and values are strings.
                    additionalProperties: true
                amount:
                    $ref: '#/components/schemas/Money'
        ShippingDetails:
            type: object
            required:
                - fee
            properties:
                id:
                    type: string
                    description: Unique ID for this shipping charge
                tax_code:
                    type: string
                    description: The tax classification code for the shipping fee
                custom_data:
                    type: object
                    description: Your own key-value pairs—use them for whatever you need. Key and values are strings.
                    additionalProperties: true
                fee:
                    $ref: '#/components/schemas/Money'
        Money:
            type: object
            required:
                - currency
                - value
            properties:
                currency:
                    type: string
                    description: ISO 4217 currency code (lowercase)
                    example: "ghs"
                    pattern: '^[a-z]{3}$'
                value:
                    type: integer
                    description: Amount in smallest currency unit (e.g., pesewas for GHS)
                    example: 20000
                    minimum: 0
        BillingDetails:
            type: object
            required:
                - name
                - email_address
                - phone_number
            properties:
                name:
                    type: string
                    description: Billing contact name
                email_address:
                    type: string
                    format: email
                    description: Billing email address
                phone_number:
                    type: string
                    description: Billing phone number
                address:
                    $ref: '#/components/schemas/Address'
        Shipping:
            type: object
            required:
                - address
            properties:
                address:
                    $ref: '#/components/schemas/Address'
        Address:
            type: object
            required:
                - name
                - phone_number
                - line1
                - town
                - country
            properties:
                name:
                    type: string
                    description: Recipient name
                    example: "Customer Name"
                phone_number:
                    type: string
                    description: Contact phone number
                    example: "+233242058841"
                line1:
                    type: string
                    description: Street address line 1
                    example: "23 Adenta High Street"
                line2:
                    type: string
                    description: Street address line 2 (optional)
                    example: "Behind Pantang"
                town:
                    type: string
                    description: City or town
                    example: "Accra"
                region:
                    type: string
                    description: State, province, or region
                    example: "Greater Accra"
                district:
                    type: string
                    description: District or area
                    example: "Adenta"
                country:
                    type: string
                    description: Country name
                    example: "Ghana"
                post_code:
                    type: string
                    description: Postal/ZIP code
                    example: "GHA-123-9822"
        CreateMessageTemplateRequest:
            oneOf:
                - $ref: '#/components/schemas/CreateSMSMessageTemplateRequest'
                - $ref: '#/components/schemas/CreateEmailMessageTemplateRequest'
            discriminator:
                propertyName: channel
            description: Create request for one reusable SMS or email message template.
        CreateSMSMessageTemplateRequest:
            allOf:
                - $ref: '#/components/schemas/MessageTemplateCreateFields'
                - type: object
                  required:
                      - channel
                      - sms
                  properties:
                      channel:
                          type: string
                          enum: [sms]
                      sms:
                          $ref: '#/components/schemas/MessageTemplateSMSContent'
        CreateEmailMessageTemplateRequest:
            allOf:
                - $ref: '#/components/schemas/MessageTemplateCreateFields'
                - type: object
                  required:
                      - channel
                      - email
                  properties:
                      channel:
                          type: string
                          enum: [email]
                      email:
                          $ref: '#/components/schemas/MessageTemplateEmailContent'
                      attachments:
                          $ref: '#/components/schemas/MessageTemplateAttachmentIDs'
        MessageTemplateCreateFields:
            type: object
            required:
                - name
                - channel
                - purpose
            properties:
                name:
                    type: string
                    description: Human-readable template name.
                    example: "Receipt email"
                about:
                    type: string
                    description: Optional description of when this template should be used.
                    example: "Sent after a successful payment."
                channel:
                    type: string
                    enum: [sms, email]
                    description: Delivery channel this template renders for.
                purpose:
                    type: string
                    description: Caller-defined purpose for filtering and analytics.
                    example: "receipt"
                locale:
                    type: string
                    description: Template locale. Defaults to `en` when omitted.
                    example: "en"
                variables:
                    type: array
                    description: Variables accepted by this template.
                    items:
                        $ref: '#/components/schemas/MessageTemplateVariable'
        UpdateMessageTemplateRequest:
            type: object
            required:
                - id
            not:
                required:
                    - sms
                    - email
            properties:
                id:
                    type: string
                    description: API-generated message template id.
                    example: "mtpl_receipt"
                name:
                    type: string
                    description: Human-readable template name.
                    example: "Receipt email"
                about:
                    type: string
                    description: Optional description of when this template should be used.
                    example: "Sent after a successful payment."
                channel:
                    type: string
                    enum: [sms, email]
                    description: Existing template channel. Channels cannot be changed.
                purpose:
                    type: string
                    description: Caller-defined purpose for filtering and analytics.
                    example: "receipt"
                locale:
                    type: string
                    example: "en"
                variables:
                    type: array
                    items:
                        $ref: '#/components/schemas/MessageTemplateVariable'
                sms:
                    $ref: '#/components/schemas/MessageTemplateSMSContent'
                email:
                    $ref: '#/components/schemas/MessageTemplateEmailContent'
                attachments:
                    $ref: '#/components/schemas/MessageTemplateAttachmentIDs'
        MessageTemplateIDRequest:
            type: object
            required:
                - id
            properties:
                id:
                    type: string
                    description: API-generated message template id.
                    example: "mtpl_receipt"
        PageMessageTemplatesRequest:
            type: object
            properties:
                page:
                    type: integer
                    minimum: 1
                    default: 1
                size:
                    type: integer
                    minimum: 1
                    maximum: 256
                    default: 25
                status:
                    type: string
                    enum: [draft, published, archived]
                channel:
                    type: string
                    enum: [sms, email]
                purpose:
                    type: string
                    example: "receipt"
                locale:
                    type: string
                    example: "en"
        RenderMessageTemplatePreviewRequest:
            type: object
            required:
                - message_template
            properties:
                message_template:
                    $ref: '#/components/schemas/MessageTemplateReference'
        MessageTemplateReference:
            type: object
            required:
                - template_id
            properties:
                template_id:
                    type: string
                    description: API-generated message template id.
                    example: "mtpl_receipt"
                variables:
                    $ref: '#/components/schemas/MessageTemplateVariables'
        MessageTemplateVariables:
            type: object
            description: Variable values used when rendering a template.
            additionalProperties: true
            example:
                customer_name: "Akua"
                receipt_url: "https://pay.zebo.dev/receipts/123"
        MessageTemplateAttachmentIDs:
            type: array
            description: File IDs to attach when rendering or sending an email template.
            maxItems: 25
            items:
                type: string
                pattern: "^file_[A-Za-z0-9]+$"
            example:
                - "file_invoicePdf"
        MessageTemplateVariable:
            type: object
            required:
                - name
                - type
                - required
            properties:
                name:
                    type: string
                    pattern: "^[a-z][a-z0-9_]{0,63}$"
                    example: "customer_name"
                type:
                    type: string
                    enum: [string, number, integer, boolean, url, email, phone, date, datetime, array]
                required:
                    type: boolean
                'default':
                    description: Default value used when this variable is omitted.
                about:
                    type: string
                    description: Optional description of the variable.
                items:
                    type: array
                    description: Field schema for array item objects.
                    items:
                        $ref: '#/components/schemas/MessageTemplateVariable'
        MessageTemplateSMSContent:
            type: object
            required:
                - message_template
            properties:
                message_template:
                    type: string
                    description: SMS body template.
                    example: "Your code is {{code}}."
        MessageTemplateEmailContent:
            type: object
            required:
                - subject
                - html
            properties:
                subject:
                    type: string
                    description: Email subject template.
                    example: "Your receipt"
                html:
                    type: string
                    description: HTML email body template.
                    example: "<p>Thanks {{customer_name}}.</p>"
                from:
                    $ref: '#/components/schemas/MessageTemplateMailbox'
                reply_to:
                    $ref: '#/components/schemas/MessageTemplateMailbox'
                headers:
                    type: object
                    additionalProperties:
                        type: string
        MessageTemplateMailbox:
            type: object
            required:
                - address
            properties:
                address:
                    type: string
                    format: email
                    example: "notifications@example.com"
                name:
                    type: string
                    example: "Acme"
        MessageTemplateSafetyResult:
            type: object
            description: Result of the email safety scan.
            properties:
                status:
                    type: string
                    enum: [allowed, rejected, quarantined]
                reason_codes:
                    type: array
                    items:
                        type: string
                sanitized_html:
                    type: string
                    nullable: true
                normalized_text:
                    type: string
                scanner:
                    type: string
                    example: "local-static-v1"
                content_hash:
                    type: string
        MessageTemplate:
            type: object
            required:
                - id
                - name
                - channel
                - purpose
                - locale
                - status
                - version
                - draft_version
                - has_unpublished_changes
                - created_at
                - updated_at
            properties:
                id:
                    type: string
                    description: API-generated unique template id.
                    example: "mtpl_receipt"
                name:
                    type: string
                    example: "Receipt email"
                about:
                    type: string
                    nullable: true
                    example: "Sent after successful payment."
                channel:
                    type: string
                    enum: [sms, email]
                purpose:
                    type: string
                    example: "receipt"
                locale:
                    type: string
                    example: "en"
                status:
                    type: string
                    enum: [draft, published, archived]
                version:
                    type: integer
                    example: 2
                published_version:
                    type: integer
                    nullable: true
                    example: 1
                draft_version:
                    type: integer
                    example: 2
                has_unpublished_changes:
                    type: boolean
                variables:
                    type: array
                    items:
                        $ref: '#/components/schemas/MessageTemplateVariable'
                sms:
                    $ref: '#/components/schemas/MessageTemplateSMSContent'
                email:
                    $ref: '#/components/schemas/MessageTemplateEmailContent'
                attachments:
                    $ref: '#/components/schemas/MessageTemplateAttachmentIDs'
                created_at:
                    type: string
                    format: date-time
                updated_at:
                    type: string
                    format: date-time
                published_at:
                    type: string
                    format: date-time
                    nullable: true
                archived_at:
                    type: string
                    format: date-time
                    nullable: true
        MessageTemplateEnvelope:
            type: object
            properties:
                message_template:
                    $ref: '#/components/schemas/MessageTemplate'
                error:
                    $ref: '#/components/schemas/Error'
        MessageTemplatesPageEnvelope:
            type: object
            properties:
                page:
                    $ref: '#/components/schemas/MessageTemplatesPage'
                error:
                    $ref: '#/components/schemas/Error'
        MessageTemplatesPage:
            type: object
            required:
                - number
                - size
                - message_templates
            properties:
                number:
                    type: integer
                    example: 1
                size:
                    type: integer
                    example: 25
                message_templates:
                    type: array
                    items:
                        $ref: '#/components/schemas/MessageTemplate'
        RenderMessageTemplatePreviewResponse:
            type: object
            properties:
                message_template:
                    $ref: '#/components/schemas/MessageTemplate'
                rendered:
                    $ref: '#/components/schemas/RenderedMessageTemplate'
                error:
                    $ref: '#/components/schemas/Error'
        RenderedMessageTemplate:
            type: object
            required:
                - channel
            properties:
                channel:
                    type: string
                    enum: [sms, email]
                attachments:
                    $ref: '#/components/schemas/MessageTemplateAttachmentIDs'
                sms:
                    $ref: '#/components/schemas/RenderedSMSMessageTemplate'
                email:
                    $ref: '#/components/schemas/RenderedEmailMessageTemplate'
        RenderedSMSMessageTemplate:
            type: object
            required:
                - full_message
            properties:
                full_message:
                    type: string
                    example: "Your code is 123456."
        RenderedEmailMessageTemplate:
            type: object
            required:
                - subject
                - text
                - html
            properties:
                subject:
                    type: string
                    example: "Your receipt"
                text:
                    type: string
                    example: "Thanks Akua."
                html:
                    type: string
                    example: "<p>Thanks Akua.</p>"
                from:
                    $ref: '#/components/schemas/MessageTemplateMailbox'
                reply_to:
                    $ref: '#/components/schemas/MessageTemplateMailbox'
                headers:
                    type: object
                    additionalProperties:
                        type: string
                safety:
                    $ref: '#/components/schemas/MessageTemplateSafetyResult'
        OrderDocumentDeliveryRequest:
            type: object
            additionalProperties: false
            required:
                - order_id
            properties:
                order_id:
                    type: string
                    description: Order whose hosted invoice or receipt link should be delivered.
                    example: "or_48ZW7BGvYUBWc1i6WBkL2jr0iPQP5jUy76mmmHpt"
        OrderDocumentDeliveryResponse:
            type: object
            description: Response returned by deliberate order document delivery endpoints.
            properties:
                delivery:
                    $ref: '#/components/schemas/OrderDocumentDelivery'
                error:
                    $ref: '#/components/schemas/Error'
                order:
                    $ref: '#/components/schemas/Order'
        OrderDocumentDelivery:
            type: object
            description: Delivery result for one hosted order document link.
            properties:
                deliveries:
                    type: array
                    description: Chime messages that were accepted for delivery.
                    items:
                        $ref: '#/components/schemas/OrderDocumentDeliveryAttempt'
                document_kind:
                    type: string
                    enum: [invoice, receipt]
                    description: Hosted document that was delivered.
                    example: "invoice"
                document_url:
                    type: string
                    format: uri
                    description: Hosted invoice or receipt URL sent to the customer. Receipt URLs use the hosted receipt path, not the invoice PDF path.
                    example: "https://pages.zebo.dev/invoices/or_48ZW7BGvYUBWc1i6WBkL2jr0iPQP5jUy76mmmHpt"
                failed_channels:
                    type: array
                    description: Channels that failed to send.
                    items:
                        type: string
                        enum: [email, sms]
                    example: ["email"]
                failures:
                    type: array
                    description: Per-channel delivery failures.
                    items:
                        $ref: '#/components/schemas/OrderDocumentDeliveryFailure'
                sent_channels:
                    type: array
                    description: Channels accepted by Chime.
                    items:
                        type: string
                        enum: [email, sms]
                    example: ["sms"]
        OrderDocumentDeliveryAttempt:
            type: object
            description: Chime delivery accepted for one channel.
            properties:
                channel:
                    type: string
                    enum: [email, sms]
                    description: Delivery channel.
                    example: "sms"
                chime_id:
                    type: string
                    description: Chime ID created for this delivery.
                    example: "chm_7QYpB8c3V9kL2nM4"
        OrderDocumentDeliveryFailure:
            type: object
            description: Chime delivery failure for one channel.
            properties:
                channel:
                    type: string
                    enum: [email, sms]
                    description: Delivery channel.
                    example: "email"
                error:
                    type: string
                    description: Provider or Chime error for this channel.
                    example: "chime api returned status=503"

        PaymentMethodPageRequest:
            type: object
            properties:
                customer_id:
                    type: string
                    description: Optional customer ID to scope the page to a single customer
                    example: "cu_a1b2c3d4e5"
                page_number:
                    type: integer
                    minimum: 1
                    maximum: 10
                    description: 1-based page index to fetch (1-10 inclusive)
                    default: 1
                page_size:
                    type: integer
                    minimum: 1
                    maximum: 256
                    description: Number of payment methods per page (1-256)
                    default: 256
        PaymentMethodPageResponse:
            type: object
            properties:
                error:
                    $ref: '#/components/schemas/Error'
                page:
                    type: object
                    properties:
                        number:
                            type: integer
                            description: The page number returned
                        payment_methods:
                            type: array
                            items:
                                $ref: '#/components/schemas/PaymentMethodObject'
                        size:
                            type: integer
                            description: The number of payment methods in this page
        MobileMoney:
            type: object
            required:
                - network
                - account_number
            properties:
                network:
                    type: string
                    enum: [mtn, telecel, airteltigo]
                    description: Mobile money service provider
                    example: "mtn"
                account_number:
                    type: string
                    description: Mobile money account number
                    example: "0544998605"
        OrderCreateResponse:
            type: object
            description: Response returned when an order is successfully created
            required:
                - order
            properties:
                order:
                    type: object
                    required:
                        - id
                        - number
                        - status
                        - customer
                        - line_item_group
                        - initiated_at
                        - sealed_at
                    properties:
                        id:
                            type: string
                            description: Unique identifier for the created order
                            example: "cHPzmk9aL1iQPjfYICpKh73mMzlasKezSCCl27J0"
                        number:
                            type: string
                            description: Human-readable order number
                            example: "ORDER-NUMBER"
                        receipt_number:
                            type: string
                            description: Merchant-provided receipt number, when set
                            example: "RCPT-NUMBER"
                        invoice_settings:
                            $ref: '#/components/schemas/InvoiceSettings'
                        status:
                            type: string
                            enum: [preparing, requires_payment, completed, canceled, expired]
                            description: Current status of the order
                            example: "requires_payment"
                        customer:
                            type: object
                            description: Customer who owns the order
                            required:
                                - id
                                - name
                                - email_address
                                - phone_number
                                - created_at
                            properties:
                                id:
                                    type: string
                                    description: Unique identifier for the customer
                                    example: "Rc3pbHKtmoYpWR3R19o9eYio9YUXEAEY3fwaiuZb"
                                name:
                                    type: string
                                    description: Customer name
                                    example: "Gloria Kesewaa"
                                email_address:
                                    type: string
                                    format: email
                                    description: Customer email
                                    example: "gloria@kesewaa.co"
                                phone_number:
                                    type: string
                                    description: Customer's phone number in full international format
                                    example: "+233544998605"
                                billing_address:
                                    type: object
                                    description: Customer billing address
                                    properties:
                                        name:
                                            type: string
                                            description: Recipient name
                                            example: "Anita Segnom"
                                        phone_number:
                                            type: string
                                            description: Recipient phone number
                                            example: "+233559714200"
                                        line1:
                                            type: string
                                            description: Primary street address line
                                            example: "15 Main Street"
                                        line2:
                                            type: string
                                            description: Secondary street address line
                                            example: "Apartment 3B"
                                        city:
                                            type: string
                                            description: City or town
                                            example: "Accra"
                                        region:
                                            type: string
                                            description: Region or state
                                            example: "Greater Accra"
                                        post_code:
                                            type: string
                                            description: Postal code
                                            example: "GA-123-4567"
                                        country:
                                            type: string
                                            description: ISO 3166-1 alpha-2 country code
                                            example: "GH"
                                shipping_address:
                                    type: object
                                    description: Customer shipping address
                                    properties:
                                        name:
                                            type: string
                                            description: Recipient name
                                            example: "Anita Segnom"
                                        phone_number:
                                            type: string
                                            description: Recipient phone number
                                            example: "+233559714200"
                                        line1:
                                            type: string
                                            description: Primary street address line
                                            example: "15 Main Street"
                                        line2:
                                            type: string
                                            description: Secondary street address line
                                            example: "Apartment 3B"
                                        city:
                                            type: string
                                            description: City or town
                                            example: "Accra"
                                        region:
                                            type: string
                                            description: Region or state
                                            example: "Greater Accra"
                                        post_code:
                                            type: string
                                            description: Postal code
                                            example: "GA-123-4567"
                                        country:
                                            type: string
