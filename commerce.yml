                reason:
                    $ref: '#/components/schemas/RefundReason'
                reason_details:
                    type: string
                    maxLength: 2048
                    description: Line-specific explanation. Requires a line-level reason; required when that reason is `custom`.
                refund_amount:
                    $ref: '#/components/schemas/RefundMoney'
        RefundRequestMeta:
            type: object
            additionalProperties: false
            properties:
                idempotency_key:
                    type: string
                    minLength: 1
                    maxLength: 255
                    description: Body-level compatibility key. Prefer the `Idempotency-Key` header for new integrations.
        CreateRefundRequest:
            type: object
            additionalProperties: false
            required: [line_items, order_id, reason]
            properties:
                custom_data:
                    type: object
                    additionalProperties:
                        type: string
                    description: Your string-valued metadata.
                line_items:
                    type: array
                    minItems: 1
                    maxItems: 64
                    items:
                        $ref: '#/components/schemas/CreateRefundLineItem'
                order_id:
                    type: string
