                    example: "LINE"
                    minLength: 2
                    maxLength: 10
                execute_payment:
                    type: boolean
                    description: Whether to execute payment immediately
                    default: false
                finalize:
                    type: boolean
                    description: Whether to explicitly finalize the order. When true, the order is finalized regardless of payment state. When false or omitted, finalization follows default heuristics (finalize if payment is executable).
                    default: false
                request_meta:
                    type: object
                    description: Optional metadata controlling request processing
                    properties:
                        idempotency_key:
                            type: string
                            description: Unique key to prevent duplicate order creation
                checkout_settings:
                    type: object
                    description: Checkout and payment flow configuration. Strongly recommended to provide both redirect_url and cancel_url for a delightful customer experience.
                    properties:
                        redirect_url:
                            type: string
                            format: uri
                            description: URL to redirect customer after payment completion
                            example: "https://example.com/order/complete"
