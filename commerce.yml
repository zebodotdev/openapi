    /apps/create:
        post:
            summary: Create an application
            description: Creates a Commerce application, initial secret key, and direct parent-child relationship for the authenticated creator app.
            operationId: createApp
            tags:
                - Apps
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            required:
                                - name
                            properties:
                                name:
                                    type: string
                                    description: Display name for the application.
                                alias:
                                    type: string
                                    description: Optional short name for the application.
                                description:
                                    type: string
                                    description: Optional application description.
                                legal_entity_type:
                                    type: string
                                    enum:
                                        - government
                                        - non_profit
                                        - business
                                        - individual
                                relationship_policy:
                                    type: object
                                    description: Optional direct-placement relationship policy. Omitted values default to parent management and child credentials.
                                    properties:
                                        management:
                                            type: string
                                            enum:
                                                - parent
                                                - child
                                            default: parent
                                            description: Who can manage the child app and its resources through this relationship.
                                        credentials:
                                            type: string
                                            enum:
                                                - child
                                                - parent
                                            default: child
                                            description: Who can create, rotate, or disable the child app's API keys after creation. Defaults to child. In V1, apps/create still returns the initial child key to the caller.
            responses:
                '200':
                    description: Application created successfully.
                    content:
                        application/json:
                            schema:
                                type: object
                                required:
                                    - app
                                properties:
                                    app:
                                        type: object
                                        required:
                                            - id
                                            - name
                                            - created_at
                                        properties:
                                            id:
                                                type: string
                                            name:
                                                type: string
                                            alias:
                                                type: string
                                            description:
                                                type: string
                                            created_at:
                                                type: string
                                                format: date-time
                                            secret_key:
                                                type: object
                                                properties:
                                                    id:
                                                        type: string
                                                    token_type:
                                                        type: string
                                                    issued_at:
                                                        type: string
                                                        format: date-time
                                                    token:
                                                        type: string
                                            relationship:
                                                type: object
                                                description: Relationship receipt for the created child app.
                                                properties:
                                                    id:
                                                        type: string
                                                    kind:
                                                        type: string
                                                        enum:
                                                            - placement
                                                    policy_version:
                                                        type: string
                                                        example: app_relationship_authority.v1
                                                    status:
                                                        type: string
                                                        enum:
                                                            - active
                                                            - inactive
                                                            - suspended
                                                            - revoked
                                                    actor_app_id:
                                                        type: string
                                                    creator_app_id:
                                                        type: string
                                                    placement_parent_app_id:
                                                        type: string
                                                    subject_app_id:
                                                        type: string
                                                    child_app_id:
                                                        type: string
                                                    relationship_policy:
                                                        type: object
                                                        properties:
                                                            management:
                                                                type: string
                                                                enum:
                                                                    - parent
                                                                    - child
                                                            credentials:
                                                                type: string
                                                                enum:
                                                                    - child
                                                                    - parent
                                                    created_at:
                                                        type: string
                                                        format: date-time
                '401':
                    description: Unauthorized - invalid or missing API key
                    content:
                        application/json:
                            schema:
