                    example: 1
                size:
                    type: integer
                    example: 1
                files:
                    type: array
                    items:
                        $ref: '#/components/schemas/FileObject'
        FileObject:
            type: object
            description: Public file metadata. Storage provider details, object keys, and idempotency internals are not exposed.
            required:
                - id
                - purpose
                - status
                - scan_status
                - content_type
                - size
                - checksum_sha256
                - created_by
                - source
                - storage
                - created_at
                - updated_at
            properties:
                id:
                    type: string
                    example: file_2xC7k9gK5yQnZ4w8P1sT6vR3
                purpose:
                    type: string
                    example: product_image
                status:
                    type: string
                    enum: [uploading, processing, available, failed, deleted]
                scan_status:
                    type: string
                    enum: [pending, passed, failed, skipped]
                name:
                    type: string
                    example: Hero image
                filename:
                    type: string
                    example: hero.png
                content_type:
                    type: string
                    example: image/png
                size:
                    type: integer
                    format: int64
                    description: Original byte size.
                    example: 384221
                checksum_sha256:
                    type: string
                    example: 02c26c6e49b2c332c8fb95d9f6a7c4f2d9e3f1f5a63f0b1a9d2a0ba
                created_by:
                    $ref: '#/components/schemas/FileActor'
                source:
                    $ref: '#/components/schemas/FileSource'
                media:
                    $ref: '#/components/schemas/FileMedia'
                storage:
                    $ref: '#/components/schemas/PublicFileStorage'
                delivery:
                    $ref: '#/components/schemas/FileDelivery'
                latest_error:
                    $ref: '#/components/schemas/FileLatestError'
                custom_data:
                    type: object
                    additionalProperties:
                        type: string
                metadata:
                    type: object
                    readOnly: true
                    description: System-managed metadata associated with the file
                    additionalProperties:
                        type: string
                created_at:
                    type: string
                    format: date-time
                updated_at:
                    type: string
                    format: date-time
                available_at:
                    type: string
                    format: date-time
                expires_at:
                    type: string
                    format: date-time
        FileUploadReceipt:
            type: object
            required: [content_type, created_at, id, size, status]
            properties:
                content_type:
                    type: string
                created_at:
                    type: string
                    format: date-time
                filename:
                    type: string
                id:
                    type: string
                name:
                    type: string
                size:
                    type: integer
                    format: int64
                    minimum: 0
                status:
                    type: string
                    enum: [uploading, processing, available, failed, deleted]
        FileActor:
            type: object
            required: [type]
            properties:
                type:
                    type: string
                    example: api_key
                id:
                    type: string
                name:
                    type: string
                email:
                    type: string
                    format: email
        FileSource:
            type: object
