                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                '422':
                    description: Unprocessable entity - key generation failed
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
    /keys/page:
