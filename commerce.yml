            description: |
                Update the mutable description, classification, fulfillment, dimension, media,
                attribute, and custom-data fields of an existing product. If `type` is supplied,
                it must equal the existing type. `images` and `media` are mutually exclusive.
                Inline `price` updates are not supported; use the Prices API. An ID-only request
