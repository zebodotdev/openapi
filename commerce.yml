            responses:
                '200':
                    description: Secret key retrieved successfully.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/LookupSecretKeyResponse'
                '401':
                    description: Unauthorized - invalid or missing API key
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                '404':
                    description: Secret key not found for the authenticated application
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                '422':
                    description: Unprocessable entity - invalid parameters or read failure
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
    /keys/update:
        post:
            summary: Update a secret key
            description: Updates the label of a secret key owned by the authenticated application. Send an empty label to clear it. The bearer token is never returned.
            operationId: updateSecretKey
            tags:
                - API Keys
            parameters:
                - $ref: '#/components/parameters/IdempotencyKey'
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/UpdateSecretKeyRequest'
            responses:
                '200':
                    description: Secret key updated successfully.
