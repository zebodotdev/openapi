                                                        financial_account_id:
                                                            type: string
                                                            description: ID of the financial account receiving the payout
                                                            example: "fa_1234567890abcdef"
                        shipping:
                            type: object
                            description: Shipping information for the order
                            nullable: true
                        initiated_at:
                            type: string
                            format: date-time
