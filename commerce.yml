                                                        description: Funds set aside for processing refunds
                                                        properties:
                                                            amount:
                                                                type: integer
                                                                description: Refund balance in minor units (pesewas)
                                                                example: 0
                                                    includes_transactions_before:
                                                        type: string
                                                        format: date-time
                                                        description: Snapshot cutoff time - balance reflects transactions before this timestamp
                                                        example: "2024-12-24T14:00:00.000Z"
                                            usd:
                                                type: object
                                                description: USD balance breakdown
                                                properties:
                                                    available:
                                                        type: object
                                                        description: Settled funds ready for payout
                                                        properties:
                                                            amount:
                                                                type: integer
                                                                description: Available amount in minor units (cents)
                                                                example: 0
                                                    pending:
                                                        type: object
                                                        description: Funds aging through settlement window
                                                        properties:
                                                            amount:
                                                                type: integer
                                                                description: Pending amount in minor units (cents)
                                                                example: 0
                                                    reserved:
                                                        type: object
                                                        description: Platform-managed reserves for disputes
                                                        properties:
                                                            amount:
                                                                type: integer
                                                                description: Reserved amount in minor units (cents)
                                                                example: 0
                                                    refund:
                                                        type: object
                                                        description: Funds set aside for processing refunds
                                                        properties:
                                                            amount:
                                                                type: integer
                                                                description: Refund balance in minor units (cents)
                                                                example: 0
                                                    includes_transactions_before:
                                                        type: string
                                                        format: date-time
                                                        description: Snapshot cutoff time for USD balance
                                                        example: "2024-12-24T14:00:00.000Z"
                '401':
                    description: Unauthorized - Missing or invalid authentication
                    content:
                        application/json:
