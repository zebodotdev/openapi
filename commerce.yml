                - Files
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/PageFilesRequest'
            responses:
                '200':
                    description: File page retrieved successfully
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/FilePageResponse'
    /files/contents:
        post:
            summary: Deliver file contents
            description: Streams original file bytes for a file owned by the authorized application, or returns a 303 redirect to a short-lived signed delivery URL when delivery is redirect.
            operationId: streamFileContents
            tags:
                - Files
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/FileContentsRequest'
            responses:
                '200':
                    description: Original file bytes
                    content:
                        application/octet-stream:
                            schema:
                                type: string
                                format: binary
                '303':
                    description: Redirect to a short-lived signed delivery URL
                    headers:
                        Location:
                            schema:
                                type: string
                                format: uri
                '404':
                    description: File not found
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/FileApiError'
    /files/delete:
        post:
            summary: Delete a file
            description: Tombstones a file and schedules backing-object cleanup when allowed by reference policy.
            operationId: deleteFile
