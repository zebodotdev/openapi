        Payout:
            type: object
            description: A payout scheduled from your Commerce balance to a destination financial account
            required:
                - destination_id
                - execute_after
                - id
                - initiated_at
                - max_amount
                - status
            properties:
                amount:
                    $ref: '#/components/schemas/Money'
                balance_transactions:
                    type: array
                    description: Balance transaction IDs linked to this payout
                    items:
                        type: string
                canceled_at:
                    type: string
                    format: date-time
                    description: When the payout was canceled
                custom_data:
                    type: object
                    description: String key-value metadata stored on the payout
                    additionalProperties:
                        type: string
                destination_id:
                    type: string
                    description: Financial account receiving the funds
                    example: "fa_1234567890abcdef"
                error:
                    type: object
                    description: Public failure details when execution fails
                    required:
                        - cause
                        - message
                        - occurred_at
                        - type
                    properties:
                        cause:
                            type: string
                        message:
                            type: string
                        occurred_at:
                            type: string
                            format: date-time
                        type:
                            type: string
                execute_after:
                    type: string
                    format: date-time
                    description: Earliest moment payout execution may begin
                    example: "2026-08-05T09:00:00Z"
                executed_by:
                    type: string
                    description: Actor that executed the payout
                expected_at:
                    type: string
                    format: date-time
                    description: Expected completion time
                failed_at:
                    type: string
                    format: date-time
                    description: When the payout entered its unsuccessful terminal state
                id:
                    type: string
                    description: Unique payout identifier
                    example: "po_yQ2wXm5Dc7Pk9Ls1Vn0RgHaB"
                initiated_at:
                    type: string
                    format: date-time
                    description: When the payout was created
                initiated_by:
                    type: string
                    description: Actor that initiated the payout
                max_amount:
                    $ref: '#/components/schemas/Money'
                reference:
                    type: string
                    description: Merchant reference carried on the payout
                    example: "PAYOUT-APR-15"
                schedule_id:
                    type: string
                    description: Schedule associated with the payout
                scheduled_at:
                    type: string
                    format: date-time
                    description: When the payout was scheduled
                scheduled_by:
                    type: string
                    description: Actor that scheduled the payout
                sent_at:
                    type: string
                    format: date-time
                    description: When the transfer was sent
                source_id:
                    type: string
                    description: Source identifier associated with the payout
                status:
                    type: string
                    enum: [initialized, scheduled, processing, executing, succeeded, invalid, canceled]
                    description: Current payout lifecycle state
                succeeded_at:
                    type: string
                    format: date-time
                    description: When the payout succeeded
        PayoutSettingsLookup:
            type: object
            description: Complete payout settings read model
            required:
                - destinations
            properties:
                destinations:
                    type: object
                    description: Currency-to-financial-account destination map
                    additionalProperties:
                        type: string
                    example:
                        ghs: "fa_1234567890abcdef"
                fx_enabled:
                    type: boolean
                    description: Present only when foreign exchange is enabled in stored settings
                schedule:
                    type: object
                    description: Active payout schedule
                    required:
                        - aging_spec
