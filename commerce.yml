                        - interval
                        - name
                        - schedule_on
                        - type
                    properties:
                        aging_spec:
                            type: object
                            required:
                                - abide
                                - label
                                - t_plus
                            properties:
                                abide:
                                    type: string
                                label:
                                    type: string
                                t_plus:
                                    type: string
                                    example: "168h"
                        description:
                            type: string
                        interval:
                            type: string
                        name:
                            type: string
                        schedule_on:
                            type: string
                        type:
                            type: string
        PayoutSettingsMutation:
            type: object
            description: Payout settings fields returned after a mutation
            properties:
                destinations:
                    type: object
                    description: Currency-to-financial-account destination map
                    additionalProperties:
                        type: string
                    example:
                        ghs: "fa_1234567890abcdef"
                id:
                    type: string
                    description: Payout settings identifier
                schedule:
                    type: object
                    description: Updated payout schedule
                    required:
                        - description
                        - id
                        - interval
                        - name
                        - schedule_on
                        - spec
                        - type
                    properties:
                        description:
                            type: string
                        id:
                            type: string
                        interval:
                            type: string
                        name:
                            type: string
                        schedule_on:
                            type: string
                        spec:
                            type: object
                            required:
                                - abide
                                - id
                                - label
                                - t_plus
                            properties:
                                abide:
                                    type: string
                                id:
                                    type: string
                                label:
                                    type: string
                                t_plus:
                                    type: string
                                    example: "168h"
                        type:
                            type: string
        PaymentMethodOwnerInput:
            type: object
            required:
                - address
                - name
            properties:
                address:
                    type: object
                    required:
                        - country
                    properties:
                        city:
                            type: string
                        country:
                            type: string
                            minLength: 1
                            description: Country associated with the owner address.
                            example: "GH"
                        line1:
                            type: string
                        line2:
                            type: string
                        name:
                            type: string
                        phone_number:
                            type: string
                        post_code:
                            type: string
                        region:
                            type: string
                name:
                    type: string
                    minLength: 1
                    description: Payment method owner's name.
                    example: "Jane Mensah"
        PaymentMethodTokenizeBase:
            type: object
            required:
                - customer_id
                - type
            properties:
                customer_id:
                    type: string
                    minLength: 1
                    description: Existing customer in the authenticated application who will own the payment method.
                    example: "cu_a1b2c3d4e5"
                custom_data:
                    type: object
                    additionalProperties:
                        type: string
                    description: String key-value data stored with the payment method.
                type:
                    type: string
                    enum: [mobile_money]
        TokenizeMobileMoneyPaymentMethodRequest:
            allOf:
                - $ref: '#/components/schemas/PaymentMethodTokenizeBase'
                - type: object
                  required:
                      - mobile_money
                      - owner
                  properties:
                      type:
                          type: string
                          enum: [mobile_money]
                      mobile_money:
                          type: object
                          required:
                              - account_number
                              - network
                          properties:
                              account_number:
                                  type: string
                                  minLength: 1
                                  description: Mobile-money number in a valid local or international phone-number format.
                                  example: "+233242057831"
                              network:
                                  type: string
                                  enum: [airtel, mtn, telecel, vodafone]
                                  example: "mtn"
                      owner:
                          $ref: '#/components/schemas/PaymentMethodOwnerInput'
        PaymentMethodObject:
            type: object
            description: A tokenized payment instrument tied to a customer
            required:
                - id
                - active
                - customer_id
                - type
                - created_at
            properties:
                active:
                    type: boolean
                    description: Whether this payment method is active and reusable in new payment flows
                    example: true
                app_customer_local_fingerprint:
                    type: string
                    description: Stable duplicate-detection fingerprint scoped to this application and customer.
                app_local_fingerprint:
                    type: string
                    description: Stable duplicate-detection fingerprint scoped to this application.
                archived_at:
                    type: string
                    format: date-time
                    description: Timestamp when the payment method was archived. Omitted while unarchived.
                bank_account:
                    type: object
                    description: Bank account details (present when type is bank_account)
                    required:
                        - type
                    properties:
                        ghana_bank_account:
                            type: object
                            description: Ghana bank account details
                            required:
                                - account_number
                            properties:
                                branch:
                                    type: string
                                    description: Branch name
                                    example: "Accra Main"
                                name:
                                    type: string
                                    description: Account holder name
                                    example: "John Doe"
                                account_number:
                                    type: string
                                    description: Account number
                                    example: "1234567890"
                                sort_code:
                                    type: string
                                    description: Bank sort code
                                    example: "030100"
                                swift_code:
                                    type: string
                                    description: SWIFT/BIC code
                                    example: "GHBAGHAACCRA"
                        type:
                            type: string
                            description: Bank account sub-type
                            enum: [ghana_bank_account]
                            example: "ghana_bank_account"
                created_at:
                    type: string
                    format: date-time
                    description: When this payment method was tokenized
                    example: "2025-11-23T13:00:00Z"
                custom_data:
                    type: object
                    description: Custom key-value metadata
                    additionalProperties:
                        type: string
                    example: {}
                customer_id:
                    type: string
                    description: Customer who owns this payment method
                    example: "cu_a1b2c3d4e5"
                ephemeral:
                    type: boolean
                    description: Whether the method is limited to its originating flow and cannot be reused.
                    example: false
                expires_on:
                    type: string
                    format: date-time
                    description: When this payment method expires. Omitted when no expiry is available.
                id:
                    type: string
                    description: Unique identifier for this payment method
                    example: "pm_xyz789"
                mobile_money:
                    type: object
                    description: Masked mobile-money wallet details (present when type is mobile_money)
                    required:
                        - account_number
                        - last4
                        - network
                    properties:
                        account_number:
                            type: string
                            description: Masked wallet number. The full account number is never returned.
                            example: "****7831"
                        last4:
                            type: string
                            description: Last four numeric digits of the normalized wallet number.
                            example: "7831"
                        network:
                            type: string
                            enum: [airtel, mtn, telecel, vodafone]
                            description: Mobile network operator
                            example: "mtn"
                owner:
                    type: object
                    description: Owner identity captured during tokenization when provided
                    required:
                        - name
                    properties:
                        address:
                            type: object
                            description: Postal address for the owner when available
                            required:
                                - country
                            properties:
                                city:
                                    type: string
                                    description: City or locality
                                    example: "Accra"
                                country:
                                    type: string
                                    description: Two-letter ISO country code
                                    example: "GH"
                                line_1:
                                    type: string
                                    description: First line of the street address
                                    example: "1 High Street"
                                line_2:
                                    type: string
                                    description: Second line of the street address
                                    example: "Osu"
                                name:
                                    type: string
                                    description: Recipient name at this address, if different from owner name
                                    example: "Jane Mensah"
                                phone_number:
                                    type: string
                                    description: Phone number for this address
                                    example: "+233201234567"
                                post_code:
                                    type: string
                                    description: Postal or ZIP code
                                    example: "GA-123-4567"
                                region:
                                    type: string
                                    description: Region, state, or province
                                    example: "Greater Accra"
                        name:
                            type: string
                            description: Owner full legal name
                            example: "Yaw Boakye"
                type:
                    type: string
                    enum: [mobile_money, bank_account, card, motito]
                    description: Payment rail type
                    example: "mobile_money"
                supplied:
                    type: object
                    description: Public provenance for how the payment method was supplied.
                    required:
                        - by
                        - supplied_at
                    properties:
                        attempt_id:
                            type: string
                        by:
                            type: string
                        channel:
                            type: string
                        resource_id:
                            type: string
                        resource_type:
                            type: string
                        supplied_at:
                            type: string
                            format: date-time
                universal_fingerprint:
                    type: string
                    description: Stable duplicate-detection fingerprint across applications when available.
                verification:
                    type: object
                    description: Most recent verification record when the payment method has entered a verification flow.
                    required:
                        - initiated_at
                        - request_id
                        - type
                    properties:
                        completed_at:
                            type: string
                            format: date-time
                            description: When verification was completed
                            example: "2025-11-23T13:07:00Z"
                        initiated_at:
                            type: string
                            format: date-time
                            description: When verification was initiated
                            example: "2025-11-23T13:00:00Z"
                        mechanism:
                            type: string
                            description: Verification mechanism used
                            example: "otp"
                        request_id:
                            type: string
                            description: ID of the verification request
                            example: "req_abc123"
                        type:
                            type: string
                            description: Verification type
                            example: "sms_otp"
                verified_at:
                    type: string
                    format: date-time
                    description: When ownership verification was completed
                    example: "2025-11-23T13:07:00Z"

        PaymentMethodData:
            type: object
            description: Payment instrument details for tokenization
            required:
                - type
            properties:
                type:
                    type: string
                    enum: [mobile_money]
                    description: Payment rail type (currently only mobile_money supported)
                    example: "mobile_money"
                mobile_money:
                    type: object
                    description: Mobile money wallet details (required when type is mobile_money)
                    required:
                        - network
                        - account_number
                    properties:
                        network:
                            type: string
                            enum: [airtel, mtn, telecel, vodafone]
                            description: Mobile money network provider
                            example: "mtn"
                        account_number:
                            type: string
                            description: Mobile money account number (international or local format)
                            example: "+233242057831"
                            pattern: '^(\+?\d{10,15})$'
        PaymentMethodSettings:
            type: object
            description: Payment method acceptance configuration for an application
            properties:
                mobile_money:
                    $ref: '#/components/schemas/PaymentMethodTypeSetting'
                bank_account:
                    $ref: '#/components/schemas/PaymentMethodTypeSetting'
                card:
                    $ref: '#/components/schemas/PaymentMethodTypeSetting'
                motito:
                    $ref: '#/components/schemas/PaymentMethodTypeSetting'
        PaymentMethodTypeSetting:
            type: object
            description: Settings for a specific payment method type
            required:
                - confirms_use
                - enabled
            properties:
                type:
                    type: string
                    enum: [mobile_money, bank_account, card, motito]
                    description: Payment method type
                    example: "mobile_money"
                name:
                    type: string
                    description: Human-readable name
                    example: "Mobile Money"
                description:
                    type: string
                    description: Description of this payment method
                    example: "Pay with supported mobile money wallets"
                enabled:
                    type: boolean
                    description: Whether this payment type can be used
                    example: true
                confirms_use:
                    type: boolean
                    description: Whether customers must explicitly agree before using
                    example: true
        CountrySpecification:
            type: object
            description: Complete specification for a country including supported features and requirements
            required: [bt_aging_specs, country_code, country_name, currencies, financial_account_types, id_document_types, legal_entity_types, payment_methods, payout_schedules]
            properties:
                country_code:
                    type: string
                    description: ISO 3166-1 alpha-2 country code
                    example: "gh"
                country_name:
                    type: string
                    description: Full country name
                    example: "Ghana"
                currencies:
                    type: array
                    description: Supported currencies in this country
                    items:
                        type: string
                    example: ["ghs", "usd"]
                payment_methods:
                    type: array
                    description: Supported payment methods in this country
                    items:
                        type: string
                    example: ["mobile_money", "bank_account", "payment_card", "motito"]
                payout_schedules:
                    type: array
                    description: Available payout schedules for this country
                    items:
                        type: string
                    example: ["weekly", "manual"]
                bt_aging_specs:
                    type: array
                    description: Balance transaction aging specifications available
                    items:
                        type: string
                    example: ["twenty_four_hourly", "forty_eight_hourly", "hundred_sixty_eight_hourly"]
                legal_entity_types:
                    type: array
                    description: Legal entity types that can operate in this country
                    items:
                        type: string
                financial_account_types:
                    type: array
                    description: Financial account types available in this country
                    items:
                        type: string
                id_document_types:
                    type: array
                    description: Identification document types accepted in this country
                    items:
                        type: string
                banks:
                    $ref: '#/components/schemas/CountryBankDirectory'
        CountryBankDirectory:
            type: object
            description: Bank reference data available for country-specific bank accounts
            required: [bank_account_type, code_scheme, items]
            properties:
                bank_account_type:
                    type: string
                    description: Country-specific bank account subtype used by financial account APIs
                    example: "ghana_bank_account"
                code_scheme:
                    type: string
                    description: Identifier scheme used for bank branch codes
                    example: "sort_code"
                items:
                    type: array
                    description: Banking institutions available in this country
                    items:
                        $ref: '#/components/schemas/CountryBank'
        CountryBank:
            type: object
            description: A banking institution available in a country
            required: [branches, id, name]
            properties:
                id:
                    type: string
                    description: Stable bank identifier
                    example: "absa_gh_ltd"
                name:
                    type: string
                    description: Bank display name
                    example: "ABSA (GH) LTD"
                swift_code:
                    type: string
                    description: SWIFT/BIC code for the bank, when available
                    example: "BARCGHAC"
                sort_code_prefix:
                    type: string
                    description: Ghana sort code prefix for the bank
                    example: "03"
                branches:
                    type: array
                    description: Branches available for this bank
                    items:
                        $ref: '#/components/schemas/CountryBankBranch'
        CountryBankBranch:
            type: object
            description: A bank branch in a country bank directory
            required: [id, name, sort_code]
            properties:
                id:
                    type: string
                    description: Stable branch identifier
                    example: "absa_gh_ltd_kasoa_branch"
                name:
                    type: string
                    description: Branch display name
                    example: "ABSA (GH) LTD-KASOA BRANCH"
                sort_code:
                    type: string
                    description: Ghana bank branch sort code
                    example: "030101"
        LookupChimeRequest:
            type: object
            description: Request to look up a chime by ID
            required:
                - chime_id
            properties:
                chime_id:
                    type: string
                    description: Unique identifier of the chime to look up
                    example: "ch_1234567890abcdef1234567890abcdef12345678"
        PageChimesRequest:
            type: object
            description: Request to retrieve a page of chimes
            properties:
                customer_id:
                    type: string
                    description: Restrict the page to chimes associated with this customer
                    example: "cu_abc123def456"
                page_number:
                    type: integer
                    minimum: 1
                    maximum: 10
                    default: 1
                    description: 1-based page index to fetch
                    example: 1
                page_size:
                    type: integer
                    minimum: 1
                    maximum: 256
                    default: 256
                    description: Number of chimes to return
                    example: 25
                recipient:
                    type: string
                    description: Restrict the page to chimes whose recipient exactly matches this phone number or email address
                    example: "+233544998605"
        SendChimeRequest:
            type: object
            description: |
                Request to send a chime to a recipient.
                SMS recipients accept either `full_message` or `message_template`.
                Email recipients accept either `email` or `message_template`.
            required:
                - recipient
            properties:
                recipient:
                    $ref: '#/components/schemas/ChimeRecipient'
                full_message:
                    type: string
                    description: Complete SMS message content. Use only with SMS recipients.
                    example: "Your verification code is 123456. It expires in 10 minutes."
                email:
                    $ref: '#/components/schemas/ChimeEmailMessageInput'
                message_template:
                    $ref: '#/components/schemas/MessageTemplateReference'
                sender_id:
                    type: string
                    description: Sender identifier shown to recipient. Uses default sender if not provided.
                    example: "YourBrand"
                purpose:
                    type: string
                    description: Purpose of this chime for categorization and analytics
                    example: "verification"
                custom_data:
                    type: object
                    additionalProperties:
                        type: string
                    description: Your own key-value pairs for custom data and tracking
                    example:
                        user_id: "usr_123"
                        flow: "signup"
                request_meta:
                    type: object
                    description: Optional metadata controlling request processing
                    properties:
                        idempotency_key:
                            type: string
                            description: Unique key to prevent duplicate sends
                            example: "chime_send_20231214_abc123"
        ChimeRecipient:
            oneOf:
                - $ref: '#/components/schemas/ChimeInlineRecipient'
                - $ref: '#/components/schemas/ChimeSavedCustomerRecipient'
        ChimeInlineRecipient:
            oneOf:
                - type: object
                  additionalProperties: false
                  required: [phone, type]
                  properties:
                      name:
                          type: string
                      phone:
                          type: object
                          additionalProperties: false
                          required: [number]
                          properties:
                              number:
                                  type: string
                                  example: "+233544998605"
                      type:
                          type: string
                          enum: [phone]
                - type: object
                  additionalProperties: false
                  required: [email, type]
                  properties:
                      email:
                          type: object
                          additionalProperties: false
                          required: [address]
                          properties:
                              address:
                                  type: string
                                  format: email
                                  example: "user@example.com"
                      name:
                          type: string
                      type:
                          type: string
                          enum: [email]
        ChimeSavedCustomerRecipient:
            type: object
            additionalProperties: false
            required: [customer_id, transport]
            properties:
                customer_id:
                    type: string
                    example: cu_abc123def456
                transport:
                    type: string
                    enum: [sms, email]
        ChimeResponse:
            type: object
            description: Response containing chime details
            properties:
                chime:
                    $ref: '#/components/schemas/Chime'
        PageChimesResponse:
            type: object
            description: Response containing a page of chimes
            properties:
                page:
                    type: object
                    required:
                        - number
                        - size
                        - chimes
                    properties:
                        number:
                            type: integer
                            description: Page number returned
                            example: 1
                        size:
                            type: integer
                            description: Page size returned
                            example: 25
                        chimes:
                            type: array
                            description: Chimes in this page
                            items:
                                $ref: '#/components/schemas/Chime'
        Chime:
            type: object
            description: A notification sent to one recipient
            required: [created_at, full_message, id, recipient, sender_id]
            properties:
                created_at:
                    type: string
                    format: date-time
                custom_data:
                    type: object
                    additionalProperties:
                        type: string
                customer_id:
                    type: string
                email:
                    $ref: '#/components/schemas/ChimeEmailMessage'
                full_message:
                    type: string
                    description: Rendered SMS content. Empty for email Chimes.
                id:
                    type: string
                idempotency_key:
                    type: string
                purpose:
                    type: string
                recipient:
                    $ref: '#/components/schemas/ChimeRecipientResponse'
                sender_id:
                    type: string
                transmission:
                    $ref: '#/components/schemas/ChimeTransmission'
        ChimeTransmission:
            type: object
            required: [address, created_at, gateway, id, initialized_at, mechanism, status]
            properties:
                address:
                    type: string
                created_at:
                    type: string
                    format: date-time
                delivered_at:
                    type: string
                    format: date-time
                email_events:
                    type: array
                    items:
                        $ref: '#/components/schemas/ChimeEmailEvent'
                email_failure_code:
                    type: string
                email_failure_reason:
                    type: string
                email_status:
                    type: string
                error:
                    type: string
                failed_at:
                    type: string
                    format: date-time
                gateway:
                    type: string
                gateway_message_id:
                    type: string
                id:
                    type: string
                initialized_at:
                    type: string
                    format: date-time
                last_email_event_at:
                    type: string
                    format: date-time
                mechanism:
                    type: string
                    enum: [sms, email]
                sent_at:
                    type: string
                    format: date-time
                sent_via:
                    type: string
                    enum: [sms, email]
                status:
                    type: string
                suppressed_at:
                    type: string
                    format: date-time
                suppression_reason:
                    type: string
        ChimeEmailEvent:
            type: object
            required: [id, occurred_at, provider, provider_message_id, type]
            properties:
                bounce_sub_type:
                    type: string
                bounce_type:
                    type: string
                complaint_sub_type:
                    type: string
                id:
                    type: string
                occurred_at:
                    type: string
                    format: date-time
                provider:
                    type: string
                provider_message_id:
                    type: string
                reason:
                    type: string
                reason_code:
                    type: string
                recipient:
                    type: string
                source:
                    type: string
                suppress_recipient:
                    type: boolean
                temporary:
                    type: boolean
                type:
                    type: string
        ChimeEmailMessageInput:
            type: object
            description: Email content accepted for email chimes, broadcasts, and schedules.
            required:
                - subject
                - text
                - from
            properties:
                subject:
                    type: string
                    description: Email subject.
                    example: "Your receipt"
                text:
                    type: string
                    description: Plain-text email body.
                    example: "Your receipt is ready."
                html:
                    type: string
                    description: Optional HTML email body. Unsafe HTML is rejected or sanitized before delivery.
                from:
                    $ref: '#/components/schemas/ChimeEmailMailbox'
                reply_to:
                    type: string
                    format: email
                    description: Optional reply-to email address.
                    example: "support@example.com"
                headers:
                    type: object
                    additionalProperties:
                        type: string
                    description: Optional provider-neutral email headers.
        ChimeEmailMessage:
            type: object
            description: Email content, safety scan result, and system-generated schema markup for email chimes.
            properties:
                subject:
                    type: string
                    description: Email subject
                    example: "Your receipt"
                text:
                    type: string
                    description: Plain-text email body
                    example: "Your receipt is ready."
                html:
                    type: string
                    description: Optional HTML email body before provider-specific rendering
                    nullable: true
                from:
                    $ref: '#/components/schemas/ChimeEmailMailbox'
                reply_to:
                    $ref: '#/components/schemas/ChimeEmailMailbox'
                headers:
                    type: object
                    additionalProperties:
                        type: string
                    description: Provider-neutral email headers after validation
                safety:
                    $ref: '#/components/schemas/ChimeEmailSafetyResult'
                schema:
                    $ref: '#/components/schemas/ChimeEmailSchemaMarkup'
        ChimeEmailMailbox:
            type: object
            properties:
                name:
                    type: string
                    description: Optional display name
                    example: "Zebo"
                address:
                    type: string
                    format: email
                    description: Email address
                    example: "notifications@inttegro.com"
        ChimeEmailSafetyResult:
            type: object
            description: Result of the email safety scan
            properties:
                status:
                    type: string
                    enum: [allowed, rejected, quarantined]
                    description: Safety decision for the email content
                reason_codes:
                    type: array
                    items:
                        type: string
                    description: Machine-readable reasons for non-allowed results
                sanitized_html:
                    type: string
                    description: Sanitized HTML body used for provider send when present
                    nullable: true
                normalized_text:
                    type: string
                    description: Normalized plain-text body used by the scanner
                links:
                    type: array
                    items:
                        $ref: '#/components/schemas/ChimeEmailScannedLink'
                scanner:
                    type: string
                    description: Safety scanner identifier
                    example: "content-safety"
                content_hash:
                    type: string
                    description: Hash of the scanned email content
                quarantine_notes:
                    type: string
                    nullable: true
        ChimeEmailScannedLink:
            type: object
            properties:
                raw:
                    type: string
                scheme:
                    type: string
                host:
                    type: string
                status:
                    type: string
                    enum: [allowed, rejected, quarantined]
                reason:
                    type: string
        ChimeEmailSchemaMarkup:
            type: object
            description: Schema.org JSON-LD markup generated at email send time.
            properties:
                kind:
                    type: string
                    enum: [gmail_view_action, schema_org_order, schema_org_invoice]
                    description: Classification for the generated markup
                json_ld:
                    type: object
                    additionalProperties: true
                    description: Schema.org JSON-LD object inserted into the HTML email
        ChimeRecipientResponse:
            type: object
            description: Recipient information in response
            required: [type]
            properties:
                type:
                    type: string
                    enum: [phone, email]
                    description: Contact type
                    example: "phone"
                name:
                    type: string
                    description: Recipient name
                    example: "John Doe"
                phone:
                    type: object
                    properties:
                        number:
                            type: string
                            example: "+233544998605"
                    required: [number]
                email:
                    type: object
                    properties:
                        address:
                            type: string
                            example: "user@example.com"
                    required: [address]
        ScheduleChimeRequest:
            type: object
            required:
                - recipients
                - send_after
            properties:
                request_meta:
                    type: object
                    properties:
                        idempotency_key:
                            type: string
                            description: Stable retry key. It must match the Idempotency-Key header when both are provided.
                recipients:
                    type: array
                    description: Recipient objects for this scheduled chime. Each item must include `transport` and either inline contact details or `customer_id`.
                    items:
                        $ref: '#/components/schemas/ChimeRecipient'
                    minItems: 1
                    example:
                        - customer_id: "cu_abc123def456"
                          transport: "sms"
                        - type: "phone"
                          phone:
                              number: "+233544998605"
                send_after:
                    type: string
                    format: date-time
                    description: ISO 8601 timestamp for when to send the chime (must be in the future)
                    example: "2025-12-15T10:00:00Z"
                full_message:
                    type: string
                    description: Complete SMS message content. Use only with SMS recipients.
                    example: "Reminder: Your appointment is tomorrow at 10 AM."
                email:
                    $ref: '#/components/schemas/ChimeEmailMessageInput'
                message_template:
                    $ref: '#/components/schemas/MessageTemplateReference'
                sender_id:
                    type: string
                    description: Sender identifier displayed to recipients
                    example: "YourBrand"
                purpose:
                    type: string
                    description: Optional purpose or category for this scheduled chime
                    example: "appointment_reminder"
        ScheduleResponse:
            type: object
            properties:
                scheduled_chime:
                    $ref: '#/components/schemas/ScheduleCreationDetail'
        ScheduleCreationDetail:
            type: object
            required: [created_at, full_message, id, send_after, sender_id]
            properties:
                created_at:
                    type: string
                    format: date-time
                customer_ids:
                    type: array
                    items:
                        type: string
                email:
                    $ref: '#/components/schemas/ChimeEmailMessage'
                executed_at:
                    type: string
                    format: date-time
                full_message:
                    type: string
                id:
                    type: string
                idempotency_key:
                    type: string
                purpose:
                    type: string
                recipients:
                    type: array
                    items:
                        type: string
                send_after:
                    type: string
                    format: date-time
                sender_id:
                    type: string
        LookupScheduleRequest:
            type: object
            required: [schedule_id]
            properties:
                schedule_id:
                    type: string
        CancelScheduleRequest:
            type: object
            required: [schedule_id]
            properties:
                schedule_id:
                    type: string
        ScheduleLookupResponse:
            type: object
            properties:
                scheduled_chime:
                    $ref: '#/components/schemas/ScheduleDetail'
        ScheduleCancelResponse:
            type: object
            properties:
                scheduled_chime:
                    $ref: '#/components/schemas/ScheduleCancelDetail'
        ScheduleDetail:
            type: object
            required: [content, created_at, id, recipients, send_after, sender_id]
            properties:
                chime_ids:
                    type: array
                    items:
                        type: string
                content:
                    type: string
                created_at:
                    type: string
                    format: date-time
                customer_ids:
                    type: array
                    items:
                        type: string
                email:
                    $ref: '#/components/schemas/ChimeEmailMessage'
                errors:
                    type: array
                    items:
                        $ref: '#/components/schemas/ScheduleError'
                executed_at:
                    type: string
                    format: date-time
                id:
                    type: string
                idempotency_key:
                    type: string
                purpose:
                    type: string
                recipients:
                    type: array
                    items:
                        type: string
                send_after:
                    type: string
                    format: date-time
                sender_id:
                    type: string
        ScheduleCancelDetail:
            allOf:
                - $ref: '#/components/schemas/ScheduleDetail'
                - type: object
                  properties:
                      canceled_at:
                          type: string
                          format: date-time
        ScheduleError:
            type: object
            description: Error encountered when scheduling a chime for a specific recipient
            properties:
                recipient:
                    type: string
                    description: Recipient address that caused the error
                    example: "+233invalid"
                fix_code:
                    type: string
                    description: Code indicating how to fix this error
                    example: "check_recipient"
                type:
                    type: string
                    description: Error type classification
                    example: "invalid_recipient"
        BroadcastRequest:
            type: object
            required:
                - recipients
            properties:
                request_meta:
                    type: object
                    properties:
                        idempotency_key:
                            type: string
                            description: Stable retry key. It must match the Idempotency-Key header when both are provided.
                message_template:
                    oneOf:
                        - type: string
                          description: Raw SMS message content for SMS broadcasts.
                          example: "Your order #12345 has shipped."
                        - $ref: '#/components/schemas/MessageTemplateReference'
                    description: Raw SMS content for SMS broadcasts, or a stored message template reference for SMS or email broadcasts.
                email:
                    $ref: '#/components/schemas/ChimeEmailMessageInput'
                purpose:
                    type: string
                    description: Category or intent for this broadcast.
                    example: "order_notification"
                recipients:
                    type: array
                    description: Recipient objects for this broadcast. Each item must include `transport` and either inline contact details or `customer_id`.
                    items:
                        $ref: '#/components/schemas/ChimeRecipient'
                    minItems: 1
                    example:
                        - customer_id: "cu_abc123def456"
                          transport: "email"
                        - type: "email"
                          email:
                              address: "user@example.com"
                sender:
                    type: string
                    description: Sender identifier displayed to recipients.
                    example: "YourBrand"
        BroadcastResponse:
            type: object
            properties:
                broadcast:
                    $ref: '#/components/schemas/BroadcastCreationDetail'
        BroadcastCreationDetail:
            type: object
            required: [content, created_at, id, recipients, send_after, sender_id]
            properties:
                content:
                    type: string
                created_at:
                    type: string
                    format: date-time
                customer_ids:
                    type: array
                    items:
                        type: string
                email:
