    /purchase_intents/create:
        post:
            summary: Create a purchase intent
            description: |
                Creates a controlled, shareable Buy link for a catalog product without
                requiring you to build a product page, cart, or checkout UI. The returned
                `sale_...` ID becomes `https://pages.inttegro.com/buy/{purchase_intent_id}`.
                An order is created only when a customer checks out from that link.

                This operation supports idempotency. Reuse the same `Idempotency-Key` and
                request body when retrying an uncertain request.
            operationId: createPurchaseIntent
            tags:
                - Purchase Intents
            parameters:
                - name: Idempotency-Key
                  in: header
                  required: false
                  schema:
                      type: string
                  description: Stable key used to replay safe retries without creating a duplicate Buy link.
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/CreatePurchaseIntentRequest'
            responses:
                '200':
                    description: Purchase intent created successfully
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/PurchaseIntentResponse'
                '400':
                    description: Invalid request, quantity range, price availability, or product-price relationship
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                '401':
                    description: Unauthorized - invalid or missing API key
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                '404':
                    description: Product or price not found
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                '500':
                    description: Purchase intent creation failed unexpectedly
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
    /purchase_intents/update:
        post:
            summary: Update a purchase intent
            description: |
                Changes quantity bounds or expiry without changing what an already-shared
                Buy link sells. `reactivate: true` clears cancellation state and any existing
                elapsed expiry. Product, price, usage mode, and variant selection remain
                immutable after creation.

                This operation supports idempotency. Reuse the same `Idempotency-Key` and
                request body when retrying an uncertain request.
            operationId: updatePurchaseIntent
            tags:
                - Purchase Intents
            parameters:
                - name: Idempotency-Key
                  in: header
                  required: false
                  schema:
                      type: string
                  description: Stable key used to replay safe retries without applying the update twice.
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/UpdatePurchaseIntentRequest'
            responses:
                '200':
                    description: Purchase intent updated successfully
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/PurchaseIntentResponse'
                '400':
                    description: Bad request - invalid parameters
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                '401':
                    description: Unauthorized - invalid or missing API key
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                '404':
                    description: Purchase intent not found
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                '500':
                    description: Purchase intent update failed unexpectedly
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
    /purchase_intents/cancel:
        post:
            summary: Cancel a purchase intent
            description: |
                Stops a Buy link from creating new orders immediately. Cancellation is an
                explicit merchant action and is distinct from time-driven expiry. Repeating
                cancellation for an already inactive intent returns its current state, but a
                single-use intent that already created an order cannot be canceled.

                This operation supports idempotency. Reuse the same `Idempotency-Key` and
                request body when retrying an uncertain request.
            operationId: cancelPurchaseIntent
            tags:
                - Purchase Intents
            parameters:
                - name: Idempotency-Key
                  in: header
                  required: false
                  schema:
                      type: string
                  description: Stable key used to replay safe retries without applying cancellation twice.
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/CancelPurchaseIntentRequest'
            responses:
                '200':
                    description: Purchase intent canceled successfully
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/PurchaseIntentResponse'
                '400':
                    description: Bad request - invalid parameters
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                '401':
                    description: Unauthorized - invalid or missing API key
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                '404':
                    description: Purchase intent not found
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                '500':
                    description: Purchase intent cancellation failed unexpectedly
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
    /purchase_intents/lookup:
        post:
            summary: Lookup a purchase intent
            description: |
                Resolves the offer behind a hosted Buy link using only its opaque ID. Public
                lookup requires no API key and returns active or expired intents; canceled
                and used single-use intents are returned as not found. When the owning
                application authenticates the request, lookup is application-scoped, returns
                all lifecycle states, and may include recent activity.
            operationId: lookupPurchaseIntent
            tags:
                - Purchase Intents
            security:
                - {}
                - bearerAuth: []
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/LookupPurchaseIntentRequest'
            responses:
                '200':
                    description: Purchase intent found successfully
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/PurchaseIntentResponse'
                '400':
                    description: Bad request - invalid parameters
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                '404':
                    description: Purchase intent not found
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                '500':
                    description: Purchase intent lookup failed unexpectedly
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
    /purchase_intents/page:
        post:
            summary: List purchase intents
            description: |
                Lists purchase intents for the authenticated application, newest first.
                Pagination is numbered. The response `page.size` is the number of records
                actually returned, not the requested limit, and no total count or next-page
                token is included.
            operationId: pagePurchaseIntents
            tags:
                - Purchase Intents
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/PagePurchaseIntentsRequest'
            responses:
                '200':
                    description: Purchase intents listed successfully
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/PagePurchaseIntentsResponse'
                '400':
                    description: Bad request - invalid pagination parameters
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                '401':
                    description: Unauthorized - invalid or missing API key
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                '404':
                    description: A purchase intent could not be hydrated
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                '500':
                    description: Purchase intent page lookup failed unexpectedly
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
    /prices/create:
        post:
            summary: Create a price
            description: |
                Creates a new price in your catalog. Prices define the cost of products and can optionally
                be associated with a product. Multiple prices can exist for the same product to support
                different currencies, markets, or customer segments.

                Key points:
                - Price amounts are immutable after creation (create new price to change amount)
                - Product association (product_id) is optional at creation but immutable once set
                - Label and about fields can be updated later
                - Amount must be a positive integer representing the smallest currency unit (cents, pence, etc.)
            operationId: createPrice
            tags:
                - Prices
            parameters:
                - $ref: '#/components/parameters/IdempotencyKey'
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            required:
                                - amount
                            properties:
                                product_id:
                                    type: string
                                    description: Optional product ID to associate this price with. Once set, cannot be changed.
                                    example: "prod_abc123"
                                label:
                                    type: string
                                    description: Short label for this price (max 100 characters)
                                    example: "Standard pricing"
                                about:
                                    type: string
                                    description: Longer description of this price (max 500 characters)
                                    example: "Standard pricing for individual customers"
                                amount:
                                    $ref: '#/components/schemas/Money'
            responses:
                '200':
                    description: Price created successfully
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/PriceResponse'
                '400':
                    description: Bad request - invalid parameters
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                '401':
                    description: Unauthorized - invalid or missing API key
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                '422':
                    description: Unprocessable entity - validation failed
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
    /prices/lookup:
        post:
            summary: Lookup a price
            description: |
                Retrieves a price's details by ID. Returns the complete price record including
                amount, currency, associated product, label, description, and timestamps.
            operationId: lookupPrice
            tags:
                - Prices
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            required:
                                - price_id
                            properties:
                                price_id:
                                    type: string
                                    description: The unique identifier of the price to lookup
                                    example: "pr_xyz789"
            responses:
                '200':
                    description: Price found
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/PriceResponse'
                '400':
                    description: Bad request - invalid parameters
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                '401':
                    description: Unauthorized - invalid or missing API key
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                '422':
                    description: Price lookup failed
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
    /prices/page:
        post:
            summary: Page through prices
            description: |
                Retrieve a paginated list of prices for the authenticated application.
                Results are sorted by created_at in descending order, so page 1 contains
                the most recently created prices and subsequent pages step back in time.

                If `product_id` is supplied, the page is scoped to prices that belong
                to that product. The product must belong to your authenticated application.
            operationId: pagePrices
            tags:
                - Prices
            requestBody:
                required: false
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/PricePageRequest'
            responses:
                '200':
                    description: Page retrieved successfully
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/PricePageResponse'
                '400':
                    description: Invalid price page request
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                '401':
                    description: Unauthorized - invalid or missing API key
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                '422':
                    description: Unprocessable entity - validation failed
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
    /prices/update:
        post:
            summary: Update a price
            description: |
                Updates an existing price's metadata. Only label and about fields can be modified.
                Amount and product association are not accepted by this operation; create a new
                price when either must differ.
            operationId: updatePrice
            tags:
                - Prices
            parameters:
                - $ref: '#/components/parameters/IdempotencyKey'
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            required:
                                - price_id
                            properties:
                                price_id:
                                    type: string
                                    description: The unique identifier of the price to update
                                    example: "pr_xyz789"
                                label:
                                    type: string
                                    description: Short label for this price (max 100 characters)
                                    example: "Premium pricing"
                                about:
                                    type: string
                                    description: Longer description of this price (max 500 characters)
                                    example: "Premium pricing tier for enterprise customers"
            responses:
                '200':
                    description: Price updated successfully
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/PriceResponse'
                '400':
                    description: Bad request - invalid parameters
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                '401':
                    description: Unauthorized - invalid or missing API key
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                '422':
                    description: Cannot modify immutable field (product_id or amount)
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
    /prices/activate:
        post:
            summary: Activate a price
            description: |
                Reactivates an inactive price so it can be used again in new flows.

                Key points:
                - The price must belong to the authenticated application
                - Archived prices cannot be activated
                - Already-active prices return an error
            operationId: activatePrice
            tags:
                - Prices
            parameters:
                - $ref: '#/components/parameters/IdempotencyKey'
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/PriceActionRequest'
            responses:
                '200':
                    description: Price activated successfully
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/PriceResponse'
                '400':
                    description: Bad request - invalid parameters
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                '401':
                    description: Unauthorized - invalid or missing API key
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                '422':
                    description: Unprocessable entity - price archived or already active
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
    /prices/deactivate:
        post:
            summary: Deactivate a price
            description: |
                Marks a price as inactive so it can no longer be used for new default-price assignments or other active catalog flows.

                Key points:
                - The price must belong to the authenticated application
                - Archived prices cannot be deactivated
                - Already-inactive prices return an error
            operationId: deactivatePrice
            tags:
                - Prices
            parameters:
                - $ref: '#/components/parameters/IdempotencyKey'
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/PriceActionRequest'
            responses:
                '200':
                    description: Price deactivated successfully
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/PriceResponse'
                '400':
                    description: Bad request - invalid parameters
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                '401':
                    description: Unauthorized - invalid or missing API key
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                '422':
                    description: Unprocessable entity - price archived or already inactive
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
    /prices/archive:
        post:
            summary: Archive a price
            description: |
                Archive a price and mark it inactive. An archived price cannot be activated or
                deactivated, and attempting to archive it again returns a lifecycle error.
            operationId: archivePrice
            tags:
                - Prices
            parameters:
                - name: Idempotency-Key
                  in: header
                  required: false
                  schema:
                      type: string
                  description: Stable key used to replay safe retries without archiving the price twice.
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/PriceActionRequest'
            responses:
                '200':
                    description: Price archived successfully
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/PriceResponse'
                '400':
                    description: Invalid price archive request
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                '401':
                    description: Unauthorized - invalid or missing API key
                '422':
                    description: Price archive failed
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
    /spec/countries:
        post:
            summary: Get country specifications
            description: |
                Retrieve country specifications including supported currencies, payment methods,
                payout schedules, legal entity types, financial account types, ID document
                types, and country-specific bank reference data for all configured countries.

                Use this to:
                - Build country-specific onboarding flows
                - Validate payment methods by country
                - Display appropriate ID document types
                - Show available payout schedules per country
                - Populate country-specific bank and branch selectors

                This is a public endpoint that does not require authentication.
            operationId: listCountrySpecs
            tags:
                - Specifications
            security: []
            requestBody:
                required: false
                content:
                    application/json:
                        schema:
                            type: object
                            description: No request body required
                            additionalProperties: false
            responses:
                '200':
                    description: Country specifications retrieved successfully
                    content:
                        application/json:
                            schema:
                                type: object
                                required: [countries]
                                properties:
                                    countries:
                                        type: object
                                        description: Map of country codes to country specifications
                                        additionalProperties:
                                            $ref: '#/components/schemas/CountrySpecification'
                                example:
                                    countries:
                                        gh:
                                            country_code: "gh"
                                            country_name: "Ghana"
                                            currencies: ["ghs", "usd"]
                                            payment_methods: ["mobile_money", "bank_account", "payment_card", "motito"]
                                            payout_schedules: ["weekly", "manual"]
                                            bt_aging_specs: ["twenty_four_hourly", "forty_eight_hourly", "hundred_sixty_eight_hourly"]
                                            legal_entity_types:
                                                - "individual"
                                                - "business"
                                            financial_account_types: ["wallet", "bank_account"]
                                            id_document_types: ["ghana_card", "passport"]
                                            banks:
                                                bank_account_type: "ghana_bank_account"
                                                code_scheme: "sort_code"
                                                items:
                                                    - id: "absa_gh_ltd"
                                                      name: "ABSA (GH) LTD"
                                                      swift_code: "BARCGHAC"
                                                      sort_code_prefix: "03"
                                                      branches:
                                                          - id: "absa_gh_ltd_kasoa_branch"
                                                            name: "ABSA (GH) LTD-KASOA BRANCH"
                                                            sort_code: "030101"
                '400':
                    description: Invalid request body
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorEnvelope'
components:
    securitySchemes:
        bearerAuth:
            type: http
            scheme: bearer
            description: Commerce API key supplied in the Authorization header.
    parameters:
        IdempotencyKey:
            name: Idempotency-Key
            in: header
            required: false
            schema:
                type: string
            description: Stable key used to replay safe retries without applying the mutation twice.
    schemas:
        GenerateSecretKeyRequest:
            type: object
            description: Optional public input for secret key generation.
            additionalProperties: false
            properties:
                label:
                    type: string
                    description: Optional human-readable label. Surrounding whitespace is trimmed; an empty value creates an unlabeled key.
                    example: Production checkout
        GenerateSecretKeyResponse:
            type: object
            additionalProperties: false
            required:
                - key
            properties:
                key:
                    $ref: '#/components/schemas/GeneratedSecretKey'
        GeneratedSecretKey:
            type: object
            description: Newly generated secret key. The token is returned once and cannot be retrieved later.
            additionalProperties: false
            required:
                - id
                - token_type
                - issued_at
                - token
            properties:
                id:
                    type: string
                    description: Secret key identifier.
                    example: sk_2xC7k9gK5yQnZ4w8P1sT6vR3
                label:
                    type: string
                    description: Optional human-readable label for the secret key.
                    example: Production checkout
                token_type:
                    type: string
                    enum: [bearer]
                    example: bearer
                issued_at:
                    type: string
                    format: date-time
                token:
                    type: string
                    description: One-time bearer token for the generated key.
        PageSecretKeysRequest:
            type: object
            additionalProperties: false
            properties:
                page:
                    type: integer
                    minimum: 0
                    description: Page number alias. Omitted or 0 is normalized to 1.
                    example: 1
                number:
                    type: integer
                    minimum: 0
                    description: Page number. Omitted or 0 is normalized to 1.
                    example: 1
                size:
                    type: integer
                    minimum: 0
                    description: Requested page size. Omitted or 0 becomes 50; values above 100 are capped at 100.
                    example: 20
        PageSecretKeysResponse:
            type: object
            additionalProperties: false
            required:
                - page
            properties:
                page:
                    $ref: '#/components/schemas/SecretKeyPage'
        LookupSecretKeyRequest:
            type: object
            additionalProperties: false
            required: [secret_key_id]
            properties:
                secret_key_id:
                    type: string
                    description: Secret key identifier. Typed `sk_...` IDs are accepted.
                    example: sk_2xC7k9gK5yQnZ4w8P1sT6vR3
        LookupSecretKeyResponse:
            type: object
            additionalProperties: false
            required:
                - key
            properties:
                key:
                    $ref: '#/components/schemas/SecretKey'
        UpdateSecretKeyRequest:
            type: object
            required: [label, secret_key_id]
            additionalProperties: false
            properties:
                label:
                    type: string
                    description: Human-readable label for the secret key. Send an empty string to clear the label.
                    example: Production checkout
                secret_key_id:
                    type: string
                    description: Secret key identifier to update.
                    example: sk_2xC7k9gK5yQnZ4w8P1sT6vR3
        UpdateSecretKeyResponse:
            type: object
            additionalProperties: false
            required:
                - key
            properties:
                key:
                    $ref: '#/components/schemas/SecretKey'
        DestroySecretKeyRequest:
            type: object
            additionalProperties: false
            required: [secret_key_id]
            properties:
                secret_key_id:
                    type: string
                    description: Secret key identifier to revoke.
                    example: sk_2xC7k9gK5yQnZ4w8P1sT6vR3
        DestroySecretKeyResponse:
            type: object
            additionalProperties: false
            required:
                - key
            properties:
                key:
                    $ref: '#/components/schemas/SecretKey'
        SecretKeyUsageRequest:
            type: object
            additionalProperties: false
            required: [secret_key_id]
            properties:
                number:
                    type: integer
                    minimum: 0
                    description: Page number. Omitted or 0 is normalized to 1.
                page:
                    type: integer
                    minimum: 0
                    description: Page number alias. Omitted or 0 is normalized to 1.
                secret_key_id:
                    type: string
                    description: Secret key identifier whose recent activity should be returned.
                    example: sk_2xC7k9gK5yQnZ4w8P1sT6vR3
                size:
                    type: integer
                    minimum: 0
                    description: Requested page size. Omitted or 0 becomes 50; values above 100 are capped at 100.
        SecretKeyUsageResponse:
            type: object
            additionalProperties: false
            required:
                - key
                - usage
            properties:
                key:
                    $ref: '#/components/schemas/SecretKey'
                usage:
                    $ref: '#/components/schemas/SecretKeyUsagePage'
        SecretKey:
            type: object
            description: Public secret key metadata. The bearer token is never returned by read or mutation endpoints.
            additionalProperties: false
            required:
                - id
                - token_type
                - issued_at
                - status
                - active
            properties:
                id:
                    type: string
                    description: Application-scoped secret key identifier.
                    example: sk_2xC7k9gK5yQnZ4w8P1sT6vR3
                label:
                    type: string
                    description: Optional human-readable label for the secret key.
                    example: Production checkout
                token_type:
                    type: string
                    enum: [bearer]
                    example: bearer
                issued_at:
                    type: string
                    format: date-time
                updated_at:
                    type: string
                    format: date-time
                    description: Omitted until the label is changed.
                expires_at:
                    type: string
                    format: date-time
                    description: Omitted for keys without a fixed expiry.
                status:
                    type: string
                    enum: [active, revoked, expired]
                active:
                    type: boolean
                revoked_at:
                    type: string
                    format: date-time
                    description: Omitted until the key is revoked.
                last_used_at:
                    type: string
                    format: date-time
                    description: Most recent recorded authentication when available; otherwise omitted.
                usage_count:
                    type: integer
                    minimum: 0
                    description: Number of recorded authentications when available; omitted when zero.
        SecretKeyPage:
            type: object
            additionalProperties: false
            required:
                - number
                - size
                - count
                - total
                - has_more
                - keys
            properties:
                number:
                    type: integer
                    minimum: 1
                size:
                    type: integer
                    minimum: 0
                count:
                    type: integer
                    minimum: 0
                total:
                    type: integer
                    minimum: 0
                has_more:
                    type: boolean
                keys:
                    type: array
                    items:
                        $ref: '#/components/schemas/SecretKey'
        SecretKeyUsagePage:
            type: object
            additionalProperties: false
            required:
                - number
                - size
                - count
                - total
                - has_more
                - rows
            properties:
                number:
                    type: integer
                    minimum: 1
                size:
                    type: integer
                    minimum: 0
                count:
                    type: integer
                    minimum: 0
                total:
                    type: integer
                    minimum: 0
                has_more:
                    type: boolean
                rows:
                    type: array
                    items:
                        $ref: '#/components/schemas/SecretKeyUsageRow'
        SecretKeyUsageRow:
            type: object
            description: Public authentication outcome associated with the selected key.
            additionalProperties: false
            required:
                - secret_key_id
                - occurred_at
                - auth_result
            properties:
                secret_key_id:
                    type: string
                    example: sk_2xC7k9gK5yQnZ4w8P1sT6vR3
                occurred_at:
                    type: string
                    format: date-time
                auth_result:
                    type: string
                    enum: [succeeded, failed]
        FileServiceHealthResponse:
            type: object
