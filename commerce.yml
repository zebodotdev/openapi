                    type: boolean
                    description: Whether payment requires token confirmation
                confirmation_sent:
                    type: boolean
                    description: Whether confirmation token was sent to customer
        Error:
            type: object
            description: |
                Standard error response structure returned by all API endpoints.
                Provides machine-readable codes, human-readable messages, and actionable guidance for resolution.
            required:
                - type
                - code
                - url
            properties:
                message:
                    type: string
                    description: Concise, human-readable description of the error. Quick summary of what went wrong.
                    example: "Invalid payment method"
                fix_code:
                    type: string
                    description: Machine-readable suggestion for how to resolve the error (e.g., "retry_with_exponential_backoff", "change_request_parameters").
                    example: "change_request_parameters"
                detail:
                    type: string
                    description: Comprehensive explanation of what went wrong, including context and actionable guidance for resolution.
                    example: "The payment method provided is not valid for this currency. GHS orders require a mobile money or card payment method."
                cause:
                    type: string
                    description: Underlying category of failure—which system or validation rule triggered the error (e.g., "validation_failure", "payment_declined").
                    example: "validation_failure"
                type:
                    type: string
                    description: Broad error category to help clients determine retry strategies (e.g., "invalid_request_parameter", "transient_error").
                    example: "invalid_request_parameter"
                code:
                    type: string
                    description: Unique machine-readable identifier for this specific error condition. Unlike type and cause which group errors, code pinpoints the exact problem.
                    example: "invalid_payment_method"
                url:
                    type: string
                    format: uri
                    description: Link to error reference documentation with detailed explanation, common causes, and resolution guidance.
                    example: "https://studio.inttegro.com/e/invalid_payment_method"
        ErrorEnvelope:
            type: object
            required: [error]
            properties:
                error:
                    $ref: '#/components/schemas/Error'
        RefundReason:
            type: string
            enum:
                - requested_by_customer
                - duplicate
                - fraudulent
                - order_canceled
                - item_returned
                - item_damaged
                - item_not_received
                - item_not_as_described
                - custom
        RefundMoney:
