            responses:
                '200':
                    description: Secret key revoked successfully.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/DestroySecretKeyResponse'
                '401':
                    description: Unauthorized - invalid or missing API key
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                '404':
                    description: Secret key not found for the authenticated application
                    content:
                        application/json:
                            schema:
