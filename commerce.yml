                                alias:
                                    type: string
                                    description: Short name for the application. Use an empty string to clear it.
                                description:
                                    type: string
                                    description: Application description. Use an empty string to clear it.
                                legal_entity_type:
                                    type: string
                                    enum:
                                        - government
                                        - non_profit
                                        - business
                                        - individual
            responses:
                '200':
                    description: Application updated successfully.
                    content:
                        application/json:
                            schema:
                                type: object
                                required:
                                    - app
                                properties:
                                    app:
                                        type: object
                                        required:
                                            - id
                                            - name
                                            - created_at
                                        properties:
                                            id:
                                                type: string
                                            name:
                                                type: string
                                            alias:
                                                type: string
                                            description:
                                                type: string
                                            created_at:
                                                type: string
                                                format: date-time
                                            updated_at:
                                                type: string
                                                format: date-time
                '401':
                    description: Unauthorized - invalid or missing API key
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                '422':
                    description: Unprocessable entity - invalid parameters
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
    /keys/generate:
        post:
            summary: Generate a secret key
            description: Generates a new active secret key for the authenticated application. The token is returned once and is not available from lookup or page responses.
            operationId: generateSecretKey
            tags:
                - API Keys
            requestBody:
                required: false
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/GenerateSecretKeyRequest'
            responses:
                '200':
                    description: Secret key generated successfully.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/GenerateSecretKeyResponse'
                '401':
                    description: Unauthorized - invalid or missing API key
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                '422':
                    description: Unprocessable entity - key generation failed
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
    /keys/page:
