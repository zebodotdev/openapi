                                            example: "bt_1KqYh2EeZvKYlo2C3h4Y8l5X"
                                        payout_id:
                                            type: string
                                            description: Associated payout ID
                                            example: "po_1KqYh1EeZvKYlo2C4X9J3v2D"
                                            nullable: true
                                        payment_id:
                                            type: string
                                            description: Associated payment ID
                                            example: "py_3deNYydEjIGCqK1tGlAPwJYSCsZnQ4XGF"
                                        created_at:
                                            type: string
                                            format: date-time
                                            description: When the balance transaction was created
