                        scheme:
                            type: string
                            description: Authentication scheme used
                            example: "zcommerce_defined_auth"
                        request:
                            type: object
                            description: Confirmation request details
                            properties:
                                id:
                                    type: string
                                    description: Unique identifier for the confirmation request
                                    example: "Jmjup0uRSVI2LvllHfdJ"
                                recipient:
                                    type: string
                                    description: Recipient of the confirmation token
                                    example: "0242057831"
                                sent_via:
                                    type: string
                                    enum: [sms, email, push]
                                    description: Channel used to send the token
                                    example: "sms"
                                token_size:
                                    type: integer
                                    description: Number of digits in the token
                                    example: 6
                                sender_id:
                                    type: string
                                    description: Sender ID for the message
                                    example: "zverify"
                        attempt:
                            type: object
                            description: Latest confirmation attempt
                            properties:
                                status:
                                    type: string
                                    description: Attempt status
                                    example: "pending"
                                confirmed:
                                    type: boolean
                                    description: Whether the confirmation has succeeded
                                    example: false
                                reason:
                                    type: string
                                    description: Reason for the current attempt state
                                    example: "awaiting_customer_confirmation"
                                token:
                                    type: string
                                    description: Confirmation token submitted by the customer
                                    example: "123456"
                                executed_at:
                                    type: string
                                    format: date-time
                                    description: When the attempt was executed
                                created_at:
                                    type: string
                                    format: date-time
                                    description: When the attempt was created
                        confirmed:
                            type: boolean
                            description: Whether the payment confirmation has completed
                            example: false
                        status:
                            type: string
                            description: Confirmation status
                            example: "pending"
                execute:
                    type: object
                    description: Details for execution action
                redirect:
                    type: object
                    description: Details for redirect action
                    properties:
                        redirect_url:
                            type: string
                            format: uri
                            description: URL to redirect the customer to
                            example: "https://pages.inttegro.com/authorize?order_id=3deNYydEjIGCqK1tGlAPwJYSCsZnQ4XGF"
                        valid_until:
                            type: string
                            format: date-time
                            description: When the redirect URL expires
                        latest_visit:
                            type: object
                            description: Latest redirect visit details
                            properties:
                                user_agent:
                                    type: string
                                ip_address:
                                    type: string
                                at:
                                    type: string
                                    format: date-time
                authorize:
                    type: object
                    description: Details for authorization action
                    properties:
                        beneficiary:
                            type: string
                            description: Beneficiary requiring authorization
                        scheme:
                            type: string
                            description: Authorization scheme
                        expires_at:
                            type: string
                            format: date-time
                            description: When the authorization request expires
        CreateOrderNewCustomer:
            type: object
            required:
                - customer_data
                - line_items
            properties:
                customer_data:
                    $ref: '#/components/schemas/CustomerData'
                number:
                    type: string
                    description: Optional order number for reference. When omitted, Commerce uses the generated order ID.
                    example: "ORDER-NUMBER-2"
                receipt_number:
                    type: string
                    description: Optional receipt number for downstream reconciliation. Uses the same length rules as `number`.
                    example: "RCPT-NUMBER-2"
                statement_descriptor:
                    type: string
                    description: Optional statement descriptor shown on the customer's bank statement
                    example: "STMTDESC"
                    maxLength: 22
                statement_descriptor_prefix:
                    type: string
                    description: Optional static prefix used to build the statement descriptor as `prefix*order_id`. Mutually exclusive with `statement_descriptor`.
                    example: "LINE"
                    minLength: 2
                    maxLength: 10
                execute_payment:
                    type: boolean
                    description: Whether to execute payment immediately after order creation
                    default: false
                finalize:
                    type: boolean
                    description: Whether to explicitly finalize the order. When true, the order is finalized regardless of payment state. When false or omitted, finalization follows default heuristics (finalize if payment is executable).
                    default: false
                request_meta:
                    type: object
                    description: Optional metadata controlling request processing
                    properties:
                        idempotency_key:
                            type: string
                            description: Unique key to prevent duplicate order creation
                checkout_settings:
                    type: object
                    description: Checkout and payment flow configuration. Strongly recommended to provide both redirect_url and cancel_url for a delightful customer experience.
                    properties:
                        redirect_url:
                            type: string
                            format: uri
                            description: URL to redirect customer after payment completion
                            example: "https://example.com/order/complete"
                        cancel_url:
                            type: string
                            format: uri
                            description: URL to redirect customer if they cancel payment
                            example: "https://example.com/order/cancelled"
                invoice_settings:
                    $ref: '#/components/schemas/InvoiceSettings'
                payout_settings:
                    $ref: '#/components/schemas/OrderPayoutSettingsRequest'
                line_items:
                    type: array
                    description: Items included in the order. Product line items may use inline product data, `product_id` with explicit `price`, or `product_id` with `price_id`.
