    /orders/update:
        post:
            summary: Update an order
            description: |
                Updates mutable fields on an existing order and returns the same response shape as
                `/orders/lookup`.

                Use this endpoint to replace the order's full line item set, update the order number,
                receipt number, invoice settings, or statement descriptor, replace order-level `custom_data`,
                switch to a different saved payment method, tokenize a new payment method, clear the current
                payment method, or explicitly open, seal, or reseal the order via `finalize`.

                `line_items` is a full replacement field, not a sparse merge. `payment_method_id`,
                `payment_method_data`, and `clear_payment_method` are mutually exclusive. `custom_data`
                is metadata-only and does not require reopen or reseal by itself. Completed, paid,
                canceled, and expired orders cannot be updated.

                When mutating seal-sensitive fields on a sealed order, set `finalize: false` to
                reopen the order and leave it editable, or set `finalize: true` to apply the changes
                and reseal in the same request. If payment confirmation or execution has already
                started, Commerce rejects edits that would change the order's economics or payment
                configuration.
            operationId: updateOrder
            tags:
                - Orders
            parameters:
                - name: Idempotency-Key
                  in: header
                  required: false
                  schema:
                      type: string
                  description: Stable key used to replay safe retries without applying the update twice.
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            required:
                                - order_id
                            properties:
                                clear_payment_method:
                                    type: boolean
                                    description: |
                                        Clears the currently attached payment method. Mutually exclusive with
                                        `payment_method_id` and `payment_method_data`.
                                    default: false
                                custom_data:
                                    type: object
                                    additionalProperties:
                                        type: string
                                    description: |
                                        Replacement order-level custom data. This is metadata-only and does not
                                        require reopening or resealing the order by itself. Provide `{}` to clear
                                        existing custom data.
                                invoice_settings:
                                    $ref: '#/components/schemas/InvoiceSettings'
                                finalize:
                                    type: boolean
                                    description: |
                                        Explicit seal decision. Set to `false` to reopen a sealed order and leave it
                                        open, or `true` to seal or reseal the order after applying the requested
                                        mutations.
                                line_items:
                                    type: array
                                    description: |
                                        Full replacement for the order's line items. Omit this field to keep the
                                        current line items unchanged.
                                    items:
                                        $ref: '#/components/schemas/LineItem'
                                number:
                                    type: string
                                    description: Replacement order number.
                                    example: "ORDER-12345-REV2"
                                receipt_number:
                                    type: string
                                    description: |
                                        Replacement receipt number. Once set, it cannot be unset; provide a
                                        different non-empty value to change it. No uniqueness is enforced.
                                    example: "RCPT-12345-REV2"
                                order_id:
                                    type: string
                                    description: Unique identifier of the order to update.
                                    example: "or_48ZW7BGvYUBWc1i6WBkL2jr0iPQP5jUy76mmmHpt"
                                payment_method_data:
                                    allOf:
                                        - $ref: '#/components/schemas/PaymentMethodData'
                                    description: |
                                        New payment method details to tokenize and attach to the order. Currently
                                        only `mobile_money` is supported for order updates. When using inline mobile
                                        money details, include `billing_details.name` and
                                        `billing_details.address.country`.
                                payment_method_id:
                                    type: string
                                    description: |
                                        ID of a saved payment method to attach to the order. Mutually exclusive
                                        with `payment_method_data` and `clear_payment_method`.
                                    example: "pm_xyz123abc456"
                                statement_descriptor:
                                    type: string
                                    description: Replacement payment statement descriptor for the order's payment.
                                    example: "ORDER 12345"
                                    maxLength: 22
                                statement_descriptor_prefix:
                                    type: string
                                    description: Static prefix used to build the replacement descriptor as `prefix*order_id`. Mutually exclusive with `statement_descriptor`.
                                    example: "LINE"
                                    minLength: 2
                                    maxLength: 10
            responses:
                '200':
                    description: Order updated successfully
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/OrderResponse'
                '400':
                    description: Bad request - invalid parameters or mutation precondition not met
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                '401':
                    description: Unauthorized - invalid or missing API key
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
    /orders/pay:
        post:
            summary: Pay for an order
            description: |
                Initiates payment for an existing order. Supports two payment flows:
                1. Use saved payment method: Provide only `order_id` to charge a previously saved payment method
                2. Provide new payment details: Include `payment_method_data` with payment information
            operationId: payOrder
            tags:
                - Orders
            parameters:
                - name: Idempotency-Key
                  in: header
                  required: false
                  schema:
                      type: string
                  description: Stable key used to replay safe retries without initiating payment twice.
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            required:
                                - order_id
                            properties:
                                order_id:
                                    type: string
                                    description: Unique identifier of the order to pay
                                    example: "GKj7A8lM5wEGRUvbqpI4bkDFsQvpqVyh5fqePNnb"
                                payment_method_data:
                                    $ref: '#/components/schemas/PaymentMethodData'
                                payment_method_id:
                                    type: string
                                    description: ID of a saved payment method to use for this payment
                                    example: "pm_xyz123abc456"
                                paid_out_of_band:
                                    type: boolean
                                    description: |
                                        Set to true if payment was received outside Commerce (cash, bank transfer, check).
                                        Marks the payment as paid offline. Mutually exclusive with payment_method_id and
                                        payment_method_data. Defaults to false.
                                    default: false
                                    example: false
            responses:
                '200':
                    description: Payment initiated successfully
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/OrderResponse'
                '400':
                    description: Bad request - invalid parameters
                '401':
                    description: Unauthorized - invalid or missing API key
                '409':
                    description: Order payment state changed during processing
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                '500':
                    description: Order payment failed unexpectedly
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                '503':
                    description: Order payment hit a transient dependency failure
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
    /orders/confirm_payment:
        post:
            summary: Confirm payment with token
            description: Confirms a pending payment using a verification token (e.g., OTP sent to customer's phone)
            operationId: confirmPayment
            tags:
                - Orders
            parameters:
                - name: Idempotency-Key
                  in: header
                  required: false
                  schema:
                      type: string
                  description: Stable key used to replay safe retries without confirming the payment twice.
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            required:
                                - order_id
                                - payment_id
                                - confirmation_id
                                - token
                            properties:
                                order_id:
                                    type: string
                                    description: Unique identifier of the order
                                    example: "JoPtqOmsjgZKwkPvqTrqGsopu07wfC7ttoWqmfwt"
                                payment_id:
                                    type: string
                                    description: Unique identifier of the payment being confirmed
                                    example: "pay_123"
                                confirmation_id:
                                    type: string
                                    description: Unique identifier of the confirmation challenge
                                    example: "conf_123"
                                token:
                                    type: string
                                    description: Verification token (OTP) sent to customer
                                    example: "302673"
            responses:
                '200':
                    description: Payment confirmed successfully
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/OrderResponse'
                '400':
                    description: Invalid token or order
                '401':
                    description: Unauthorized - invalid or missing API key
                '409':
                    description: Order payment state changed during confirmation
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/OrderResponse'
                '500':
                    description: Order payment confirmation failed unexpectedly
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/OrderResponse'
                '503':
                    description: Order payment confirmation hit a transient dependency failure
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/OrderResponse'
    /orders/request_confirmation:
        post:
            summary: Request payment confirmation
            description: Requests a new confirmation token to be sent to the customer for payment verification
            operationId: requestConfirmation
            tags:
                - Orders
            parameters:
                - name: Idempotency-Key
                  in: header
                  required: false
                  schema:
                      type: string
                  description: Stable key used to replay safe retries without sending another confirmation request.
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            required:
                                - order_id
                            properties:
                                order_id:
                                    type: string
                                    description: Unique identifier of the order
                                    example: "kAVwBsk6EhQVv2YBUhYAqMf0lktEoQ0S7ZR8y2xi"
            responses:
                '200':
                    description: Confirmation request sent successfully
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/OrderResponse'
                '400':
                    description: Order confirmation request is invalid or cannot be satisfied
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/OrderResponse'
                '401':
                    description: Unauthorized - invalid or missing API key
                '500':
                    description: Order confirmation request failed unexpectedly
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                '503':
                    description: Order confirmation request hit a transient dependency failure
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/OrderResponse'
    /orders/cancel:
        post:
            summary: Cancel an order
            description: |
                Cancels an existing order. `execute_refund` records whether a refund was requested
                as part of the cancellation evidence; this endpoint does not move funds or create a refund.
            operationId: cancelOrder
            tags:
                - Orders
            parameters:
                - name: Idempotency-Key
                  in: header
                  required: false
                  schema:
                      type: string
                  description: Stable key used to replay safe retries without canceling the order twice.
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            required:
                                - order_id
                            properties:
                                order_id:
                                    type: string
                                    description: Unique identifier of the order to cancel
                                reason:
                                    type: string
                                    description: Optional reason for cancelling the order
                                execute_refund:
                                    type: boolean
                                    description: Whether the cancellation evidence should record that a refund was requested. This does not execute a refund.
                                    default: false
            responses:
                '200':
                    description: Order cancelled successfully
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/OrderResponse'
                '400':
                    description: Order cancellation request is invalid or cannot be satisfied
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                '401':
                    description: Unauthorized - invalid or missing API key
                '500':
                    description: Order cancellation failed unexpectedly
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
    /orders/finalize:
        post:
            summary: Finalize an order
            description: |
                Finalizes an order to make it ready for payment. This endpoint seals the current order
                state and activates the hosted checkout page that you can share with customers.

                Use this when you've finished building the cart and want to present it to the customer
                for payment. The response includes the `sealed_at` timestamp marking when the order was
                finalized. If you later need to change line items, payment method,
                statement descriptor, or order number, use `/orders/update` with an explicit `finalize`
                decision to reopen or reseal the order.
            operationId: finalizeOrder
            tags:
                - Orders
            parameters:
                - name: Idempotency-Key
                  in: header
                  required: false
                  schema:
                      type: string
                  description: Stable key used to replay safe retries without finalizing the order twice.
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            required:
                                - order_id
                            properties:
                                order_id:
                                    type: string
                                    description: Unique identifier of the order to finalize
                                    example: "or_48ZW7BGvYUBWc1i6WBkL2jr0iPQP5jUy76mmmHpt"
            responses:
                '200':
                    description: Order finalized successfully
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    order:
                                        $ref: '#/components/schemas/Order'
                                example:
                                    order:
                                        number: "ORDER-12345"
                                        status: "requires_payment"
                                        payment_id: "pay_xyz123abc456"
                                        customer_id: "cus_abc123def456"
                                        sealed_at: "2025-01-25T10:30:00Z"
                                        initiated_at: "2025-01-25T10:25:00Z"
                                        expires_at: "2025-02-01T10:25:00Z"
                                        line_item_group:
                                            line_items:
                                                type: "product"
                                                product:
                                                    id: "prod_123"
                                                    name: "Premium Widget"
                                                    quantity: 2
                                                    price:
                                                        currency: "GHS"
                                                        value: 5000
                                            total:
                                                currency: "GHS"
                                                value: 10000
                '401':
                    description: Unauthorized - invalid or missing API key
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                '400':
                    description: Order finalization request is invalid or cannot be satisfied
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                '500':
                    description: Order finalization failed unexpectedly
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                '503':
                    description: Order finalization hit a transient dependency failure
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
    /orders/complete:
        post:
            summary: Complete an order
            description: |
                Marks an order as completed, transitioning it to the `completed` state. An order can only
                be completed if its associated payment has been successfully paid.

                Use the `paid_out_of_band` parameter when payment happened offline (outside the Commerce
                platform) to force the payment status to paid before completing the order. This is useful
                for cash payments, bank transfers, or other out-of-band payment methods.

                Once completed, the order status becomes `completed` and the `completed_at` timestamp is set.
            operationId: completeOrder
            tags:
                - Orders
            parameters:
                - name: Idempotency-Key
                  in: header
                  required: false
                  schema:
                      type: string
                  description: Stable key used to replay safe retries without completing the order twice.
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            required:
                                - order_id
                            properties:
                                order_id:
                                    type: string
                                    description: Unique identifier of the order to complete
                                    example: "or_48ZW7BGvYUBWc1i6WBkL2jr0iPQP5jUy76mmmHpt"
                                paid_out_of_band:
                                    type: boolean
                                    description: |
                                        Set to true if payment was received outside the Commerce platform
                                        (e.g., cash, bank transfer, check). When true, the associated payment
                                        will be marked as paid offline before completing the order.
                                    default: false
                                    example: false
            responses:
                '200':
                    description: Order completed successfully
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    order:
                                        $ref: '#/components/schemas/Order'
                                example:
                                    order:
                                        number: "ORDER-12345"
                                        status: "completed"
                                        payment_id: "pay_xyz123abc456"
                                        customer_id: "cus_abc123def456"
                                        completed_at: "2025-01-25T11:00:00Z"
                                        sealed_at: "2025-01-25T10:30:00Z"
                                        initiated_at: "2025-01-25T10:25:00Z"
                                        expires_at: "2025-02-01T10:25:00Z"
                                        line_item_group:
                                            line_items:
                                                type: "product"
                                                product:
                                                    id: "prod_123"
                                                    name: "Premium Widget"
                                                    quantity: 2
                                                    price:
                                                        currency: "GHS"
                                                        value: 5000
                                            total:
                                                currency: "GHS"
                                                value: 10000
                '401':
                    description: Unauthorized - invalid or missing API key
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                '400':
                    description: Order completion request is invalid or cannot be satisfied
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                '409':
                    description: Order payment state changed during completion
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                '500':
                    description: Order completion failed unexpectedly
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
    /orders/send_invoice:
        post:
            summary: Send an order invoice
            description: |
                Sends the hosted invoice link for an existing order through Chime. The request
                body contains only `order_id`; delivery options are resolved from the order
                customer.

                If the customer has both a phone number and an email address, Commerce sends
                both SMS and email Chimes. If only one contact method exists, Commerce sends
                to that channel. The order must be finalized before Commerce can send the
                hosted invoice link.

                This is an idempotent endpoint. Send retry keys with the `Idempotency-Key`
                header.
            operationId: sendOrderInvoice
            tags:
                - Orders
            parameters:
                - name: Idempotency-Key
                  in: header
                  required: false
                  schema:
                      type: string
                  description: Stable key used to replay safe retries without sending duplicate invoice Chimes.
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/OrderDocumentDeliveryRequest'
            responses:
                '200':
                    description: Invoice link sent successfully.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/OrderDocumentDeliveryResponse'
                '207':
                    description: Partial success - at least one channel sent and at least one channel failed.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/OrderDocumentDeliveryResponse'
                '400':
                    description: Bad request or unmet precondition. Possible codes include `draft_mode_order_has_no_invoice`, `order_delivery_contact_missing`, and `order_not_found`.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/OrderDocumentDeliveryResponse'
                '401':
                    description: Unauthorized - invalid or missing API key
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                '500':
                    description: Order invoice delivery failed unexpectedly
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                '503':
                    description: Transient delivery failure. Possible codes include `order_delivery_auth_failed` and `order_delivery_failed`.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/OrderDocumentDeliveryResponse'
    /orders/send_receipt:
        post:
            summary: Send an order receipt
            description: |
                Sends the hosted receipt link for an existing paid order through Chime. The
                request body contains only `order_id`; receipt delivery never uses the invoice
                PDF path.

                If the customer has both a phone number and an email address, Commerce sends
                both SMS and email Chimes. If only one contact method exists, Commerce sends
                to that channel. The order must be paid before a receipt can be sent.

                This is an idempotent endpoint. Send retry keys with the `Idempotency-Key`
                header.
            operationId: sendOrderReceipt
            tags:
                - Orders
            parameters:
                - name: Idempotency-Key
                  in: header
                  required: false
                  schema:
                      type: string
                  description: Stable key used to replay safe retries without sending duplicate receipt Chimes.
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/OrderDocumentDeliveryRequest'
            responses:
                '200':
                    description: Receipt link sent successfully.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/OrderDocumentDeliveryResponse'
                '207':
                    description: Partial success - at least one channel sent and at least one channel failed.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/OrderDocumentDeliveryResponse'
                '400':
                    description: Bad request or unmet precondition. Possible codes include `order_delivery_contact_missing`, `order_not_found`, and `order_receipt_missing`.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/OrderDocumentDeliveryResponse'
                '401':
                    description: Unauthorized - invalid or missing API key
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                '500':
                    description: Order receipt delivery failed unexpectedly
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                '503':
                    description: Transient delivery failure. Possible codes include `order_delivery_auth_failed` and `order_delivery_failed`.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/OrderDocumentDeliveryResponse'
    /orders/page:
        post:
            summary: Page through orders
            description: |
                Retrieve a paginated list of the most recent orders for the authenticated application.
                Orders are sorted by `initiated_at` in descending order. Page numbers are
                zero-based, so page 0 contains the freshest activity.
            operationId: pageOrders
            tags:
                - Orders
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            required:
                                - page_size
                            properties:
                                page_number:
                                    type: integer
                                    minimum: 0
                                    maximum: 10
                                    description: Zero-based page index to fetch (0-10 inclusive)
                                    default: 0
                                page_size:
                                    type: integer
                                    minimum: 1
                                    maximum: 256
                                    description: Number of orders per page (1-256)
                                customer_id:
                                    type: string
                                    description: |
                                        When provided, restricts results to orders belonging
                                        to this customer. The customer must belong to the
                                        authenticated application.
            responses:
                '200':
                    description: Page retrieved successfully
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    page:
                                        type: object
                                        properties:
                                            number:
                                                type: integer
                                                description: The page number returned
                                            size:
                                                type: integer
                                                description: The number of orders in this page
                                            orders:
                                                type: array
                                                items:
                                                    $ref: '#/components/schemas/Order'
                '401':
                    description: Unauthorized - invalid or missing API key
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                '400':
                    description: Invalid order page request or precondition failure
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                '500':
                    description: Order page lookup failed unexpectedly
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                '503':
                    description: Order page lookup failed transiently
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
    /refunds/create:
        post:
            summary: Create a refund
            description: |
                Starts a refund for one or more paid order line items. Refund processing is
                asynchronous: a successful request returns the new refund in `pending` status.
                Retry an uncertain request with the same URL, idempotency key, and body.
            operationId: createRefund
            tags:
                - Refunds
            parameters:
                - $ref: '#/components/parameters/IdempotencyKey'
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/CreateRefundRequest'
            responses:
                '200':
                    description: Refund created
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/RefundResponse'
                '400':
                    description: Invalid refund request
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorEnvelope'
                '401':
                    description: Authorization is required
                '409':
                    description: The refund conflicts with current order or line-item state
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorEnvelope'
                '422':
                    description: The refund could not be accepted
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorEnvelope'
                '500':
                    description: Refund creation failed unexpectedly
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorEnvelope'
                '503':
                    description: Refund creation hit a transient dependency failure
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorEnvelope'
    /orders/refund:
        post:
            summary: Create a refund using the compatibility URL
            description: |
                Compatibility alias for `/refunds/create`. It accepts the same request and returns
                the same response. New integrations should use `/refunds/create`. Choose one URL for
                a logical refund and use that same URL, idempotency key, and body for every retry.
            operationId: createRefundAlias
            tags:
                - Refunds
            parameters:
                - $ref: '#/components/parameters/IdempotencyKey'
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/CreateRefundRequest'
            responses:
                '200':
                    description: Refund created
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/RefundResponse'
                '400':
                    description: Invalid refund request
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorEnvelope'
                '401':
                    description: Authorization is required
                '409':
                    description: The refund conflicts with current order or line-item state
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorEnvelope'
                '422':
                    description: The refund could not be accepted
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorEnvelope'
                '500':
                    description: Refund creation failed unexpectedly
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorEnvelope'
                '503':
                    description: Refund creation hit a transient dependency failure
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorEnvelope'
    /refunds/cancel:
        post:
            summary: Cancel a refund
            description: |
                Cancels a pending refund before processing claims it. Cancellation releases the
                merchant balance hold and restores the refundable capacity reserved against its
                order line items. Repeating cancellation returns the same canceled refund.
            operationId: cancelRefund
            tags:
                - Refunds
            parameters:
                - $ref: '#/components/parameters/IdempotencyKey'
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/CancelRefundRequest'
            responses:
                '200':
                    description: Refund canceled
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/RefundResponse'
                '400':
                    description: Invalid refund cancellation request
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorEnvelope'
                '401':
                    description: Authorization is required
                '404':
                    description: Refund not found
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorEnvelope'
                '409':
                    description: Refund cannot be canceled or the idempotency key is still being processed
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorEnvelope'
                '422':
                    description: The idempotency key was previously used with a different request body
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorEnvelope'
                '500':
                    description: Refund cancellation failed unexpectedly
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorEnvelope'
                '503':
                    description: Refund cancellation or idempotency storage is temporarily unavailable
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorEnvelope'
    /refunds/lookup:
        post:
            summary: Look up a refund
            description: Returns the current lifecycle state and amounts for one refund.
            operationId: lookupRefund
            tags:
                - Refunds
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/LookupRefundRequest'
            responses:
                '200':
                    description: Refund found
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/RefundResponse'
                '400':
                    description: Invalid refund lookup request
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorEnvelope'
                '401':
                    description: Authorization is required
                '404':
                    description: Refund not found
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorEnvelope'
                '500':
                    description: Refund lookup failed unexpectedly
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorEnvelope'
    /refunds/page:
        post:
            summary: Page through refunds
            description: Returns refunds in pages of the requested size. Page numbering starts at 1.
            operationId: pageRefunds
            tags:
                - Refunds
            requestBody:
                required: true
