    /schedules/cancel:
        post:
            summary: Cancel a scheduled Chime
            description: Cancel a schedule before execution wins the cancellation race.
            operationId: cancelSchedule
            tags: [Schedules]
            parameters:
                - $ref: '#/components/parameters/IdempotencyKey'
