                '404':
                    description: Price or product not found
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                '422':
                    description: Cannot modify immutable field (product_id or amount)
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
