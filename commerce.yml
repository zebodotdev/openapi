    /message_templates/create:
        post:
            summary: Create a message template
            description: |
                Creates an app-scoped reusable SMS or email message template. The API generates
                the template `id`; clients must not supply an `id`, `template_id`, or template key.
            operationId: createMessageTemplate
            tags:
                - Message Templates
            parameters:
                - $ref: '#/components/parameters/IdempotencyKey'
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/CreateMessageTemplateRequest'
            responses:
                '200':
                    description: Message template created successfully
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/MessageTemplateEnvelope'
                '401':
                    description: Unauthorized - invalid or missing API key
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorEnvelope'
                '400':
                    description: Bad request - invalid parameters
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorEnvelope'
                '503':
                    description: Service unavailable - retryable create failure
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorEnvelope'
    /message_templates/update:
        post:
            summary: Update a message template
            description: |
                Updates a reusable message template and creates a new draft version. Published
                versions remain stable until the draft is explicitly published.
            operationId: updateMessageTemplate
            tags:
                - Message Templates
            parameters:
                - $ref: '#/components/parameters/IdempotencyKey'
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/UpdateMessageTemplateRequest'
            responses:
                '200':
                    description: Message template updated successfully
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/MessageTemplateEnvelope'
                '401':
                    description: Unauthorized - invalid or missing API key
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorEnvelope'
                '400':
                    description: Bad request - invalid parameters
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorEnvelope'
                '404':
                    description: Message template not found
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorEnvelope'
                '409':
                    description: Message template is archived
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorEnvelope'
                '503':
                    description: Service unavailable - retryable update failure
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorEnvelope'
    /message_templates/publish:
        post:
            summary: Publish a message template
            description: Publishes the current draft version of a reusable message template.
            operationId: publishMessageTemplate
            tags:
                - Message Templates
            parameters:
                - $ref: '#/components/parameters/IdempotencyKey'
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
