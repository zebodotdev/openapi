                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                '422':
                    description: Unprocessable entity - validation failed
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
    /prices/update:
        post:
            summary: Update a price
            description: |
                Updates an existing price's metadata. Only label and about fields can be modified.
                The price amount and product_id (once set) are immutable.

                Immutability rules:
                - Amount: Cannot be changed. Create a new price instead.
                - Product ID: Cannot be changed once set initially.
                - Label: Can be updated (max 100 characters)
                - About: Can be updated (max 500 characters)
            operationId: updatePrice
            tags:
                - Prices
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            required:
                                - price_id
                            properties:
                                price_id:
                                    type: string
                                    description: The unique identifier of the price to update
                                    example: "pr_xyz789"
                                product_id:
                                    type: string
                                    description: Product ID (can only be set if not already set)
                                    example: "prod_abc123"
                                label:
                                    type: string
                                    description: Short label for this price (max 100 characters)
                                    example: "Premium pricing"
                                about:
                                    type: string
                                    description: Longer description of this price (max 500 characters)
                                    example: "Premium pricing tier for enterprise customers"
            responses:
                '200':
                    description: Price updated successfully
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/PriceResponse'
                '400':
                    description: Bad request - invalid parameters
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                '401':
                    description: Unauthorized - invalid or missing API key
                    content:
                        application/json:
                            schema:
