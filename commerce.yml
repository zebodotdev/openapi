                idempotency_key:
                    type: string
                purpose:
                    type: string
                recipients:
                    type: array
                    items:
                        type: string
                send_after:
                    type: string
                    format: date-time
                sender_id:
                    type: string
        LookupBroadcastRequest:
            type: object
            required: [broadcast_id]
            properties:
                broadcast_id:
                    type: string
        LookupBroadcastResponse:
            type: object
            properties:
                broadcast:
                    $ref: '#/components/schemas/BroadcastDetail'
        CancelBroadcastRequest:
            type: object
            required: [broadcast_id]
            properties:
                broadcast_id:
                    type: string
        BroadcastCancelResponse:
            type: object
            properties:
                broadcast:
                    $ref: '#/components/schemas/BroadcastCancelDetail'
        BroadcastDetail:
            type: object
            required: [content, created_at, id, recipients, send_after, sender_id]
            properties:
                chime_ids:
                    type: array
                    items:
                        type: string
                content:
                    type: string
                created_at:
                    type: string
                    format: date-time
                customer_ids:
                    type: array
                    items:
                        type: string
                email:
                    $ref: '#/components/schemas/ChimeEmailMessage'
                errors:
                    type: array
                    items:
                        $ref: '#/components/schemas/BroadcastError'
                executed_at:
                    type: string
                    format: date-time
                id:
                    type: string
                idempotency_key:
                    type: string
                purpose:
                    type: string
                recipients:
                    type: array
                    items:
                        type: string
                send_after:
                    type: string
                    format: date-time
                sender_id:
                    type: string
        BroadcastCancelDetail:
            allOf:
                - $ref: '#/components/schemas/BroadcastDetail'
                - type: object
                  properties:
                      canceled_at:
                          type: string
                          format: date-time
        BroadcastError:
            type: object
            description: Error encountered when broadcasting to a specific recipient
            properties:
                recipient:
                    type: string
                    description: Recipient address that caused the error
                    example: "+233invalid"
                fix_code:
                    type: string
                    description: Code indicating how to fix this error
                    example: "check_recipient"
                type:
                    type: string
                    description: Error type classification
                    example: "invalid_recipient"
        InitiateOTPRequest:
            type: object
            required: [recipient, service_name, token_size]
            additionalProperties: false
            properties:
                async_delivery:
                    type: boolean
                    description: Return after accepting the transaction while SMS delivery continues asynchronously.
                    default: false
                message_template:
                    type: string
                    description: SMS text containing the required `{token}` placeholder and optional `{service}` placeholder.
                    example: "Your {service} code is {token}."
                purpose:
                    type: string
                    description: Your label for the verification flow.
                recipient:
                    type: string
                    description: Phone number in international format (E.164)
                    example: "+233241234567"
                sender:
                    type: string
                    description: Optional sender identifier shown to the recipient (3-12 characters).
                    minLength: 3
                    maxLength: 12
                    example: "Acme"
                service_name:
                    type: string
                    description: Service name substituted for `{service}` (2-20 characters).
                    minLength: 2
                    maxLength: 20
                    example: "Acme Bank"
                token_alphabet:
                    type: string
                    description: Custom alphabet for token generation (mutually exclusive with token_alphabet_type)
                    example: "0123456789ABCDEF"
                token_alphabet_type:
                    type: string
                    description: Predefined alphabet type (mutually exclusive with token_alphabet)
                    enum: [numeric, alpha, alphanumeric]
                    example: "numeric"
                token_size:
                    type: integer
                    description: Length of generated token (5-10 characters)
                    minimum: 5
                    maximum: 10
                    example: 6
                validity_duration_in_minutes:
                    type: integer
                    description: How long the token remains valid (3-10080 minutes)
                    minimum: 3
                    maximum: 10080
                    example: 10
        InitiateOTPResponse:
            type: object
            required: [transaction]
            properties:
                transaction:
                    $ref: '#/components/schemas/OTPTransaction'
        VerifyOTPRequest:
            type: object
            required: [recipient, token, transaction_id]
            additionalProperties: false
            properties:
                transaction_id:
                    type: string
                    description: ID of the OTP transaction to verify (with ot_ prefix)
                    example: "ot_3f8a9c7e2d1b4a6f"
                recipient:
                    type: string
                    description: Phone number that received the OTP
                    example: "+233241234567"
                token:
                    type: string
                    description: OTP token submitted by the user
                    example: "847293"
        VerifyOTPResponse:
            type: object
            required: [transaction, verification_attempt]
            properties:
                transaction:
                    $ref: '#/components/schemas/OTPTransaction'
                verification_attempt:
                    $ref: '#/components/schemas/OTPVerificationAttempt'
        LookupOTPRequest:
            type: object
            required: [transaction_id]
            additionalProperties: false
            properties:
                transaction_id:
                    type: string
                    description: ID of the OTP transaction to lookup (with ot_ prefix)
                    example: "ot_3f8a9c7e2d1b4a6f"
        LookupOTPResponse:
            type: object
            required: [transaction]
            properties:
                transaction:
                    $ref: '#/components/schemas/OTPTransaction'
        OTPTransaction:
            type: object
            description: OTP transaction object returned by initiate, verify, and lookup endpoints
            required: [expires_at, full_message, id, initiated_at, status]
            properties:
                cancel_reason:
                    type: string
                    description: Omitted unless the transaction was canceled.
                canceled_at:
                    type: string
                    format: date-time
                    description: Omitted unless the transaction was canceled.
                expires_at:
                    type: string
                    format: date-time
                full_message:
                    type: string
                    description: Message text with the `{token}` placeholder preserved; no generated token is returned.
                    example: "Your Acme Bank code is {token}."
                id:
                    type: string
                    description: Unique identifier with ot_ prefix
                    example: "ot_3f8a9c7e2d1b4a6f"
                initiated_at:
                    type: string
                    format: date-time
                status:
                    type: string
                    enum: [canceled, expired, pending, pending_delivery, pending_verification, verified]
                transmission:
                    $ref: '#/components/schemas/OTPTransmission'
        OTPTransmission:
            type: object
            required: [recipient, sender_id]
            properties:
                recipient:
                    type: string
                    example: "+233241234567"
                sender_id:
                    type: string
                    example: "Acme"
                sent_at:
                    type: string
                    format: date-time
                sent_via:
                    type: string
                    enum: [sms]
                status:
                    type: string
                    enum: [delivered, failed, submitted]
        OTPVerificationAttempt:
            type: object
            description: Details of a verification attempt
            required: [attempted_at, id, presented_token, recipient, result]
            properties:
                attempted_at:
                    type: string
                    format: date-time
                id:
                    type: string
                    example: "ov_9e8d7c6b5a4f3e2d"
                presented_token:
                    type: string
                    description: Token submitted for this verification attempt.
                recipient:
                    type: string
                result:
                    type: object
                    required: [verdict]
                    properties:
                        detail:
                            type: string
                            description: Omitted when no detail is available.
                        verdict:
                            type: string
                            enum: [fail, pass]
