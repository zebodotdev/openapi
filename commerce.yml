    /balance_transactions/page:
        post:
            summary: Page through balance transactions
            description: |
                Retrieve a paginated list of balance transactions for the authenticated application.
                Transactions are sorted by created_at in descending order, so page 1 always contains
                the most recent activity.
            operationId: pageBalanceTransactions
            tags:
                - Balance Transactions
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            required:
                                - page_number
                                - page_size
                            additionalProperties: false
                            properties:
                                page_number:
                                    type: integer
                                    minimum: 0
                                    maximum: 10
                                    description: Page number to fetch. Use 1 for the first page; 0 is accepted but returns an empty page.
                                    example: 1
                                page_size:
                                    type: integer
                                    minimum: 1
                                    maximum: 256
                                    description: Number of transactions per page (1-256)
                                    example: 20
            responses:
                '200':
                    description: Page retrieved successfully
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/BalanceTransactionPageResponse'
                '400':
