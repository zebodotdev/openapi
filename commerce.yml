                    type: string
                upload_request_id:
                    type: string
        FileMedia:
            type: object
            properties:
                kind:
                    type: string
                    example: image
                width:
                    type: integer
                    format: int64
                height:
                    type: integer
                    format: int64
                duration_ms:
                    type: integer
                    format: int64
                page_count:
                    type: integer
                    format: int64
                frame_count:
                    type: integer
                    format: int64
                color_space:
                    type: string
                has_alpha:
                    type: boolean
                codec:
                    type: string
                aspect_ratio:
                    type: string
        PublicFileStorage:
