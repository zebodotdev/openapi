components:
    securitySchemes:
        bearerAuth:
            type: http
            scheme: bearer
            description: Commerce API key supplied in the Authorization header.
    schemas:
        GenerateSecretKeyRequest:
            type: object
            description: Optional creation metadata for secret key generation.
            additionalProperties: false
            properties:
                label:
                    type: string
                    description: Optional human-readable label for the secret key. Omit or send an empty string for an unlabeled key.
                    example: Production checkout
                user_agent:
                    type: string
                    description: User agent of the user or client that initiated key generation. If omitted, the request User-Agent header is used.
                remote_addr:
                    type: string
                    description: Remote address of the user or client that initiated key generation. If omitted, the request remote address is used.
                actor:
                    $ref: '#/components/schemas/SecretKeyActorRequest'
        SecretKeyActorRequest:
            type: object
            description: Reserved platform actor metadata. Public API clients must omit this object.
            additionalProperties: false
            properties:
                service:
                    type: string
                    description: Reserved platform origin identifier.
                user_id:
                    type: string
                    description: Authenticated dashboard user ID for the actor.
                team_member_id:
                    type: string
                    description: Authenticated dashboard team member ID for the actor.
                email:
                    type: string
                    description: Email address for the actor, when available.
                name:
                    type: string
                    description: Display name for the actor, when available.
        GenerateSecretKeyResponse:
            type: object
            required:
                - key
            properties:
                key:
                    $ref: '#/components/schemas/GeneratedSecretKey'
                error:
                    $ref: '#/components/schemas/Error'
        GeneratedSecretKey:
            type: object
            description: Newly generated secret key. The token is returned once and cannot be retrieved later.
            required:
                - id
                - token_type
                - issued_at
                - token
            properties:
                id:
                    type: string
                    description: Secret key identifier.
                    example: sk_2xC7k9gK5yQnZ4w8P1sT6vR3
                label:
                    type: string
                    description: Optional human-readable label for the secret key.
                    example: Production checkout
                token_type:
                    type: string
                    enum: [bearer]
                    example: bearer
                issued_at:
                    type: string
                    format: date-time
                token:
                    type: string
                    description: One-time bearer token for the generated key.
        PageSecretKeysRequest:
            type: object
            properties:
                page:
                    type: integer
                    minimum: 1
                    description: Page number. Alias for `number`.
                    example: 1
                number:
                    type: integer
                    minimum: 1
                    description: Page number.
                    example: 1
                size:
                    type: integer
                    minimum: 1
                    maximum: 100
                    description: Number of keys per page.
                    example: 20
        PageSecretKeysResponse:
            type: object
            required:
                - page
            properties:
                page:
                    $ref: '#/components/schemas/SecretKeyPage'
                error:
                    $ref: '#/components/schemas/Error'
        LookupSecretKeyRequest:
            type: object
            properties:
                secret_key_id:
                    type: string
                    description: Secret key identifier. Typed `sk_...` IDs are accepted.
                    example: sk_2xC7k9gK5yQnZ4w8P1sT6vR3
                key_id:
                    type: string
                    description: Alias for `secret_key_id`.
                id:
                    type: string
                    description: Alias for `secret_key_id`.
        LookupSecretKeyResponse:
            type: object
            required:
                - key
            properties:
                key:
                    $ref: '#/components/schemas/SecretKey'
                error:
                    $ref: '#/components/schemas/Error'
        UpdateSecretKeyRequest:
            allOf:
                - $ref: '#/components/schemas/LookupSecretKeyRequest'
                - type: object
                  required:
                      - label
                  properties:
                      label:
                          type: string
                          description: Human-readable label for the secret key. Send an empty string to clear the label.
                          example: Production checkout
                      user_agent:
                          type: string
                          description: User agent of the user or client that initiated the update. If omitted, the request User-Agent header is used.
                      remote_addr:
                          type: string
                          description: Remote address of the user or client that initiated the update. If omitted, the request remote address is used.
                      actor:
                          $ref: '#/components/schemas/SecretKeyActorRequest'
        UpdateSecretKeyResponse:
            type: object
            required:
                - key
            properties:
                key:
                    $ref: '#/components/schemas/SecretKey'
                error:
                    $ref: '#/components/schemas/Error'
        DestroySecretKeyRequest:
            allOf:
                - $ref: '#/components/schemas/LookupSecretKeyRequest'
                - type: object
                  properties:
                      user_agent:
                          type: string
                          description: User agent of the user or client that initiated revocation. If omitted, the request User-Agent header is used.
                      remote_addr:
                          type: string
                          description: Remote address of the user or client that initiated revocation. If omitted, the request remote address is used.
                      actor:
                          $ref: '#/components/schemas/SecretKeyActorRequest'
        DestroySecretKeyResponse:
            type: object
            required:
                - key
            properties:
                key:
                    $ref: '#/components/schemas/SecretKey'
                error:
                    $ref: '#/components/schemas/Error'
        SecretKeyUsageRequest:
            allOf:
                - $ref: '#/components/schemas/LookupSecretKeyRequest'
                - type: object
                  properties:
                      page:
                          type: integer
                          minimum: 1
                          description: Page number. Alias for `number`.
                          example: 1
                      number:
                          type: integer
                          minimum: 1
                          description: Page number.
                          example: 1
                      size:
                          type: integer
                          minimum: 1
                          maximum: 100
                          description: Number of usage rows per page.
                          example: 20
        SecretKeyUsageResponse:
            type: object
            required:
                - key
                - usage
            properties:
                key:
                    $ref: '#/components/schemas/SecretKey'
                usage:
                    $ref: '#/components/schemas/SecretKeyUsagePage'
                error:
                    $ref: '#/components/schemas/Error'
        SecretKey:
            type: object
            description: Safe secret key metadata. The bearer token, key secret, and full cipher text are not returned.
            required:
                - id
                - token_type
                - issued_at
                - status
                - active
                - usage_count
                - usage_metrics_available
            properties:
                id:
                    type: string
                    example: sk_2xC7k9gK5yQnZ4w8P1sT6vR3
                label:
                    type: string
                    description: Optional human-readable label for the secret key.
                    example: Production checkout
                token_type:
                    type: string
                    enum: [bearer]
                    example: bearer
                issued_at:
                    type: string
                    format: date-time
                updated_at:
                    type: string
                    format: date-time
                updated_by:
                    type: string
                    description: Secret key ID that last updated the key metadata, when available.
                expires_at:
                    type: string
                    format: date-time
                status:
                    type: string
                    enum: [active, revoked, expired]
                active:
                    type: boolean
                revoked_at:
                    type: string
                    format: date-time
                revoked_by:
                    type: string
                request_id:
                    type: string
                    description: Request ID that created the key, when available.
                ip_address:
                    type: string
                    description: IP address that created the key, when available.
                user_agent:
                    type: string
                    description: User agent that created the key, when available.
                key_gen:
                    type: string
                    example: sha256
                generated_by_service:
                    type: string
                    description: Origin that generated the key. Values other than `api` are platform-managed and may change.
                generated_by_user_id:
                    type: string
                    description: Dashboard user ID that generated the key, when available.
                generated_by_team_member_id:
                    type: string
                    description: Dashboard team member ID that generated the key, when available.
                generated_by_email:
                    type: string
                    description: Email address for the actor that generated the key, when available.
                generated_by_name:
                    type: string
                    description: Display name for the actor that generated the key, when available.
                revocation_request_id:
                    type: string
                    description: Request ID that revoked the key, when available.
                revocation_ip_address:
                    type: string
                    description: IP address that revoked the key, when available.
                revocation_user_agent:
                    type: string
                    description: User agent that revoked the key, when available.
                revoked_by_service:
                    type: string
                    description: Origin that revoked the key. Values other than `api` are platform-managed and may change.
                revoked_by_user_id:
                    type: string
                    description: Dashboard user ID that revoked the key, when available.
                revoked_by_team_member_id:
                    type: string
                    description: Dashboard team member ID that revoked the key, when available.
                revoked_by_email:
                    type: string
                    description: Email address for the actor that revoked the key, when available.
                revoked_by_name:
                    type: string
                    description: Display name for the actor that revoked the key, when available.
                cipher_text_prefix:
                    type: string
                    description: Short safe fingerprint prefix of the stored cipher text.
                cipher_text_length:
                    type: integer
                    description: Length of the stored cipher text.
                last_used_at:
                    type: string
                    format: date-time
                usage_count:
                    type: integer
                    minimum: 0
                    description: Count of successful sessions created with the key.
                usage_metrics_available:
                    type: boolean
        SecretKeyPage:
            type: object
            required:
                - number
                - size
                - count
                - total
                - has_more
                - usage_metrics_available
                - keys
            properties:
                number:
                    type: integer
                    minimum: 1
                size:
                    type: integer
                    minimum: 1
                count:
                    type: integer
                    minimum: 0
                total:
                    type: integer
                    minimum: 0
                has_more:
                    type: boolean
                usage_metrics_available:
                    type: boolean
                keys:
                    type: array
                    items:
                        $ref: '#/components/schemas/SecretKey'
        SecretKeyUsagePage:
            type: object
            required:
                - number
                - size
                - count
                - total
                - has_more
                - verification_attempts_available
                - rows
            properties:
                number:
                    type: integer
                    minimum: 1
                size:
                    type: integer
                    minimum: 1
                count:
                    type: integer
                    minimum: 0
                total:
                    type: integer
                    minimum: 0
                has_more:
                    type: boolean
                verification_attempts_available:
                    type: boolean
                rows:
                    type: array
                    items:
                        $ref: '#/components/schemas/SecretKeyUsageRow'
        SecretKeyUsageRow:
            type: object
            required:
                - id
                - type
                - secret_key_id
                - occurred_at
                - verified
                - auth_result
            properties:
                id:
                    type: string
                    description: Usage row identifier. Session rows use `cs_...`; verification rows use `skv_...`.
                type:
                    type: string
                    enum: [session, verification]
                secret_key_id:
                    type: string
                    example: sk_2xC7k9gK5yQnZ4w8P1sT6vR3
                session_id:
                    type: string
                    description: Present for successful session rows.
                verification_id:
                    type: string
                    description: Present for failed verification rows.
                request_id:
                    type: string
                    description: Request ID associated with a successful session row.
                occurred_at:
                    type: string
                    format: date-time
                created_at:
                    type: string
                    format: date-time
                    description: Present for verification rows.
                initiated_at:
                    type: string
                    format: date-time
                    description: Present for session rows.
                expires_at:
                    type: string
                    format: date-time
                    description: Present for session rows.
                ip_address:
                    type: string
                user_agent:
                    type: string
                verified:
                    type: boolean
                auth_result:
                    type: string
                    enum: [succeeded, failed]
                multi_use:
                    type: boolean
                    description: Present for session rows.
        FileServiceHealthResponse:
            type: object
            required:
                - service
                - status
                - environment
                - checked_at
            properties:
                service:
                    type: string
                    example: files
                status:
                    type: string
                    example: ok
                environment:
                    type: string
                    example: prod
                checked_at:
                    type: string
                    format: date-time
        FileServiceReadyResponse:
            type: object
            required:
                - service
                - status
                - environment
                - files_base_url
                - checked_at
            properties:
                service:
                    type: string
                    example: files
                status:
                    type: string
                    example: ready
                environment:
                    type: string
                    example: prod
                files_base_url:
                    type: string
                    format: uri
                    example: "https://api.zebo.dev"
                checked_at:
                    type: string
                    format: date-time
        FileApiError:
            type: object
            description: Standard error response shape for file API endpoints.
            properties:
                message:
                    type: string
                fix_code:
                    type: string
                detail:
                    type: string
                cause:
                    type: string
                type:
                    type: string
                code:
                    type: string
                url:
                    type: string
                    format: uri
        CreateFileRequest:
            type: object
            required:
                - file
                - purpose
            properties:
                file:
                    type: string
                    format: binary
                    description: Binary file part to store.
                purpose:
                    type: string
                    description: File purpose policy to apply.
                    example: product_image
                title:
                    type: string
                    description: Optional display title for the file.
                    example: Hero product image
                metadata:
                    type: string
                    description: JSON object encoded as a string. Values must be strings.
                    example: '{"product_id":"prod_123"}'
                idempotency_key:
                    type: string
                    description: Optional idempotency key. Can also be supplied in the `idempotency-key` header.
        LookupFileRequest:
            type: object
            required:
                - file_id
            properties:
                file_id:
                    type: string
                    example: file_2xC7k9gK5yQnZ4w8P1sT6vR3
        PageFilesRequest:
            type: object
            properties:
                purpose:
                    type: string
                    example: product_image
                status:
                    type: string
                    enum: [uploading, processing, available, failed, deleted]
                    example: available
                page_number:
                    type: integer
                    minimum: 1
                    example: 1
                page_size:
                    type: integer
                    minimum: 1
                    example: 25
                created_after:
                    type: string
                    format: date-time
                created_before:
                    type: string
                    format: date-time
        FileContentsRequest:
            type: object
            required:
                - file_id
            properties:
                file_id:
                    type: string
                    example: file_2xC7k9gK5yQnZ4w8P1sT6vR3
                disposition:
                    type: string
                    enum: [attachment, inline]
                    default: attachment
                delivery:
                    type: string
                    enum: [stream, redirect]
                    default: stream
        DeleteFileRequest:
            type: object
            required:
                - file_id
            properties:
                file_id:
                    type: string
                    example: file_2xC7k9gK5yQnZ4w8P1sT6vR3
        FileResponse:
            type: object
            properties:
                file:
                    $ref: '#/components/schemas/FileObject'
                error:
                    $ref: '#/components/schemas/FileApiError'
        FilePageResponse:
            type: object
            properties:
                page:
                    $ref: '#/components/schemas/FilePage'
                error:
                    $ref: '#/components/schemas/FileApiError'
        FilePage:
            type: object
            required:
                - number
                - size
                - files
            properties:
                number:
                    type: integer
                    example: 1
                size:
                    type: integer
                    example: 1
                files:
                    type: array
                    items:
                        $ref: '#/components/schemas/FileObject'
        FileObject:
            type: object
            description: Public file metadata. Storage provider details, object keys, and idempotency internals are not exposed.
            required:
                - id
                - purpose
                - status
                - scan_status
                - content_type
                - size
                - checksum_sha256
                - created_by
                - source
                - storage
                - created_at
                - updated_at
            properties:
                id:
                    type: string
                    example: file_2xC7k9gK5yQnZ4w8P1sT6vR3
                purpose:
                    type: string
                    example: product_image
                status:
                    type: string
                    enum: [uploading, processing, available, failed, deleted]
                scan_status:
                    type: string
                    enum: [pending, passed, failed, skipped]
                name:
                    type: string
                    example: Hero image
                filename:
                    type: string
                    example: hero.png
                content_type:
                    type: string
                    example: image/png
                size:
                    type: integer
                    format: int64
                    description: Original byte size.
                    example: 384221
                checksum_sha256:
                    type: string
                    example: 02c26c6e49b2c332c8fb95d9f6a7c4f2d9e3f1f5a63f0b1a9d2a0ba
                created_by:
                    $ref: '#/components/schemas/FileActor'
                source:
                    $ref: '#/components/schemas/FileSource'
                media:
                    $ref: '#/components/schemas/FileMedia'
                storage:
                    $ref: '#/components/schemas/PublicFileStorage'
                delivery:
                    $ref: '#/components/schemas/FileDelivery'
                latest_error:
                    $ref: '#/components/schemas/FileLatestError'
                metadata:
                    type: object
                    additionalProperties:
                        type: string
                created_at:
                    type: string
                    format: date-time
                updated_at:
                    type: string
                    format: date-time
                available_at:
                    type: string
                    format: date-time
                expires_at:
                    type: string
                    format: date-time
        FileActor:
            type: object
            properties:
                type:
                    type: string
                    example: api_key
                id:
                    type: string
                service:
                    type: string
                name:
                    type: string
                email:
                    type: string
                    format: email
        FileSource:
            type: object
            properties:
                type:
                    type: string
                    enum: [direct, upload_request, service]
                    example: direct
                service:
                    type: string
                upload_request_id:
                    type: string
                user_agent:
                    type: string
                ip:
                    type: string
        FileMedia:
            type: object
            properties:
                kind:
                    type: string
                    example: image
                width:
                    type: integer
                    format: int64
                height:
                    type: integer
                    format: int64
                duration_ms:
                    type: integer
                    format: int64
                page_count:
                    type: integer
                    format: int64
                frame_count:
                    type: integer
                    format: int64
                color_space:
                    type: string
                has_alpha:
                    type: boolean
                codec:
                    type: string
                aspect_ratio:
                    type: string
        PublicFileStorage:
            type: object
            required:
                - encoding
                - stored_size
            properties:
                encoding:
                    type: string
                    enum: [identity, br]
                    description: Encoding of the stored representation.
                stored_size:
                    type: integer
                    format: int64
                    description: Stored byte size after any lossless encoding.
        FileDelivery:
            type: object
            description: Purpose-authorized public delivery metadata for browser-rendered assets. Callers should store file IDs as canonical references and treat these URLs as render URLs.
            properties:
                public_url:
                    type: string
                    format: uri
                    description: Unsigned CDN URL for public-safe assets such as product images.
                    example: https://assets.zebo.dev/public/assets/file_2xC7k9gK5yQnZ4w8P1sT6vR3/original
                cache_control:
                    type: string
                    example: public, max-age=31536000, immutable
                content_type:
                    type: string
                    example: image/png
        FileLatestError:
            type: object
            properties:
                code:
                    type: string
                message:
                    type: string
                retryable:
                    type: boolean
                at:
                    type: string
                    format: date-time
        CreateFileLinkRequest:
            type: object
            required:
                - file_id
            properties:
                file_id:
                    type: string
                    example: file_2xC7k9gK5yQnZ4w8P1sT6vR3
                delivery:
                    $ref: '#/components/schemas/FileLinkDelivery'
                access:
                    $ref: '#/components/schemas/FileLinkAccessRequest'
                created_by:
                    $ref: '#/components/schemas/FileActor'
                custom_data:
                    type: object
                    additionalProperties:
                        type: string
                expires_at:
                    type: string
                    format: date-time
        LookupFileLinkRequest:
            type: object
            required:
                - id
            properties:
                id:
                    type: string
                    example: flink_8pQz3LkY6mN2vT9sB4cD1eF0
        PageFileLinksRequest:
            type: object
            properties:
                file_id:
                    type: string
                status:
                    type: string
                    enum: [active, revoked, expired, disabled]
                page_number:
                    type: integer
                    minimum: 1
                page_size:
                    type: integer
                    minimum: 1
        RevokeFileLinkRequest:
            type: object
            required:
                - id
            properties:
                id:
                    type: string
                revoked_by:
                    $ref: '#/components/schemas/FileActor'
        CreateFileLinkResponse:
            type: object
            properties:
                file_link:
                    $ref: '#/components/schemas/FileLinkObject'
                url:
                    type: string
                    format: uri
                    description: Public capability URL. Treat as bearer-secret material.
                error:
                    $ref: '#/components/schemas/FileApiError'
        FileLinkResponse:
            type: object
            properties:
                file_link:
                    $ref: '#/components/schemas/FileLinkObject'
                error:
                    $ref: '#/components/schemas/FileApiError'
        FileLinkPageResponse:
            type: object
            properties:
                page:
                    $ref: '#/components/schemas/FileLinkPage'
                error:
                    $ref: '#/components/schemas/FileApiError'
        FileLinkPage:
            type: object
            properties:
                number:
                    type: integer
                size:
                    type: integer
                file_links:
                    type: array
                    items:
                        $ref: '#/components/schemas/FileLinkObject'
        FileLinkObject:
            type: object
            description: Public file link metadata. Token hashes and provider URLs are not exposed.
            properties:
                id:
                    type: string
                kind:
                    type: string
                    enum: [public]
                file_id:
                    type: string
                purpose:
                    type: string
                status:
                    type: string
                    enum: [active, revoked, expired, disabled]
                active:
                    type: boolean
                delivery:
                    $ref: '#/components/schemas/FileLinkDelivery'
                access:
                    $ref: '#/components/schemas/FileLinkAccess'
                created_by:
                    $ref: '#/components/schemas/FileActor'
                revoked_by:
                    $ref: '#/components/schemas/FileActor'
                custom_data:
                    type: object
                    additionalProperties:
                        type: string
                metadata:
                    type: object
                    additionalProperties:
                        type: string
                created_at:
                    type: string
                    format: date-time
                updated_at:
                    type: string
                    format: date-time
                expires_at:
                    type: string
                    format: date-time
                revoked_at:
                    type: string
                    format: date-time
        FileLinkDelivery:
            type: object
            properties:
                mode:
                    type: string
                    enum: [redirect, download, inline]
                    default: download
                filename:
                    type: string
                content_type:
                    type: string
                disposition:
                    type: string
        FileLinkAccessRequest:
            type: object
            properties:
                max_accesses:
                    type: integer
                    format: int64
                allow_download:
                    type: boolean
                allowed_origins:
                    type: array
                    items:
                        type: string
                allowed_ip_ranges:
                    type: array
                    items:
                        type: string
        FileLinkAccess:
            type: object
            properties:
                max_accesses:
                    type: integer
                    format: int64
                access_count:
                    type: integer
                    format: int64
                last_accessed_at:
                    type: string
                    format: date-time
                allow_download:
                    type: boolean
                allowed_origins:
                    type: array
                    items:
                        type: string
