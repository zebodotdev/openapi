                                    error:
                                        $ref: '#/components/schemas/Error'
    /balance_transactions/page:
        post:
            summary: Page through balance transactions
            description: |
                Retrieve a paginated list of balance transactions for the authenticated application.
                Transactions are sorted by created_at in descending order, so page 1 always contains
                the most recent activity.
            operationId: pageBalanceTransactions
            tags:
                - Balance Transactions
            requestBody:
                required: false
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                page_number:
                                    type: integer
                                    minimum: 0
                                    maximum: 10
                                    description: Page index to fetch (0-10 inclusive)
                                    default: 0
                                page_size:
                                    type: integer
                                    minimum: 1
                                    maximum: 256
                                    description: Number of transactions per page (1-256)
            responses:
                '200':
                    description: Page retrieved successfully
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    page:
                                        type: object
                                        properties:
                                            number:
                                                type: integer
                                                description: The page number returned
                                            size:
                                                type: integer
                                                description: The number of transactions in this page
                                            transactions:
                                                type: array
                                                items:
                                                    type: object
                                                    properties:
                                                        id:
                                                            type: string
                                                            description: Unique identifier for the balance transaction
                                                        payment_id:
                                                            type: string
                                                            description: Associated payment ID
                                                        payout_id:
                                                            type: string
                                                            description: Associated payout ID (if paid out)
                                                        order_id:
                                                            type: string
                                                            description: Associated order ID
                                                        amount:
                                                            type: object
                                                            properties:
                                                                currency:
                                                                    type: string
                                                                    description: Three-letter currency code
                                                                value:
                                                                    type: integer
                                                                    description: Amount in smallest currency unit
                                                        created_at:
                                                            type: string
                                                            format: date-time
                                                            description: When the transaction was created
                                                        available_at:
                                                            type: string
                                                            format: date-time
                                                            description: When the funds become available for payout
                                                        paid_at:
                                                            type: string
                                                            format: date-time
                                                            description: When the transaction was paid out
                '401':
                    description: Unauthorized - invalid or missing API key
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                '422':
                    description: Unprocessable entity - invalid parameters
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'

    /payouts/schedule:
        post:
            summary: Schedule a payout
            description: |
                Create and schedule a payout to move funds from your available balance to a
                connected financial account. The request chooses the destination, caps the
                maximum amount that may leave your balance, and optionally delays execution
                until a future timestamp.
            operationId: schedulePayout
            tags:
                - Payouts
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            required:
                                - destination_id
                                - max_amount
                                - reference
                            properties:
                                destination_id:
                                    type: string
                                    description: Financial account that should receive the payout
                                    example: "fa_1234567890abcdef"
                                execute_after:
                                    type: string
                                    format: date-time
                                    description: Optional future time after which execution may begin
                                    example: "2026-08-05T09:00:00Z"
                                max_amount:
                                    type: integer
                                    minimum: 1
                                    description: Maximum amount, in the smallest currency unit, that this payout may transfer
                                    example: 250000
                                reference:
                                    type: string
                                    description: Merchant reference carried on the payout
                                    example: "PAYOUT-APR-15"
            responses:
                '200':
                    description: Payout scheduled successfully
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    payout:
                                        $ref: '#/components/schemas/Payout'
                '400':
                    description: Bad request - invalid schedule parameters
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                '401':
                    description: Unauthorized - Missing or invalid authentication
                '500':
                    description: Internal server error - payout scheduling failed unexpectedly
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
    /payouts/lookup:
        post:
            summary: Lookup a payout
            description: |
                Retrieve the current state of a payout by ID. Use this to monitor execution,
                inspect timestamps, review bundled balance transactions, and reconcile the
                final amount that moved to the destination account.
            operationId: lookupPayout
            tags:
                - Payouts
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            required:
                                - payout_id
                            properties:
                                payout_id:
                                    type: string
                                    description: Payout identifier returned when the payout was created
                                    example: "po_yQ2wXm5Dc7Pk9Ls1Vn0RgHaB"
            responses:
                '200':
                    description: Payout found successfully
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    payout:
                                        $ref: '#/components/schemas/Payout'
                '400':
                    description: Bad request - invalid payout identifier
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                '401':
                    description: Unauthorized - Missing or invalid authentication
                '500':
                    description: Internal server error - payout lookup failed unexpectedly
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
    /payouts/set_destinations:
        post:
            summary: Set payout destinations
            description: |
                Configure which financial account should be used for payouts in each currency.
                This endpoint accepts a map of currency codes to financial account IDs. Each financial
                account must be owned by your application, have push operations enabled, and its currency
                must match the currency key in the destinations map.
            operationId: setPayoutDestinations
            tags:
                - Payouts
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            required:
                                - destinations
                            properties:
                                destinations:
                                    type: object
                                    description: Map of currency codes to financial account IDs
                                    additionalProperties:
                                        type: string
                                    example:
                                        ghs: "fa_1234567890abcdef"
                                        usd: "fa_0987654321fedcba"
            responses:
                '200':
                    description: Payout destinations set successfully
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    settings:
                                        $ref: '#/components/schemas/PayoutSettings'
                '401':
                    description: Unauthorized - Missing or invalid authentication
                '422':
                    description: Unprocessable Entity - Invalid request parameters (e.g., currency not supported, financial account not found, financial account is disconnected, push not enabled, currency mismatch)
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    error:
                                        $ref: '#/components/schemas/Error'
    /payouts/settings:
        post:
            summary: Get payout settings
            description: |
                Retrieve the current payout settings for your application, including configured
                payout destinations and schedule information.
            operationId: getPayoutSettings
            tags:
                - Payouts
            requestBody:
                required: false
                content:
                    application/json:
                        schema:
                            type: object
                            description: No request body required
                            properties: {}
            responses:
                '200':
                    description: Payout settings retrieved successfully
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    settings:
                                        $ref: '#/components/schemas/PayoutSettings'
                '401':
                    description: Unauthorized - Missing or invalid authentication
                '422':
                    description: Unprocessable Entity - Error retrieving settings
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    error:
                                        $ref: '#/components/schemas/Error'
    /payouts/disable:
        post:
            summary: Disable automatic payouts
            description: |
                Disables automatic payouts for your application by switching the payout schedule
                to manual mode. When automatic payouts are disabled, the system will not
                automatically schedule payouts - you must manually trigger them using the
                /payouts/schedule endpoint. Balance transactions must still be at least 7 days
                old before they can be paid out, but the payout will only occur when you
                explicitly request it.
            operationId: disableAutomaticPayouts
            tags:
                - Payouts
            requestBody:
                required: false
                content:
                    application/json:
                        schema:
                            type: object
                            description: No request body required
                            properties: {}
            responses:
                '200':
                    description: Automatic payouts disabled successfully
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    settings:
                                        $ref: '#/components/schemas/PayoutSettings'
                                example:
                                    settings:
                                        id: "ps_1234567890abcdef"
                                        schedule:
                                            id: "PAYOUT_SCHEDULE_MANUAL_11_21_2025"
                                            name: "manual"
                                            type: "manual"
                                            interval: "manual"
                                            schedule_on: "never"
                                            description: "Manual payout schedule. Used when automatic payouts are disabled."
                                            spec:
                                                id: "PAYOUT_SCHEDULE_SPEC_MANUAL_11_21_2025"
                                                t_plus: "168h"
                                                label: "manual"
                                                abide: "strictly"
                                        destinations:
                                            ghs: "fa_1234567890abcdef"
                '401':
                    description: Unauthorized - Missing or invalid authentication
                '422':
                    description: Unprocessable Entity - Error disabling automatic payouts
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    error:
                                        $ref: '#/components/schemas/Error'

    /payouts/enable:
        post:
            summary: Enable automatic payouts
            description: |
                Re-enable automatic payouts for your application. Commerce restores the
                configured automatic payout schedule so eligible balance transactions can be
                queued without a manual scheduling request.
            operationId: enableAutomaticPayouts
            tags:
                - Payouts
            requestBody:
                required: false
                content:
                    application/json:
                        schema:
                            type: object
                            description: No request body required
                            properties: {}
            responses:
                '200':
                    description: Automatic payouts enabled successfully
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    settings:
                                        $ref: '#/components/schemas/PayoutSettings'
                '401':
                    description: Unauthorized - Missing or invalid authentication
                '422':
                    description: Unprocessable Entity - Error enabling automatic payouts
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    error:
                                        $ref: '#/components/schemas/Error'
    /payouts/enable_fx:
        post:
            summary: Enable foreign exchange for payouts
            description: |
                Enables foreign exchange (FX) conversion for payouts. When FX is enabled,
                Commerce can automatically convert payout funds from one currency to another
                when routing to destination accounts. This allows you to consolidate multiple
                currencies into a single operating account or hold funds in a preferred currency.

                With FX disabled (default), payouts only transfer funds to accounts matching
                the transaction currency. For example, GHS balance can only be paid out to
                GHS accounts. With FX enabled, GHS balance can be converted and paid out to
                USD accounts.

                Important: FX conversion incurs additional fees beyond standard payout fees,
                and exchange rates are determined at payout execution time. Not all currency
                pairs are supported. FX-enabled payouts require approval and special configuration.
            operationId: enableFx
            tags:
                - Payouts
            requestBody:
                required: false
                content:
                    application/json:
                        schema:
                            type: object
                            description: No request body required
                            properties: {}
            responses:
                '200':
                    description: FX enabled successfully
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    settings:
                                        $ref: '#/components/schemas/PayoutSettings'
                                example:
                                    settings:
                                        id: "ps_1234567890abcdef"
                                        fx_enabled: true
                                        schedule:
                                            id: "PAYOUT_SCHEDULE_WEEKLY_11_21_2025"
                                            name: "weekly"
                                            type: "automatic"
                                            interval: "weekly"
                                            schedule_on: "sunday"
                                            description: "Automatic weekly payout. Default."
                                            spec:
                                                id: "PAYOUT_SCHEDULE_SPEC_WEEKLY_11_21_2025"
                                                t_plus: "168h"
                                                label: "weekly"
                                                abide: "strictly"
                                        destinations:
                                            ghs: "fa_1234567890abcdef"
                                            usd: "fa_abcdef1234567890"
                '401':
                    description: Unauthorized - Missing or invalid authentication
                '422':
                    description: Unprocessable Entity - Error enabling FX
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    error:
                                        $ref: '#/components/schemas/Error'
    /payouts/disable_fx:
        post:
            summary: Disable foreign exchange for payouts
            description: |
                Disables foreign exchange (FX) conversion for payouts. When FX is disabled,
                Commerce will only transfer payout funds to destination accounts that match
                the transaction currency. Currency mismatch will result in payout failure.

                With FX disabled (default behavior), GHS balance can only be paid out to
                GHS accounts, USD balance only to USD accounts, and so on. This is the
                recommended configuration unless you have a specific need for multi-currency
                consolidation or cross-currency payouts.

                Disabling FX helps avoid unexpected conversion fees and ensures payouts
                maintain their original currency. This endpoint sets fx_enabled to false
                in your payout settings.
            operationId: disableFx
            tags:
                - Payouts
            requestBody:
                required: false
                content:
                    application/json:
                        schema:
                            type: object
                            description: No request body required
                            properties: {}
            responses:
                '200':
                    description: FX disabled successfully
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    settings:
                                        $ref: '#/components/schemas/PayoutSettings'
                                example:
                                    settings:
                                        id: "ps_1234567890abcdef"
                                        fx_enabled: false
                                        schedule:
                                            id: "PAYOUT_SCHEDULE_WEEKLY_11_21_2025"
                                            name: "weekly"
                                            type: "automatic"
                                            interval: "weekly"
                                            schedule_on: "sunday"
                                            description: "Automatic weekly payout. Default."
                                            spec:
                                                id: "PAYOUT_SCHEDULE_SPEC_WEEKLY_11_21_2025"
                                                t_plus: "168h"
                                                label: "weekly"
                                                abide: "strictly"
                                        destinations:
                                            ghs: "fa_1234567890abcdef"
                '401':
                    description: Unauthorized - Missing or invalid authentication
                '422':
                    description: Unprocessable Entity - Error disabling FX
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    error:
                                        $ref: '#/components/schemas/Error'
    /payouts/page:
        post:
            summary: Page through payouts
            description: |
                Retrieve a paginated list of the most recent payouts for the authenticated application.
                Payouts are sorted by initiated_at in descending order, so page 1 always contains
                the freshest activity and subsequent pages step back in time.
            operationId: pagePayouts
            tags:
                - Payouts
            requestBody:
                required: false
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                page_number:
                                    type: integer
                                    minimum: 1
                                    maximum: 10
                                    description: 1-based page index to fetch (1-10 inclusive)
                                    default: 1
                                page_size:
                                    type: integer
                                    minimum: 1
                                    maximum: 256
                                    description: Number of payouts per page (1-256)
            responses:
                '200':
                    description: Page retrieved successfully
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    page:
                                        type: object
                                        properties:
                                            number:
                                                type: integer
                                                description: The page number returned
                                            size:
                                                type: integer
                                                description: The number of payouts in this page
                                            payouts:
                                                type: array
                                                items:
                                                    type: object
                                                    properties:
                                                        id:
                                                            type: string
                                                            description: Unique identifier for the payout
                                                        application_id:
                                                            type: string
                                                            description: Application that initiated the payout
                                                        destination_id:
                                                            type: string
                                                            description: Financial account receiving the funds
                                                        amount:
                                                            type: object
                                                            properties:
                                                                value:
                                                                    type: integer
                                                                    description: Amount in smallest currency unit
                                                                currency:
                                                                    type: string
                                                                    description: Three-letter currency code
                                                        status:
                                                            type: string
                                                            description: Current status of the payout
                                                        initiated_by:
                                                            type: string
                                                            description: How the payout was initiated (automatic or manual)
                                                        latest_attempt_id:
                                                            type: string
                                                            description: ID of the most recent execution attempt
                                                        latest_error:
                                                            type: object
                                                            description: Most recent error if payout failed
                                                            properties:
                                                                type:
                                                                    type: string
                                                                    description: Error type
                                                                message:
                                                                    type: string
                                                                    description: Error message
                                                                cause:
                                                                    type: string
                                                                    description: Root cause of the error
                                                                occurred_at:
                                                                    type: string
                                                                    format: date-time
                                                                    description: When the error occurred
                                                        initiated_at:
                                                            type: string
                                                            format: date-time
                                                            description: When the payout was initiated
                                                        expected_at:
                                                            type: string
                                                            format: date-time
                                                            description: Expected execution time (if scheduled)
                                                        succeeded_at:
                                                            type: string
                                                            format: date-time
                                                            description: When the payout succeeded (if applicable)
                                                        balance_transaction_ids:
                                                            type: array
                                                            items:
                                                                type: string
                                                            description: Balance transactions included in this payout
                '401':
                    description: Unauthorized - invalid or missing API key
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                '422':
                    description: Unprocessable entity - invalid parameters
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
    /payouts/cancel:
        post:
            summary: Cancel a scheduled payout
            description: |
                Cancel a scheduled payout before it executes. Only payouts in `scheduled` status
                with a future `execute_after` time can be canceled. Once canceled, the payout is
                permanently stopped and the balance transactions that would have been bundled into
                it remain in your available balance for future payouts.

                A payout that has already started executing, completed, or whose execution window
                has passed cannot be canceled.
            operationId: cancelPayout
            tags:
                - Payouts
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            required:
                                - payout_id
                            properties:
                                payout_id:
                                    type: string
                                    description: ID of the scheduled payout to cancel. Must be in `scheduled` status with a future `execute_after` time.
                                    example: "po_yQ2wXm5Dc7Pk9Ls1Vn0RgHaB"
            responses:
                '200':
                    description: Payout canceled successfully
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    payout:
                                        type: object
                                        properties:
                                            amount:
                                                type: object
                                                nullable: true
                                                description: Actual transferred amount. null until the payout succeeds.
                                                properties:
                                                    currency:
                                                        type: string
                                                        description: Three-letter currency code
                                                    value:
                                                        type: integer
                                                        description: Amount in smallest currency unit
                                            canceled_at:
                                                type: string
                                                format: date-time
                                                description: When the payout was canceled
                                            destination_id:
                                                type: string
                                                description: Financial account that would have received the funds
                                            execute_after:
                                                type: string
                                                format: date-time
                                                description: The originally scheduled execution time
                                            id:
                                                type: string
                                                description: Unique identifier for the payout
                                            initiated_at:
                                                type: string
                                                format: date-time
                                                description: When the payout was created
                                            initiated_by:
                                                type: string
                                                description: How the payout was initiated (automatic or manual)
                                            max_amount:
                                                type: object
                                                description: Maximum amount authorized for this payout
                                                properties:
                                                    currency:
                                                        type: string
                                                        description: Three-letter currency code
                                                    value:
                                                        type: integer
                                                        description: Amount in smallest currency unit
                                            scheduled_at:
                                                type: string
                                                format: date-time
                                                nullable: true
                                                description: When the payout was queued for execution
                                            status:
                                                type: string
                                                description: Payout status, will be `canceled`
                                                example: "canceled"
                '401':
                    description: Unauthorized - Missing or invalid authentication
                '422':
                    description: Unprocessable Entity - Invalid request parameters (e.g., payout not found, already canceled, not in scheduled status, execution time already passed)
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    error:
                                        $ref: '#/components/schemas/Error'
    /files/create:
