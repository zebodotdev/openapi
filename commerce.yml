                    example: or_0123456789abcdefghijklmnopqrstuvwxyzABCD
                reason:
                    $ref: '#/components/schemas/RefundReason'
                reason_details:
                    type: string
                    maxLength: 2048
                    description: Overall explanation. Required when `reason` is `custom`.
                reference:
                    type: string
                    maxLength: 256
                    description: Your reconciliation reference.
                request_meta:
                    $ref: '#/components/schemas/RefundRequestMeta'
        CancelRefundRequest:
            type: object
            additionalProperties: false
            required: [refund_id]
            properties:
                refund_id:
                    type: string
                    description: Refund to cancel before processing begins.
                    example: rf_1234567890ABCDEFGHIJKLMNOPQRSTUVWXYZabcd
                request_meta:
                    $ref: '#/components/schemas/RefundRequestMeta'
        LookupRefundRequest:
            type: object
            additionalProperties: false
            required: [refund_id]
            properties:
                refund_id:
                    type: string
                    description: Refund identifier to retrieve.
                    example: rf_1234567890ABCDEFGHIJKLMNOPQRSTUVWXYZabcd
        PageRefundsRequest:
            type: object
            additionalProperties: false
            required: [page_number]
            properties:
                page_number:
                    type: integer
                    minimum: 1
                    maximum: 10
                    description: One-based page number.
                page_size:
                    type: integer
                    minimum: 1
                    maximum: 256
                    default: 256
                    description: Maximum number of refunds to return.
        RefundLineItem:
            type: object
            required: [id, order_line_item_id, original_amount_paid, refund_amount]
            properties:
                id:
                    type: string
                    description: Server-generated refund line-item identifier.
                order_line_item_id:
                    type: string
                original_amount_paid:
                    $ref: '#/components/schemas/RefundMoney'
                reason:
                    $ref: '#/components/schemas/RefundReason'
                reason_details:
                    type: string
                    maxLength: 2048
                refund_amount:
                    $ref: '#/components/schemas/RefundMoney'
        Refund:
            type: object
            required: [created_at, id, line_items, order_id, reason, status, total]
            properties:
                canceled_at:
                    type: string
                    format: date-time
                    description: Omitted unless the refund was canceled before processing began.
                created_at:
                    type: string
                    format: date-time
                custom_data:
                    type: object
                    additionalProperties:
                        type: string
                    description: Omitted when empty.
                failed_at:
                    type: string
                    format: date-time
                    description: Omitted unless processing failed.
                id:
                    type: string
                line_items:
                    type: array
                    description: One or more immutable line-level refund allocations.
                    items:
                        $ref: '#/components/schemas/RefundLineItem'
                order_id:
                    type: string
                processing_at:
                    type: string
                    format: date-time
                    description: Omitted until processing starts.
                reason:
                    $ref: '#/components/schemas/RefundReason'
                reason_details:
                    type: string
                    maxLength: 2048
                reference:
                    type: string
                status:
                    type: string
                    enum: [canceled, failed, pending, processing, succeeded]
                succeeded_at:
                    type: string
                    format: date-time
                    description: Omitted unless processing succeeded.
                total:
                    $ref: '#/components/schemas/RefundMoney'
        RefundResponse:
            type: object
            required: [refund]
            properties:
                refund:
                    $ref: '#/components/schemas/Refund'
        RefundPage:
            type: object
            required: [number, refunds, size]
            properties:
                number:
                    type: integer
                    minimum: 1
                refunds:
                    type: array
                    items:
                        $ref: '#/components/schemas/Refund'
                size:
                    type: integer
                    minimum: 0
                    description: Number of refunds returned in this page.
        RefundPageResponse:
            type: object
            required: [page]
            properties:
                page:
                    $ref: '#/components/schemas/RefundPage'
        BalanceSnapshotResponse:
            type: object
            required: [balances]
            properties:
                balances:
                    type: object
                    required: [ghs]
                    properties:
                        ghs:
                            $ref: '#/components/schemas/CurrencyBalanceSnapshot'
        CurrencyBalanceSnapshot:
            type: object
            required: [available, includes_transactions_before, pending, refund, reserved]
            properties:
                available:
                    $ref: '#/components/schemas/BalanceValue'
                includes_transactions_before:
                    type: string
                    format: date-time
                    description: The snapshot includes transactions created before this timestamp
                pending:
                    $ref: '#/components/schemas/BalanceValue'
                refund:
                    allOf:
                        - $ref: '#/components/schemas/BalanceValue'
                    description: Funds assigned to refund activity at the snapshot cutoff
                reserved:
                    allOf:
                        - $ref: '#/components/schemas/BalanceValue'
                    description: Funds held back from payout at the snapshot cutoff
        BalanceValue:
            type: object
            required: [amount]
            properties:
                amount:
                    type: integer
                    minimum: 0
                    description: Amount in the currency's smallest unit
                    example: 145000
        BalanceTransactionAmount:
            type: object
            required: [currency, value]
            properties:
                currency:
                    type: string
                    description: Currency code as stored on the transaction
                    example: GHS
                value:
                    type: integer
                    minimum: 0
                    description: Unsigned amount in the currency's smallest unit
                    example: 20000
        BalanceTransaction:
            type: object
            required: [amount, created_at, id, order_id]
            properties:
                amount:
                    $ref: '#/components/schemas/BalanceTransactionAmount'
                available_at:
                    type: string
                    format: date-time
                claimed_at:
                    type: string
                    format: date-time
                created_at:
                    type: string
                    format: date-time
                id:
                    type: string
                order_id:
                    type: string
                paid_at:
                    type: string
                    format: date-time
                payment_id:
                    type: string
                    description: Omitted for transactions created from a refund
                payout_id:
                    type: string
                refund_id:
                    type: string
        BalanceTransactionResponse:
            type: object
            required: [transaction]
            properties:
                transaction:
                    $ref: '#/components/schemas/BalanceTransaction'
        BalanceTransactionPageResponse:
            type: object
            required: [page]
            properties:
                page:
                    type: object
                    required: [number, size]
                    properties:
                        number:
                            type: integer
                        size:
                            type: integer
                            minimum: 0
                        transactions:
                            type: array
                            description: Newest transactions first. Omitted when the page is empty.
                            items:
                                $ref: '#/components/schemas/BalanceTransaction'
        FinancialAccountCreateRequest:
