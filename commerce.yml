                            schema:
                                $ref: '#/components/schemas/ErrorEnvelope'
                '401':
                    description: Unauthorized - missing or invalid API key
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorEnvelope'
                '422':
                    description: Balance snapshot could not be retrieved
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorEnvelope'
