    /orders/update:
        post:
            summary: Update an order
            description: |
                Updates mutable fields on an existing order and returns the same response shape as
                `/orders/lookup`.

                Use this endpoint to replace the order's full line item set, update the order number,
                receipt number, invoice settings, or statement descriptor, replace order-level `custom_data`,
                switch to a different saved payment method, tokenize a new payment method, clear the current
                payment method, or explicitly open, seal, or reseal the order via `finalize`.

                `line_items` is a full replacement field, not a sparse merge. `payment_method_id`,
                `payment_method_data`, and `clear_payment_method` are mutually exclusive. `custom_data`
                is metadata-only and does not require reopen or reseal by itself. Completed, paid,
                canceled, and expired orders cannot be updated.

                When mutating seal-sensitive fields on a sealed order, set `finalize: false` to
                reopen the order and leave it editable, or set `finalize: true` to apply the changes
                and reseal in the same request. If payment confirmation or execution has already
                started, Commerce rejects edits that would change the order's economics or payment
                configuration.
            operationId: updateOrder
            tags:
                - Orders
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            required:
                                - order_id
                            properties:
                                clear_payment_method:
                                    type: boolean
                                    description: |
                                        Clears the currently attached payment method. Mutually exclusive with
                                        `payment_method_id` and `payment_method_data`.
                                    default: false
                                custom_data:
                                    type: object
                                    additionalProperties:
                                        type: string
                                    description: |
                                        Replacement order-level custom data. This is metadata-only and does not
                                        require reopening or resealing the order by itself. Provide `{}` to clear
                                        existing custom data.
                                invoice_settings:
                                    $ref: '#/components/schemas/InvoiceSettings'
                                finalize:
                                    type: boolean
                                    description: |
                                        Explicit seal decision. Set to `false` to reopen a sealed order and leave it
                                        open, or `true` to seal or reseal the order after applying the requested
                                        mutations.
                                line_items:
                                    type: array
                                    description: |
                                        Full replacement for the order's line items. Omit this field to keep the
                                        current line items unchanged.
                                    items:
                                        $ref: '#/components/schemas/LineItem'
                                number:
                                    type: string
                                    description: Replacement order number.
                                    example: "ORDER-12345-REV2"
                                receipt_number:
                                    type: string
                                    description: |
                                        Replacement receipt number. Once set, it cannot be unset; provide a
                                        different non-empty value to change it. No uniqueness is enforced.
                                    example: "RCPT-12345-REV2"
                                order_id:
                                    type: string
                                    description: Unique identifier of the order to update.
                                    example: "or_48ZW7BGvYUBWc1i6WBkL2jr0iPQP5jUy76mmmHpt"
                                payment_method_data:
                                    allOf:
                                        - $ref: '#/components/schemas/PaymentMethodData'
                                    description: |
                                        New payment method details to tokenize and attach to the order. Currently
                                        only `mobile_money` is supported for order updates. When using inline mobile
                                        money details, include `billing_details.name` and
                                        `billing_details.address.country`.
                                payment_method_id:
                                    type: string
                                    description: |
                                        ID of a saved payment method to attach to the order. Mutually exclusive
                                        with `payment_method_data` and `clear_payment_method`.
                                    example: "pm_xyz123abc456"
                                statement_descriptor:
                                    type: string
                                    description: Replacement payment statement descriptor for the order's payment.
                                    example: "ORDER 12345"
                                    maxLength: 22
                                statement_descriptor_prefix:
                                    type: string
                                    description: Static prefix used to build the replacement descriptor as `prefix*order_id`. Mutually exclusive with `statement_descriptor`.
                                    example: "LINE"
                                    minLength: 2
                                    maxLength: 10
            responses:
                '200':
                    description: Order updated successfully
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    order:
                                        $ref: '#/components/schemas/Order'
                '400':
                    description: Bad request - invalid parameters or mutation precondition not met
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                '401':
                    description: Unauthorized - invalid or missing API key
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                '404':
                    description: Order not found
    /orders/pay:
        post:
            summary: Pay for an order
            description: |
                Initiates payment for an existing order. Supports two payment flows:
                1. Use saved payment method: Provide only `order_id` to charge a previously saved payment method
                2. Provide new payment details: Include `payment_method_data` with payment information
            operationId: payOrder
            tags:
                - Orders
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            required:
                                - order_id
                            properties:
                                order_id:
                                    type: string
                                    description: Unique identifier of the order to pay
                                    example: "GKj7A8lM5wEGRUvbqpI4bkDFsQvpqVyh5fqePNnb"
                                payment_method_data:
                                    $ref: '#/components/schemas/PaymentMethodData'
                                payment_method_id:
                                    type: string
                                    description: ID of a saved payment method to use for this payment
                                    example: "pm_xyz123abc456"
                                paid_out_of_band:
                                    type: boolean
                                    description: |
                                        Set to true if payment was received outside Commerce (cash, bank transfer, check).
                                        Marks the payment as paid offline. Mutually exclusive with payment_method_id and
                                        payment_method_data. Defaults to false.
                                    default: false
                                    example: false
            responses:
                '200':
                    description: Payment initiated successfully
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/PaymentResponse'
                '400':
                    description: Bad request - invalid parameters
                '404':
                    description: Order not found
    /orders/confirm_payment:
        post:
            summary: Confirm payment with token
            description: Confirms a pending payment using a verification token (e.g., OTP sent to customer's phone)
            operationId: confirmPayment
