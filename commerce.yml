                    description: Refund page lookup failed unexpectedly
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorEnvelope'
                '503':
                    description: Refund page lookup hit a transient dependency failure
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorEnvelope'
    /apps/create:
        post:
            summary: Create an application
            description: Creates a Commerce application, initial secret key, and direct parent-child relationship for the authenticated creator app.
            operationId: createApplication
            tags:
                - Apps
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            additionalProperties: false
                            required:
                                - name
                            properties:
                                name:
                                    type: string
                                    description: Display name for the application.
                                alias:
                                    type: string
                                    description: Optional short name for the application.
                                description:
                                    type: string
                                    description: Optional application description.
                                legal_entity_type:
                                    type: string
                                    description: Caller-defined legal-entity label. Common values are `government`, `non_profit`, `business`, and `individual`.
                                placement_parent_application_id:
                                    type: string
                                    description: Optional application under which the new app should be placed.
                                relationship_policy:
                                    type: object
                                    additionalProperties: false
                                    description: Optional direct-placement relationship policy. Omitted values default to parent management and child credentials.
                                    properties:
                                        child_standing:
                                            type: string
                                            description: Initial standing assigned to the child in this relationship.
                                        management:
                                            type: string
                                            enum:
                                                - parent
                                                - child
                                            default: parent
                                            description: Who can manage the child app and its resources through this relationship.
                                        credentials:
                                            type: string
                                            enum:
                                                - child
                                                - parent
                                            default: child
                                            description: Who can create, rotate, or disable the child app's API keys after creation. Defaults to child. In V1, apps/create still returns the initial child key to the caller.
            responses:
                '200':
                    description: Application created successfully.
                    content:
                        application/json:
                            schema:
                                type: object
                                required:
                                    - app
                                properties:
                                    app:
                                        type: object
                                        required:
                                            - id
                                            - name
                                            - created_at
                                        properties:
                                            id:
                                                type: string
                                            name:
                                                type: string
                                            alias:
                                                type: string
                                            description:
                                                type: string
                                            created_at:
                                                type: string
                                                format: date-time
                                            secret_key:
                                                type: object
                                                properties:
                                                    id:
                                                        type: string
                                                    token_type:
                                                        type: string
                                                    issued_at:
                                                        type: string
                                                        format: date-time
                                                    token:
                                                        type: string
                                            relationship:
                                                type: object
                                                description: Relationship receipt for the created child app.
                                                required: [actor_app_id, child_app_id, child_standing, created_at, creator_app_id, id, kind, placement_parent_app_id, policy_version, relationship_policy, retained_creator_authority_exists, status, subject_app_id]
                                                properties:
                                                    id:
                                                        type: string
                                                    kind:
                                                        type: string
                                                        enum:
                                                            - placement
                                                    policy_version:
                                                        type: string
                                                        example: app_relationship_authority.v1
                                                    status:
                                                        type: string
                                                        enum:
                                                            - active
                                                            - inactive
                                                            - suspended
                                                            - revoked
                                                    actor_app_id:
                                                        type: string
                                                    creator_app_id:
                                                        type: string
                                                    placement_parent_app_id:
                                                        type: string
                                                    subject_app_id:
                                                        type: string
                                                    child_app_id:
                                                        type: string
                                                    child_standing:
                                                        type: string
                                                    relationship_policy:
                                                        type: object
                                                        required: [child_standing, credentials, management]
                                                        properties:
                                                            child_standing:
                                                                type: string
                                                            management:
                                                                type: string
                                                                enum:
                                                                    - parent
                                                                    - child
                                                            credentials:
                                                                type: string
                                                                enum:
                                                                    - child
                                                                    - parent
                                                    retained_creator_authority_exists:
                                                        type: boolean
                                                    created_at:
                                                        type: string
                                                        format: date-time
                '401':
                    description: Unauthorized - invalid or missing API key
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                '422':
                    description: Unprocessable entity - invalid parameters
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
    /apps/lookup:
        post:
            summary: Retrieve the authenticated application
            description: Retrieves the application associated with the API key used to authenticate the request.
            operationId: lookupApplication
            tags:
                - Apps
            responses:
                '200':
                    description: Application retrieved successfully.
                    content:
                        application/json:
                            schema:
                                type: object
                                required:
                                    - app
                                properties:
                                    app:
                                        type: object
                                        required:
                                            - id
                                            - name
                                            - created_at
                                        properties:
                                            id:
                                                type: string
                                            name:
                                                type: string
                                            alias:
                                                type: string
                                            description:
                                                type: string
                                            created_at:
                                                type: string
                                                format: date-time
                                            updated_at:
                                                type: string
                                                format: date-time
                                            archived_at:
                                                type: string
                                                format: date-time
                '401':
                    description: Unauthorized - invalid or missing API key
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                '422':
                    description: Unprocessable entity
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
    /apps/update:
        post:
            summary: Update the authenticated application
            description: Updates one or more mutable attributes of the application associated with the API key used to authenticate the request.
            operationId: updateApplication
            tags:
                - Apps
            parameters:
                - $ref: '#/components/parameters/IdempotencyKey'
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            minProperties: 1
                            additionalProperties: false
                            properties:
                                name:
                                    type: string
                                    description: Display name for the application. Cannot be empty.
                                alias:
                                    type: string
                                    description: Short name for the application. Use an empty string to clear it.
                                description:
                                    type: string
                                    description: Application description. Use an empty string to clear it.
                                legal_entity_type:
                                    type: string
                                    description: Caller-defined legal-entity label. Send an empty string to clear it.
            responses:
                '200':
                    description: Application updated successfully.
                    content:
                        application/json:
                            schema:
                                type: object
                                required:
                                    - app
                                properties:
                                    app:
                                        type: object
                                        required:
                                            - id
                                            - name
                                            - created_at
                                        properties:
                                            id:
                                                type: string
                                            name:
                                                type: string
                                            alias:
                                                type: string
                                            description:
                                                type: string
                                            created_at:
                                                type: string
                                                format: date-time
                                            updated_at:
                                                type: string
                                                format: date-time
                '401':
                    description: Unauthorized - invalid or missing API key
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                '422':
                    description: Unprocessable entity - invalid parameters
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
    /keys/generate:
        post:
            summary: Generate a secret key
            description: |
                Generates a new active secret key for the authenticated application. The full bearer
                token is returned only in this response and cannot be retrieved later. Store it before
                returning success from your provisioning flow. Existing keys remain active, and this
                operation is not idempotent: retrying an uncertain request can create another key.
            operationId: generateSecretKey
            tags:
                - API Keys
            requestBody:
                required: false
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/GenerateSecretKeyRequest'
            responses:
                '200':
                    description: Secret key generated successfully.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/GenerateSecretKeyResponse'
                '401':
