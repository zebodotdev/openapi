                    additionalProperties:
                        type: string
                dimensions:
                    $ref: '#/components/schemas/ProductDimensions'
                prices:
                    type: array
                    items:
                        $ref: '#/components/schemas/ProductPriceSummary'
                unit_dim:
                    type: string
                created_at:
                    type: string
                    format: date-time
                updated_at:
                    type: string
                    format: date-time
        CreatePurchaseIntentRequest:
            type: object
            required:
                - quantity
            allOf:
                - oneOf:
                    - required:
                        - product
                    - required:
                        - product_id
                - oneOf:
                    - required:
                        - price
                    - required:
                        - price_id
            properties:
                product:
                    type: object
                    description: Product selection with optional variant-set configuration. Use this instead of product_id.
                    required:
                        - id
                    properties:
                        id:
                            type: string
                            description: Product ID to sell through the Buy link
                            example: "prod_abc123"
                        variant_set_id:
                            type: string
                            description: Optional variant set ID the hosted checkout may use for sibling product selection
                            example: "pg_variantset123"
                product_id:
                    type: string
                    description: App-owned product ID to sell through the Buy link when not using product
                    example: "prod_abc123"
                price:
                    type: object
                    description: Price selection for the Buy link. Send exactly one of id or nominal and at most one of original or original_id.
                    allOf:
                        - oneOf:
                            - required:
                                - id
                            - required:
                                - nominal
                        - not:
                            properties:
                                original: {}
                                original_id: {}
                            required:
                                - original
                                - original_id
                    properties:
                        id:
                            type: string
                            description: Active, unarchived app-owned price ID that belongs to the selected product
                            example: "pr_xyz789"
                        nominal:
                            type: object
                            description: Inline offer amount when no price ID is provided
                            required:
                                - currency
                                - value
                            properties:
                                currency:
                                    type: string
                                    minLength: 1
                                    description: Non-empty currency code, normalized to lowercase
                                    example: "ghs"
                                value:
                                    type: integer
                                    minimum: 1
                                    description: Amount in smallest currency unit
                                    example: 85000
                        original:
                            type: object
                            description: Optional original price used for comparison display
                            allOf:
                                - oneOf:
                                    - required:
                                        - id
                                    - required:
                                        - nominal
                            properties:
                                id:
                                    type: string
                                    description: App-owned comparison price ID that belongs to the selected product
                                    example: "pr_original123"
                                nominal:
                                    type: object
                                    description: Inline original price amount
                                    required:
                                        - currency
                                        - value
                                    properties:
                                        currency:
                                            type: string
                                            minLength: 1
                                            description: Non-empty currency code, normalized to lowercase
                                            example: "ghs"
                                        value:
                                            type: integer
                                            minimum: 1
                                            description: Amount in smallest currency unit
                                            example: 100000
                        original_id:
                            type: string
                            description: App-owned comparison price ID when not using original.id
                            example: "pr_original123"
                price_id:
                    type: string
                    description: Active, unarchived app-owned price ID that belongs to the selected product
                    example: "pr_xyz789"
                quantity:
                    type: object
                    description: Quantity bounds the Buy link should enforce
                    required:
                        - min
                        - max
                    properties:
                        min:
                            type: integer
                            minimum: 1
                            description: Minimum quantity the customer can buy
                            example: 1
                        max:
                            type: integer
                            minimum: 1
                            description: Maximum quantity the customer can buy
                            example: 5
                usage:
                    type: object
                    description: Optional link-use policy. Omit to create a reusable Buy link.
                    not:
                        properties:
                            multi_use: {}
                            single_use: {}
                        required:
                            - single_use
                            - multi_use
                    properties:
                        single_use:
                            type: boolean
                            description: Creating the first order consumes the Buy link
                            example: true
                        multi_use:
                            type: boolean
                            description: The Buy link may create multiple orders
                            example: true
                expires_at:
                    type: string
                    format: date-time
                    description: Future RFC3339 timestamp after which the Buy link stops accepting purchases
                    example: "2030-12-01T09:00:00Z"
        UpdatePurchaseIntentRequest:
            type: object
            anyOf:
                - required:
                    - id
                - required:
                    - purchase_intent_id
            properties:
                expires_at:
                    type: string
                    format: date-time
                    nullable: true
                    description: RFC3339 expiry timestamp, including a past time for immediate expiry, or null to clear expiry
                id:
                    type: string
                    minLength: 1
                    description: Purchase intent ID to update. Send this or purchase_intent_id.
                    example: "sale_ABCXYZ"
                maximum_quantity:
                    type: integer
                    minimum: 1
                    description: Maximum quantity the customer can buy
                    example: 3
                minimum_quantity:
                    type: integer
                    minimum: 1
                    description: Minimum quantity the customer can buy
                    example: 1
                purchase_intent_id:
                    type: string
                    minLength: 1
                    description: Alias for id. If both are present, this value takes precedence.
                    example: "sale_ABCXYZ"
                reactivate:
                    type: boolean
                    description: |
                        Clears the state that prevents new purchases. For canceled
                        Buy links this removes inactive_at. For expired Buy links this
                        clears an existing elapsed expires_at value. It does not remove
                        the order claim from a used single-use intent.
                    example: true
        CancelPurchaseIntentRequest:
            type: object
            anyOf:
                - required:
                    - id
                - required:
                    - purchase_intent_id
            properties:
                id:
                    type: string
                    minLength: 1
                    description: Purchase intent ID to cancel. Send this or purchase_intent_id.
                    example: "sale_ABCXYZ"
                purchase_intent_id:
                    type: string
                    minLength: 1
                    description: Alias for id. If both are present, this value takes precedence.
                    example: "sale_ABCXYZ"
        LookupPurchaseIntentRequest:
            type: object
            required:
                - id
            properties:
                id:
                    type: string
                    minLength: 1
                    description: Purchase intent ID to look up
                    example: "sale_ABCXYZ"
        PagePurchaseIntentsRequest:
            type: object
            required:
                - page_number
                - page_size
            properties:
                page_number:
                    type: integer
                    minimum: 1
                    maximum: 10
                    description: One-based page number to retrieve
                    example: 1
                page_size:
                    type: integer
                    minimum: 1
                    maximum: 256
                    description: Maximum number of purchase intents to return on this page
                    example: 20
        PagePurchaseIntentsResponse:
            type: object
            required:
                - page
            properties:
                page:
                    type: object
                    required:
                        - number
                        - purchase_intents
                        - size
                    properties:
                        number:
                            type: integer
                            description: One-based page number returned
                            example: 1
                        purchase_intents:
                            type: array
                            items:
                                $ref: '#/components/schemas/PurchaseIntent'
                        size:
                            type: integer
                            description: Number of purchase intents actually returned
                            example: 2
        PurchaseIntentResponse:
            type: object
            required:
                - purchase_intent
            properties:
                purchase_intent:
                    $ref: '#/components/schemas/PurchaseIntent'
        PurchaseIntentActivityLog:
            type: object
            properties:
                recent:
                    type: array
                    items:
                        $ref: '#/components/schemas/PurchaseIntentActivity'
        PurchaseIntentActivity:
            type: object
            required:
                - created_at
                - id
                - purchase_intent_id
                - type
            properties:
                amount:
                    $ref: '#/components/schemas/PurchaseIntentMoney'
                attribution:
                    $ref: '#/components/schemas/PurchaseIntentActivityAttribution'
                created_at:
                    type: string
                    format: date-time
                error_code:
                    type: string
                    example: "payment_failed"
                id:
                    type: string
                    description: Activity event ID with saleevt_ prefix
                    example: "saleevt_abc123"
                order_id:
                    type: string
                    example: "or_abc123"
                payment_id:
                    type: string
                    example: "py_abc123"
                product_id:
                    type: string
                    example: "prod_abc123"
                purchase_intent_id:
                    type: string
                    description: Purchase intent ID with sale_ prefix
                    example: "sale_ABCXYZ"
                quantity:
                    type: integer
                    minimum: 0
                    example: 2
                source:
                    type: string
                type:
                    type: string
                    enum: [expired_viewed, order_created, payment_failed, payment_started, viewed]
                variant_product_id:
                    type: string
                    example: "prod_variant123"
                visitor:
                    $ref: '#/components/schemas/PurchaseIntentActivityVisitor'
        PurchaseIntentActivityAttribution:
            type: object
            properties:
                campaign:
                    type: string
                    example: "july-drop"
                channel:
                    type: string
                    example: "social"
                content:
                    type: string
                    example: "story-1"
                landing_url:
                    type: string
                    example: "https://pages.inttegro.com/buy/sale_ABCXYZ?utm_source=instagram"
                medium:
                    type: string
                    example: "social"
                referrer:
                    type: string
                    example: "https://instagram.com/"
                referrer_host:
                    type: string
                    example: "instagram.com"
                source:
                    type: string
                    example: "instagram"
                term:
                    type: string
                    example: "waist beads"
        PurchaseIntentActivityVisitor:
            type: object
            properties:
                browser:
                    type: string
                    example: "Safari"
                city:
                    type: string
                    example: "Accra"
                country:
                    type: string
                    example: "GH"
                device:
                    type: string
                    example: "mobile"
                ip_address:
                    type: string
                    description: Request IP address when retained for the activity type
                    example: "203.0.113.7"
                os:
                    type: string
                    example: "iOS"
                region:
                    type: string
                    example: "Greater Accra"
                session_id:
                    type: string
                    example: "ps_9f9489e9-1a67-42f0-bb44-13101ea6f174"
                timezone:
                    type: string
                    example: "Africa/Accra"
                user_agent:
                    type: string
                    example: "Mozilla/5.0"
                visitor_id:
                    type: string
                    example: "pv_b0c6f1b8-e917-4a88-b891-f6b18ce0f540"
        PurchaseIntentMerchant:
            type: object
            description: Merchant identity captured for the hosted checkout. Individual fields are omitted when unavailable.
            properties:
                app_id:
                    type: string
                    example: "app_xyz789"
                app_name:
                    type: string
                    example: "Tea House"
                organization_id:
                    type: string
                    example: "org_abc123"
                organization_name:
                    type: string
                    example: "Tea House Ltd"
        PurchaseIntentMoney:
            type: object
            required:
                - currency
                - value
            properties:
                currency:
                    type: string
                    minLength: 1
                    description: Lowercase currency code
                    example: "ghs"
                value:
                    type: integer
                    minimum: 0
                    description: Amount in the smallest currency unit
                    example: 18500
        PurchaseIntentOriginalPrice:
            type: object
            required:
                - active
                - nominal
            properties:
                active:
                    type: boolean
                    description: Whether the resolved comparison price is active
                    example: true
                id:
                    type: string
                    description: Catalog price ID when the comparison price is not inline
                    example: "pr_original123"
                label:
                    type: string
                    description: Catalog price label when available
                    example: "Regular price"
                nominal:
                    $ref: '#/components/schemas/PurchaseIntentMoney'
        PurchaseIntentPrice:
            type: object
            required:
                - active
                - nominal
            properties:
                active:
                    type: boolean
                    description: Whether the resolved price can be used
                    example: true
                id:
                    type: string
                    description: Catalog price ID when the offer price is not inline
                    example: "pr_xyz789"
                label:
                    type: string
                    description: Catalog price label when available
                    example: "Campaign price"
                nominal:
                    $ref: '#/components/schemas/PurchaseIntentMoney'
                original:
                    $ref: '#/components/schemas/PurchaseIntentOriginalPrice'
        PurchaseIntentProduct:
            allOf:
                - $ref: '#/components/schemas/PriceEmbeddedProduct'
                - type: object
                  properties:
                      prices:
                          type: array
                          description: Non-archived catalog prices currently attached to the product
                          items:
                              $ref: '#/components/schemas/ProductPriceSummary'
                      variant_set_id:
                          type: string
                          description: Variant set configured for this Buy link
                          example: "pg_variantset123"
        PurchaseIntentUsage:
            type: object
            description: Exactly one of multi_use or single_use is returned as true. Order is present after a single-use intent is consumed.
            properties:
                multi_use:
                    type: boolean
                    example: true
                order:
                    $ref: '#/components/schemas/PurchaseIntentUsageOrder'
                single_use:
                    type: boolean
                    example: true
        PurchaseIntentUsageOrder:
            type: object
            required:
                - created_at
                - id
            properties:
                created_at:
                    type: string
                    format: date-time
                    description: When order creation consumed the single-use Buy link
                id:
                    type: string
                    description: Order that consumed the Buy link
                    example: "or_abc123"
        PurchaseIntentVariantAxis:
            type: object
            required:
                - key
                - label
                - position
            properties:
                key:
                    type: string
                    example: "size"
                label:
                    type: string
                    example: "Size"
                position:
                    type: integer
                    example: 0
        PurchaseIntentVariant:
            type: object
            required:
                - active
                - product_id
                - variant_values
            properties:
                active:
                    type: boolean
                    example: true
                position:
                    type: integer
                    example: 0
                price:
                    $ref: '#/components/schemas/PurchaseIntentPrice'
                product:
                    $ref: '#/components/schemas/PurchaseIntentProduct'
                product_id:
                    type: string
                    example: "prod_variant123"
                variant_values:
                    type: object
                    additionalProperties:
                        type: string
                    example:
                        size: "large"
        PurchaseIntentVariantSet:
            type: object
            required:
                - active
                - id
                - name
                - variant_axes
                - variants
            properties:
                active:
                    type: boolean
                    example: true
                default_product_id:
                    type: string
                    example: "prod_abc123"
                description:
                    type: string
                    example: "Choose a tin size"
                id:
                    type: string
                    example: "pg_variantset123"
                name:
                    type: string
                    example: "Tin size"
                reference:
                    type: string
                    example: "matcha-tin-size"
                variant_axes:
                    type: array
                    items:
                        $ref: '#/components/schemas/PurchaseIntentVariantAxis'
                variants:
                    type: array
                    items:
                        $ref: '#/components/schemas/PurchaseIntentVariant'
        PurchaseIntent:
            type: object
            required:
                - allow_variants
                - application_id
                - created_at
                - id
                - maximum_quantity
                - minimum_quantity
                - status
                - usage
            properties:
                activity:
                    allOf:
                        - $ref: '#/components/schemas/PurchaseIntentActivityLog'
                    description: Recent activity for authenticated owner lookups and list responses. Omitted from public lookup.
                allow_variants:
                    type: boolean
                    description: Whether the intent was configured with a variant set
                    example: false
                application_id:
                    type: string
                    description: Application that owns the configured offer
                    example: "app_xyz789"
                created_at:
                    type: string
                    format: date-time
                    description: Creation timestamp
                expires_at:
                    type: string
                    format: date-time
                    description: Timestamp at or after which the Buy link is expired
                id:
                    type: string
                    description: Unique purchase intent identifier with sale_ prefix. Append it to https://pages.inttegro.com/buy/ to build the hosted Buy link.
                    example: "sale_ABCXYZ"
                inactive_at:
                    type: string
                    format: date-time
                    description: When the Buy link was explicitly canceled
                maximum_quantity:
                    type: integer
                    minimum: 1
                    description: Maximum quantity the hosted checkout allows
                    example: 5
                merchant:
                    $ref: '#/components/schemas/PurchaseIntentMerchant'
                minimum_quantity:
                    type: integer
                    minimum: 1
                    description: Minimum quantity the hosted checkout allows
                    example: 1
                price:
                    $ref: '#/components/schemas/PurchaseIntentPrice'
                product:
                    $ref: '#/components/schemas/PurchaseIntentProduct'
                status:
                    type: string
                    enum: [active, expired, inactive, used]
                    description: Effective lifecycle state derived from expiry, cancellation, and single-use order creation
                    example: "active"
                updated_at:
                    type: string
                    format: date-time
                    description: Last mutation timestamp
                usage:
                    $ref: '#/components/schemas/PurchaseIntentUsage'
                variant_set:
                    allOf:
                        - $ref: '#/components/schemas/PurchaseIntentVariantSet'
                    description: Hydrated active variants when available. It may be omitted even when allow_variants is true.
        Product:
            type: object
            required:
                - id
                - type
                - name
                - active
                - created_at
            properties:
                id:
                    type: string
                    description: Unique product identifier with prod_ prefix
                    example: "prod_abc123xyz"
                type:
                    type: string
                    enum: [physical, digital, service, voucher, custom, cause]
                    description: Product type
                    example: "physical"
                reference:
                    type: string
                    nullable: true
                    description: External reference or SKU
                    example: "SKU-12345"
                name:
                    type: string
                    description: Product name
                    example: "Premium Cotton T-Shirt"
                description:
                    type: string
                    nullable: true
                    description: Short description
                    example: "Comfortable everyday wear"
                about:
                    type: string
                    nullable: true
                    description: Full product description
                tax_code:
                    type: string
                    nullable: true
                    description: Tax classification code
                category:
                    type: string
                    description: Product category
                prices:
                    type: array
                    nullable: true
                    description: Non-archived prices that belong to this product
                    items:
                        $ref: '#/components/schemas/ProductPriceSummary'
                shipment:
                    $ref: '#/components/schemas/ProductShipment'
                media:
                    $ref: '#/components/schemas/ProductMedia'
                attributes:
                    type: array
                    description: Product attributes
                    items:
                        $ref: '#/components/schemas/ProductAttribute'
                dimensions:
                    $ref: '#/components/schemas/ProductDimensions'
                custom_data:
                    type: object
                    nullable: true
                    description: Custom metadata
                    additionalProperties:
                        type: string
                active:
                    type: boolean
                    description: Whether product is published and available
                    example: true
                created_at:
                    type: string
                    format: date-time
                    description: Product creation timestamp
                updated_at:
                    type: string
                    format: date-time
                    nullable: true
                    description: Last update timestamp
                archived_at:
                    type: string
                    format: date-time
                    nullable: true
                    description: Archive timestamp (if archived)
                published_at:
                    type: string
                    format: date-time
                    description: When the product was published
                unit_dim:
                    type: string
                    description: Unit dimension label
        PriceEmbeddedProduct:
            type: object
            required:
                - id
                - type
                - name
                - active
                - created_at
            properties:
                id:
                    type: string
                    description: Unique product identifier with prod_ prefix
                    example: "prod_abc123xyz"
                about:
                    type: string
                    description: Full product description
                    example: "Starter plan for solo businesses"
                active:
                    type: boolean
                    description: Whether product is published and available
                    example: true
                archived_at:
                    type: string
                    format: date-time
                    nullable: true
                    description: Archive timestamp (if archived)
                    example: null
                attributes:
                    type: array
                    nullable: true
                    description: Product attributes
                    items:
                        type: object
                        required:
                            - name
                            - value
                        properties:
                            name:
                                type: string
                                description: Attribute name
                                example: "tier"
                            value:
                                type: string
                                description: Attribute value
                                example: "starter"
                category:
                    type: string
                    description: Product category
                    example: "software"
                created_at:
                    type: string
                    format: date-time
                    description: Product creation timestamp
                    example: "2024-01-15T10:30:00Z"
                custom_data:
                    type: object
                    nullable: true
                    description: Custom metadata
                    additionalProperties:
                        type: string
                description:
                    type: string
                    description: Short description
                    example: "Standard monthly subscription"
                dimensions:
                    type: object
                    nullable: true
                    description: Product dimensions and size metadata
                media:
                    type: object
                    nullable: true
                    description: Product media assets
                name:
                    type: string
                    description: Product name
                    example: "Starter plan"
                published_at:
                    type: string
                    format: date-time
                    nullable: true
                    description: When the product was published
                    example: "2024-01-15T10:35:00Z"
                reference:
                    type: string
                    description: External reference or SKU
                    example: "plan-starter-monthly"
                shipment:
                    type: object
                    nullable: true
                    description: Shipment and fulfillment details
                tax_code:
                    type: string
                    description: Tax classification code
                    example: "txcd_software"
                type:
                    type: string
                    enum: [physical, digital, service, voucher, custom, cause]
                    description: Product type
                    example: "digital"
                unit_dim:
                    type: string
                    description: Unit dimension label
                    example: "license"
                updated_at:
                    type: string
                    format: date-time
                    nullable: true
                    description: Last update timestamp
                    example: null
        PricePageRequest:
            type: object
            properties:
                page_number:
                    type: integer
                    minimum: 0
                    maximum: 10
                    description: Page index to fetch. Omit it or send 0 to request page 1; otherwise use 1 through 10.
                    default: 1
                page_size:
                    type: integer
                    minimum: 1
                    maximum: 256
                    description: Number of prices per page (1-256)
                    default: 256
                product_id:
                    type: string
                    description: Optional product ID to scope the page to a single product
                    example: "prod_abc123"
        PricePageResponse:
            type: object
            properties:
                page:
                    type: object
                    properties:
                        number:
                            type: integer
                            description: The page number returned
                        size:
                            type: integer
                            description: The number of prices in this page
                        prices:
                            type: array
                            items:
                                $ref: '#/components/schemas/PricePageItem'
                error:
                    $ref: '#/components/schemas/Error'
        PricePageItem:
            $ref: '#/components/schemas/Price'
        PriceActionRequest:
            type: object
            required:
                - price_id
            properties:
                price_id:
                    type: string
                    description: Price ID to perform the action on
                    example: "pr_xyz789"
        PriceResponse:
            type: object
            properties:
                price:
                    $ref: '#/components/schemas/Price'
                error:
                    $ref: '#/components/schemas/Error'
        Price:
            type: object
            required:
                - id
                - active
                - nominal
                - created_at
            properties:
                id:
                    type: string
                    description: Unique price identifier with pr_ prefix
                    example: "pr_xyz789"
                label:
                    type: string
                    nullable: true
                    description: Short label for this price
                    example: "Standard pricing"
                about:
                    type: string
                    nullable: true
                    description: Longer description of this price
                    example: "Standard pricing for individual customers"
                active:
                    type: boolean
                    description: Whether this price is active and usable in new flows
                    example: true
                nominal:
                    type: object
                    description: Price amount
                    required:
                        - currency
                        - value
                    properties:
                        currency:
                            type: string
                            description: Three-letter ISO currency code
                            example: "USD"
                        value:
                            type: integer
                            description: Amount in smallest currency unit
                            example: 1999
                product:
                    $ref: '#/components/schemas/PriceEmbeddedProduct'
                    nullable: true
                    description: Embedded product details, if this price belongs to a product
                created_at:
                    type: string
                    format: date-time
                    description: Price creation timestamp
                    example: "2024-01-15T10:30:00Z"
                updated_at:
                    type: string
                    format: date-time
                    nullable: true
                    description: Last update timestamp
                    example: "2024-01-20T14:45:00Z"
                archived_at:
                    type: string
                    format: date-time
                    nullable: true
                    description: Archive timestamp (if archived)
                    example: null
        PageFinancialAccountsRequest:
            type: object
            required:
                - page_number
            properties:
                page_number:
                    type: integer
                    minimum: 1
                    maximum: 10
                    description: Page number to retrieve (1-indexed)
                    example: 1
                page_size:
                    type: integer
                    minimum: 1
                    maximum: 256
                    description: Number of accounts per page (defaults to 256)
                    example: 50
        PageFinancialAccountsResponse:
            type: object
            properties:
                page:
                    type: object
                    properties:
                        number:
                            type: integer
                            description: Current page number
                            example: 1
                        size:
                            type: integer
                            description: Number of accounts in this page
                            example: 50
                        accounts:
                            type: array
                            description: Array of financial account objects
                            items:
                                type: object
                                properties:
                                    id:
                                        type: string
                                        description: Financial account identifier
                                        example: "fa_abc123"
                                    type:
                                        type: string
                                        enum: [wallet, bank_account, dosh_account]
                                        description: Type of financial account
                                        example: "wallet"
                                    currency:
                                        type: string
                                        description: Three-letter ISO currency code
                                        example: "GHS"
                                    label:
                                        type: string
                                        description: Human-readable label
                                        example: "Primary Payout Account"
                                    description:
                                        type: string
                                        description: Optional description
                                    reference:
                                        type: string
                                        description: External reference ID
                                    created_at:
                                        type: string
                                        format: date-time
                                        description: Account creation timestamp
                                    archived_at:
                                        type: string
                                        format: date-time
                                        description: Archive timestamp (if archived)
                                    custom_data:
                                        type: object
                                        description: Custom key-value data
                                        additionalProperties:
                                            type: string
                error:
                    $ref: '#/components/schemas/Error'
        OrderLineItem:
            oneOf:
                - $ref: '#/components/schemas/OrderProductLineItem'
                - $ref: '#/components/schemas/OrderFeeLineItem'
                - $ref: '#/components/schemas/OrderShippingLineItem'
            discriminator:
                propertyName: type
                mapping:
                    product: '#/components/schemas/OrderProductLineItem'
                    fee: '#/components/schemas/OrderFeeLineItem'
                    shipping: '#/components/schemas/OrderShippingLineItem'
        OrderProductLineItem:
            type: object
            required: [type, product]
            properties:
                type:
                    type: string
                    enum: [product]
                product:
                    type: object
                    required: [id, name, price, quantity]
                    properties:
                        id:
                            type: string
                            description: Immutable order-line identifier with the `oli_` prefix.
                            example: "oli_7QYpB8c3V9kL2nM4"
                        product_id:
                            type: string
                            description: Source catalog product ID when this line snapshots a catalog product.
                        price_id:
                            type: string
                            description: Source catalog price ID when this line snapshots a saved price.
                        reference:
                            type: string
                        about:
                            type: string
                        custom_data:
                            type: object
                            additionalProperties:
                                type: string
                        tax_code:
                            type: string
                        name:
                            type: string
                        category:
                            type: string
                        type:
                            type: string
                        price:
                            $ref: '#/components/schemas/Money'
                        quantity:
                            type: integer
        OrderFeeLineItem:
            type: object
            required: [type, fee]
            properties:
                type:
                    type: string
                    enum: [fee]
                fee:
                    type: object
                    required: [id, amount, label]
                    properties:
                        id:
                            type: string
                            description: Immutable order-line identifier with the `oli_` prefix.
                        description:
                            type: string
                        tax_code:
                            type: string
                        amount:
                            $ref: '#/components/schemas/Money'
                        label:
                            type: string
        OrderShippingLineItem:
            type: object
            required: [type, shipping]
            properties:
                type:
                    type: string
                    enum: [shipping]
                shipping:
                    type: object
                    required: [id, fee]
                    properties:
                        id:
                            type: string
                            description: Immutable order-line identifier with the `oli_` prefix.
                        tax_code:
                            type: string
                        label:
                            type: string
                        fee:
                            $ref: '#/components/schemas/Money'
        LineItem:
            oneOf:
                - $ref: '#/components/schemas/ProductLineItem'
                - $ref: '#/components/schemas/FeeLineItem'
                - $ref: '#/components/schemas/ShippingLineItem'
            discriminator:
                propertyName: type
                mapping:
                    product: '#/components/schemas/ProductLineItem'
                    fee: '#/components/schemas/FeeLineItem'
                    shipping: '#/components/schemas/ShippingLineItem'
        ProductLineItem:
            type: object
            required:
                - type
                - product
            properties:
                type:
                    type: string
                    enum: [product]
                    description: Line item type discriminator
                product:
                    $ref: '#/components/schemas/ProductDetails'
        FeeLineItem:
            type: object
            required:
                - type
                - fee
            properties:
                type:
                    type: string
                    enum: [fee]
                    description: Line item type discriminator
                fee:
                    $ref: '#/components/schemas/FeeDetails'
        ShippingLineItem:
            type: object
            required:
                - type
                - shipping
            properties:
                type:
                    type: string
                    enum: [shipping]
                    description: Line item type discriminator
                shipping:
                    $ref: '#/components/schemas/ShippingDetails'
        ProductDetails:
            oneOf:
                - $ref: '#/components/schemas/InlineProductDetails'
                - $ref: '#/components/schemas/CatalogProductWithPriceData'
                - $ref: '#/components/schemas/CatalogProductWithPriceReference'
            description: |
                Provide either inline product data or a `product_id` reference to an existing catalog
                product. Catalog-backed product line items can use an explicit `price` or an existing
                `price_id`. Commerce never falls back to a product's default unit price during order
                creation.
        InlineProductDetails:
            type: object
            required:
                - name
                - price
                - quantity
                - type
            properties:
                about:
                    type: string
                    description: Long-form description or marketing copy
                custom_data:
                    type: object
                    description: Your own key-value pairs—use them for whatever you need. Key and values are strings.
                    additionalProperties: true
                name:
                    type: string
                    description: Product name shown to the customer
                    example: "Premium Widget"
                price:
                    $ref: '#/components/schemas/Money'
                quantity:
                    type: integer
                    minimum: 1
                    description: How many units the customer is purchasing
                    example: 1
                reference:
                    type: string
                    description: Your SKU or internal product reference
                tax_code:
                    type: string
                    description: Tax classification code
                type:
                    type: string
                    enum: [physical, digital, service, voucher, custom, cause]
                    description: Product type—affects shipping requirements
        CatalogProductWithPriceData:
            type: object
            required:
                - price
                - product_id
                - quantity
            properties:
                price:
                    $ref: '#/components/schemas/Money'
                product_id:
                    type: string
                    description: Existing catalog product ID to snapshot onto the order line item
                    example: "prod_abc123xyz"
                quantity:
                    type: integer
                    minimum: 1
                    description: How many units of the catalog product the customer is purchasing
                    example: 1
        CatalogProductWithPriceReference:
            type: object
            required:
                - price_id
                - product_id
                - quantity
            properties:
                price_id:
                    type: string
                    description: Existing product price to snapshot onto the order line item. It must belong to the same application and product.
                    example: "pr_xyz789"
                product_id:
                    type: string
                    description: Existing catalog product ID to snapshot onto the order line item
                    example: "prod_abc123xyz"
                quantity:
                    type: integer
                    minimum: 1
                    description: How many units of the catalog product the customer is purchasing
                    example: 1
        FeeDetails:
            type: object
            required:
                - amount
            properties:
                id:
                    type: string
                    description: Fee identifier
                label:
                    type: string
                    description: Customer-facing label for this fee
                tax_code:
                    type: string
                    description: The tax classification code for the shipping fee
                description:
                    type: string
                    description: Customer-facing description for this fee
                custom_data:
                    type: object
                    description: Your own key-value pairs—use them for whatever you need. Key and values are strings.
                    additionalProperties: true
                amount:
                    $ref: '#/components/schemas/Money'
        ShippingDetails:
            type: object
            required:
                - fee
            properties:
                id:
                    type: string
                    description: Unique ID for this shipping charge
                tax_code:
                    type: string
                    description: The tax classification code for the shipping fee
                custom_data:
                    type: object
                    description: Your own key-value pairs—use them for whatever you need. Key and values are strings.
                    additionalProperties: true
                fee:
                    $ref: '#/components/schemas/Money'
        Money:
            type: object
            required:
                - currency
                - value
            properties:
                currency:
                    type: string
                    description: ISO 4217 currency code (lowercase)
                    example: "ghs"
                    pattern: '^[a-z]{3}$'
                value:
                    type: integer
                    description: Amount in smallest currency unit (e.g., pesewas for GHS)
                    example: 20000
                    minimum: 0
        BillingDetails:
            type: object
            required:
                - name
                - email_address
                - phone_number
            properties:
                name:
                    type: string
                    description: Billing contact name
                email_address:
                    type: string
                    format: email
                    description: Billing email address
                phone_number:
                    type: string
                    description: Billing phone number
                address:
                    $ref: '#/components/schemas/Address'
        Shipping:
            type: object
            required:
                - address
            properties:
                address:
                    $ref: '#/components/schemas/Address'
        Address:
            type: object
            required:
                - name
                - phone_number
                - line1
                - town
                - country
            properties:
                name:
                    type: string
                    description: Recipient name
                    example: "Customer Name"
                phone_number:
                    type: string
                    description: Contact phone number
                    example: "+233242058841"
                line1:
                    type: string
                    description: Street address line 1
                    example: "23 Adenta High Street"
                line2:
                    type: string
                    description: Street address line 2 (optional)
                    example: "Behind Pantang"
                town:
                    type: string
                    description: City or town
                    example: "Accra"
                region:
                    type: string
                    description: State, province, or region
                    example: "Greater Accra"
                district:
                    type: string
                    description: District or area
                    example: "Adenta"
                country:
                    type: string
                    description: Country name
                    example: "Ghana"
                post_code:
                    type: string
                    description: Postal/ZIP code
                    example: "GHA-123-9822"
        CreateMessageTemplateRequest:
            oneOf:
                - $ref: '#/components/schemas/CreateSMSMessageTemplateRequest'
                - $ref: '#/components/schemas/CreateEmailMessageTemplateRequest'
            discriminator:
                propertyName: channel
            description: Create request for one reusable SMS or email message template.
        CreateSMSMessageTemplateRequest:
            type: object
            required: [channel, name, purpose, sms]
            additionalProperties: false
            properties:
                about:
                    type: string
                channel:
                    type: string
                    enum: [sms]
                locale:
                    type: string
                    default: en
                name:
                    type: string
                purpose:
                    type: string
                sms:
                    $ref: '#/components/schemas/MessageTemplateSMSContent'
                variables:
                    type: array
                    items:
                        $ref: '#/components/schemas/MessageTemplateVariableInput'
        CreateEmailMessageTemplateRequest:
            type: object
            required: [channel, email, name, purpose]
            additionalProperties: false
            properties:
                about:
                    type: string
                attachments:
                    $ref: '#/components/schemas/MessageTemplateAttachmentIDs'
                channel:
                    type: string
                    enum: [email]
                email:
                    $ref: '#/components/schemas/MessageTemplateEmailContent'
                locale:
                    type: string
                    default: en
                name:
                    type: string
                purpose:
                    type: string
                variables:
                    type: array
                    items:
                        $ref: '#/components/schemas/MessageTemplateVariableInput'
        MessageTemplateCreateFields:
            type: object
            required:
                - name
                - channel
                - purpose
            properties:
                name:
                    type: string
                    description: Human-readable template name.
                    example: "Receipt email"
                about:
                    type: string
                    description: Optional description of when this template should be used.
                    example: "Sent after a successful payment."
                channel:
                    type: string
                    enum: [sms, email]
                    description: Delivery channel this template renders for.
                purpose:
                    type: string
                    description: Caller-defined purpose for filtering and analytics.
                    example: "receipt"
                locale:
                    type: string
                    description: Template locale. Defaults to `en` when omitted.
                    example: "en"
                variables:
                    type: array
                    description: Variables accepted by this template.
                    items:
                        $ref: '#/components/schemas/MessageTemplateVariableInput'
        UpdateMessageTemplateRequest:
            type: object
            required:
                - id
            additionalProperties: false
            not:
                required:
                    - sms
                    - email
            properties:
                id:
                    type: string
                    description: API-generated message template id.
                    example: "mtpl_receipt"
                name:
                    type: string
                    description: Human-readable template name.
                    example: "Receipt email"
                about:
                    type: string
                    description: Optional description of when this template should be used.
                    example: "Sent after a successful payment."
                channel:
                    type: string
                    enum: [sms, email]
                    description: Existing template channel. Channels cannot be changed.
                purpose:
                    type: string
                    description: Caller-defined purpose for filtering and analytics.
                    example: "receipt"
                locale:
                    type: string
                    example: "en"
                variables:
                    type: array
                    items:
                        $ref: '#/components/schemas/MessageTemplateVariableInput'
                sms:
                    $ref: '#/components/schemas/MessageTemplateSMSContent'
                email:
                    $ref: '#/components/schemas/MessageTemplateEmailContent'
                attachments:
                    $ref: '#/components/schemas/MessageTemplateAttachmentIDs'
        MessageTemplateIDRequest:
            type: object
            required:
                - id
            properties:
                id:
                    type: string
                    description: API-generated message template id.
                    example: "mtpl_receipt"
        PageMessageTemplatesRequest:
            type: object
            properties:
                page:
                    type: integer
                    minimum: 1
                    default: 1
                size:
                    type: integer
                    minimum: 1
                    default: 25
                status:
                    type: string
                    enum: [draft, published, archived]
                channel:
                    type: string
                    enum: [sms, email]
                purpose:
                    type: string
                    example: "receipt"
                locale:
                    type: string
                    example: "en"
        RenderMessageTemplatePreviewRequest:
            type: object
            required:
                - message_template
            properties:
                message_template:
                    $ref: '#/components/schemas/MessageTemplateReference'
        MessageTemplateReference:
            type: object
            required:
                - template_id
            properties:
                template_id:
                    type: string
                    description: API-generated message template id.
                    example: "mtpl_receipt"
                variables:
                    $ref: '#/components/schemas/MessageTemplateVariables'
        MessageTemplateVariables:
            type: object
            description: Variable values used when rendering a template.
            additionalProperties: true
            example:
                customer_name: "Akua"
                receipt_url: "https://pay.inttegro.com/receipts/123"
        MessageTemplateAttachmentIDs:
            type: array
            description: Stored file IDs returned by previews. Chime send, schedule, and broadcast currently reject stored-template attachments.
            maxItems: 25
            items:
                type: string
                pattern: "^file_[A-Za-z0-9]+$"
            example:
                - "file_invoicePdf"
        MessageTemplateVariableInput:
            type: object
            required:
                - name
                - type
            additionalProperties: false
            properties:
                name:
                    type: string
                    pattern: "^[a-z][a-z0-9_]{0,63}$"
                    example: "customer_name"
                type:
                    type: string
                    enum: [string, number, integer, boolean, url, email, phone, date, datetime, array]
                required:
                    type: boolean
                'default':
                    description: Default value used when this variable is omitted.
                about:
                    type: string
                    description: Optional description of the variable.
                items:
                    type: array
                    description: Field schema for array item objects. Nested arrays are not supported.
                    items:
                        $ref: '#/components/schemas/MessageTemplateVariableItemInput'
        MessageTemplateVariableItemInput:
            type: object
            required: [name, type]
            additionalProperties: false
            properties:
                about:
                    type: string
                default: {}
                name:
                    type: string
                    pattern: "^[a-z][a-z0-9_]{0,63}$"
                required:
                    type: boolean
                type:
                    type: string
                    enum: [string, number, integer, boolean, url, email, phone, date, datetime]
        MessageTemplateVariable:
            type: object
            required: [name, required, type]
            properties:
                about:
                    type: string
                default: {}
                items:
                    type: array
                    items:
                        $ref: '#/components/schemas/MessageTemplateVariableItem'
                name:
                    type: string
                required:
                    type: boolean
                type:
                    type: string
                    enum: [string, number, integer, boolean, url, email, phone, date, datetime, array]
        MessageTemplateVariableItem:
            type: object
            required: [name, required, type]
            properties:
                about:
                    type: string
                default: {}
                name:
                    type: string
                required:
                    type: boolean
                type:
                    type: string
                    enum: [string, number, integer, boolean, url, email, phone, date, datetime]
        MessageTemplateSMSContent:
            type: object
            required:
                - message_template
            properties:
                message_template:
                    type: string
                    description: SMS body template.
                    example: "Your code is {{code}}."
        MessageTemplateEmailContent:
            type: object
            required:
                - subject
                - html
            properties:
                subject:
                    type: string
                    description: Email subject template.
                    example: "Your receipt"
                html:
                    type: string
                    description: HTML email body template.
                    example: "<p>Thanks {{customer_name}}.</p>"
                from:
                    $ref: '#/components/schemas/MessageTemplateMailbox'
                reply_to:
                    $ref: '#/components/schemas/MessageTemplateMailbox'
                headers:
                    type: object
                    additionalProperties:
                        type: string
        MessageTemplateMailbox:
            type: object
            required:
                - address
            properties:
                address:
                    type: string
                    description: Literal or templated mailbox address, such as `{{recipient_email}}`.
                    example: "{{recipient_email}}"
                name:
                    type: string
                    example: "Acme"
        MessageTemplateSafetyResult:
            type: object
            description: Result of the email safety scan.
            required: [content_hash, normalized_text, scanner, status]
            properties:
                content_hash:
                    type: string
                links:
                    type: array
                    items:
                        $ref: '#/components/schemas/MessageTemplateScannedLink'
                normalized_text:
                    type: string
                quarantine_notes:
                    type: string
                reason_codes:
                    type: array
                    items:
                        type: string
                sanitized_html:
                    type: string
                scanner:
                    type: string
                status:
                    type: string
                    enum: [allowed, rejected, quarantined]
        MessageTemplateScannedLink:
            type: object
            required: [raw, scheme, status]
            properties:
                host:
                    type: string
                raw:
                    type: string
                reason:
                    type: string
                scheme:
                    type: string
                status:
                    type: string
        MessageTemplate:
            type: object
            required:
                - id
                - name
                - channel
                - purpose
                - locale
                - status
                - version
                - draft_version
                - has_unpublished_changes
                - created_at
                - updated_at
            properties:
                id:
                    type: string
                    description: API-generated unique template id.
                    example: "mtpl_receipt"
                name:
                    type: string
                    example: "Receipt email"
                about:
                    type: string
                    example: "Sent after successful payment."
                channel:
                    type: string
                    enum: [sms, email]
                purpose:
                    type: string
                    example: "receipt"
                locale:
                    type: string
                    example: "en"
                status:
                    type: string
                    enum: [draft, published, archived]
                version:
                    type: integer
                    example: 2
                published_version:
                    type: integer
                    example: 1
                draft_version:
                    type: integer
                    example: 2
                has_unpublished_changes:
                    type: boolean
                variables:
                    type: array
                    items:
                        $ref: '#/components/schemas/MessageTemplateVariable'
                sms:
                    $ref: '#/components/schemas/MessageTemplateSMSContent'
                email:
                    $ref: '#/components/schemas/MessageTemplateEmailContent'
                attachments:
                    $ref: '#/components/schemas/MessageTemplateAttachmentIDs'
                created_at:
                    type: string
                    format: date-time
                updated_at:
                    type: string
                    format: date-time
                published_at:
                    type: string
                    format: date-time
                archived_at:
                    type: string
                    format: date-time
        MessageTemplateEnvelope:
            type: object
            required: [message_template]
            properties:
                message_template:
                    $ref: '#/components/schemas/MessageTemplate'
        MessageTemplatesPageEnvelope:
            type: object
            required: [page]
            properties:
                page:
                    $ref: '#/components/schemas/MessageTemplatesPage'
        MessageTemplatesPage:
            type: object
            required:
                - number
                - size
                - message_templates
            properties:
                number:
                    type: integer
                    example: 1
                size:
                    type: integer
                    description: Number of templates returned in this page after filters are applied.
                    example: 25
                message_templates:
                    type: array
                    items:
                        $ref: '#/components/schemas/MessageTemplate'
        RenderMessageTemplatePreviewResponse:
            type: object
            required: [message_template, rendered]
            properties:
                message_template:
                    $ref: '#/components/schemas/MessageTemplate'
                rendered:
                    $ref: '#/components/schemas/RenderedMessageTemplate'
        RenderedMessageTemplate:
            type: object
            required:
                - channel
            properties:
                channel:
                    type: string
                    enum: [sms, email]
                attachments:
                    $ref: '#/components/schemas/MessageTemplateAttachmentIDs'
                sms:
                    $ref: '#/components/schemas/RenderedSMSMessageTemplate'
                email:
                    $ref: '#/components/schemas/RenderedEmailMessageTemplate'
        RenderedSMSMessageTemplate:
            type: object
            required:
                - full_message
            properties:
                full_message:
                    type: string
                    maxLength: 120
                    example: "Your code is 123456."
        RenderedEmailMessageTemplate:
            type: object
            required:
                - subject
                - text
            properties:
                subject:
                    type: string
                    example: "Your receipt"
                text:
                    type: string
                    example: "Thanks Akua."
                html:
                    type: string
                    example: "<p>Thanks Akua.</p>"
                from:
                    $ref: '#/components/schemas/MessageTemplateMailbox'
                reply_to:
                    $ref: '#/components/schemas/MessageTemplateMailbox'
                headers:
                    type: object
                    additionalProperties:
                        type: string
                safety:
                    $ref: '#/components/schemas/MessageTemplateSafetyResult'
        OrderDocumentDeliveryRequest:
            type: object
            additionalProperties: false
            required:
                - order_id
            properties:
                order_id:
                    type: string
                    description: Order whose hosted invoice or receipt link should be delivered.
                    example: "or_48ZW7BGvYUBWc1i6WBkL2jr0iPQP5jUy76mmmHpt"
        OrderDocumentDeliveryResponse:
            type: object
            description: Response returned by deliberate order document delivery endpoints.
            properties:
                delivery:
                    $ref: '#/components/schemas/OrderDocumentDelivery'
                error:
                    $ref: '#/components/schemas/Error'
                order:
                    $ref: '#/components/schemas/Order'
        OrderDocumentDelivery:
            type: object
            description: Delivery result for one hosted order document link.
            properties:
                deliveries:
                    type: array
                    description: Chime messages that were accepted for delivery.
                    items:
                        $ref: '#/components/schemas/OrderDocumentDeliveryAttempt'
                document_kind:
                    type: string
                    enum: [invoice, receipt]
                    description: Hosted document that was delivered.
                    example: "invoice"
                document_url:
                    type: string
                    format: uri
                    description: Hosted invoice or receipt URL sent to the customer. Receipt URLs use the hosted receipt path, not the invoice PDF path.
                    example: "https://pages.inttegro.com/invoices/or_48ZW7BGvYUBWc1i6WBkL2jr0iPQP5jUy76mmmHpt"
                failed_channels:
                    type: array
                    description: Channels that failed to send.
                    items:
                        type: string
                        enum: [email, sms]
                    example: ["email"]
                failures:
                    type: array
                    description: Per-channel delivery failures.
                    items:
                        $ref: '#/components/schemas/OrderDocumentDeliveryFailure'
                sent_channels:
                    type: array
                    description: Channels accepted by Chime.
                    items:
                        type: string
                        enum: [email, sms]
                    example: ["sms"]
        OrderDocumentDeliveryAttempt:
            type: object
            description: Chime delivery accepted for one channel.
            properties:
                channel:
                    type: string
                    enum: [email, sms]
                    description: Delivery channel.
                    example: "sms"
                chime_id:
                    type: string
                    description: Chime ID created for this delivery.
                    example: "chm_7QYpB8c3V9kL2nM4"
        OrderDocumentDeliveryFailure:
            type: object
            description: Chime delivery failure for one channel.
            properties:
                channel:
                    type: string
                    enum: [email, sms]
                    description: Delivery channel.
                    example: "email"
                error:
                    type: string
                    description: Provider or Chime error for this channel.
                    example: "chime api returned status=503"

        PaymentMethodPageRequest:
            type: object
            properties:
                customer_id:
                    type: string
                    description: Optional customer ID to scope the page to a single customer
                    example: "cu_a1b2c3d4e5"
                page_number:
                    type: integer
                    minimum: 0
                    maximum: 10
