        CreatePurchaseIntentRequest:
            type: object
            required:
                - quantity
            allOf:
                - oneOf:
                    - required:
                        - product
                    - required:
                        - product_id
                - oneOf:
                    - required:
                        - price
                    - required:
                        - price_id
            properties:
                product:
                    type: object
                    description: Inline product selector for the Buy link
                    required:
                        - id
                    properties:
                        id:
                            type: string
                            description: Product ID to sell through the Buy link
                            example: "prod_abc123"
                        variant_set_id:
                            type: string
                            description: Optional variant set ID Pages Buy may use for sibling product selection
                            example: "pg_variantset123"
                product_id:
                    type: string
                    description: Product ID to sell through the Buy link when not using product
                    example: "prod_abc123"
                price:
                    type: object
                    description: Inline price selector for the Buy link. Runtime requires exactly one of id or nominal and allows at most one of original or original_id.
                    allOf:
                        - oneOf:
                            - required:
                                - id
                            - required:
                                - nominal
                        - not:
                            required:
                                - original
                                - original_id
                    properties:
                        id:
                            type: string
                            description: Existing price ID selected for the Buy link
                            example: "pr_xyz789"
                        nominal:
                            type: object
                            description: Inline offer amount when no price ID is provided
                            required:
                                - currency
                                - value
                            properties:
                                currency:
                                    type: string
                                    description: ISO 4217 currency code
                                    example: "ghs"
                                    pattern: '^[A-Za-z]{3}$'
                                value:
                                    type: integer
                                    minimum: 1
                                    description: Amount in smallest currency unit
                                    example: 85000
                        original:
                            type: object
                            description: Optional original price used for comparison display
                            allOf:
                                - oneOf:
                                    - required:
                                        - id
                                    - required:
                                        - nominal
                            properties:
                                id:
                                    type: string
                                    description: Existing original price ID
                                    example: "pr_original123"
                                nominal:
                                    type: object
                                    description: Inline original price amount
                                    required:
                                        - currency
                                        - value
                                    properties:
                                        currency:
                                            type: string
                                            description: ISO 4217 currency code
                                            example: "ghs"
                                            pattern: '^[A-Za-z]{3}$'
                                        value:
                                            type: integer
                                            minimum: 1
                                            description: Amount in smallest currency unit
                                            example: 100000
                        original_id:
                            type: string
                            description: Existing original price ID when not using original.id
                            example: "pr_original123"
                price_id:
                    type: string
                    description: Existing price ID selected for the Buy link when not using price
                    example: "pr_xyz789"
                quantity:
                    type: object
                    description: Quantity bounds the Buy link should enforce
                    required:
                        - min
                        - max
                    properties:
                        min:
                            type: integer
                            minimum: 1
                            description: Minimum quantity the customer can buy
                            example: 1
                        max:
                            type: integer
                            minimum: 1
                            description: Maximum quantity the customer can buy
                            example: 5
                usage:
                    type: object
                    description: Optional link-use policy. Omit to create a reusable Buy link.
                    not:
                        required:
                            - single_use
                            - multi_use
                    properties:
                        single_use:
                            type: boolean
                            description: The first completed order consumes the Buy link
                            example: true
                        multi_use:
                            type: boolean
                            description: The Buy link may create multiple orders
                            example: true
                expires_at:
                    type: string
                    format: date-time
                    description: Expiry timestamp for the Buy link
                    example: "2024-01-20T14:45:00Z"
        UpdatePurchaseIntentRequest:
            type: object
            required:
                - id
            properties:
                id:
                    type: string
                    description: PurchaseIntent ID to update
                    example: "sale_ABCXYZ"
                minimum_quantity:
                    type: integer
                    minimum: 1
                    description: Minimum quantity the customer can buy
                    example: 1
                maximum_quantity:
                    type: integer
                    minimum: 1
                    description: Maximum quantity the customer can buy
                    example: 3
                expires_at:
                    type: string
                    format: date-time
                    nullable: true
                    description: Expiry timestamp for the Buy link, or null to clear expiry
                reactivate:
                    type: boolean
                    description: |
                        Clears the state that prevents new purchases. For canceled
                        Buy links this removes inactive_at. For expired Buy links this
                        clears an elapsed expires_at value.
                    example: true
        CancelPurchaseIntentRequest:
