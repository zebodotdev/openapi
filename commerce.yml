    /balances:
        post:
            summary: Retrieve your balance
            description: |
                Fetch the latest GHS balance snapshot for your application. The response separates
                payout-eligible funds from funds that are still pending, held back from payout, or
                assigned to refund activity at the snapshot cutoff.
