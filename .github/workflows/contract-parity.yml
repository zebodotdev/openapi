name: OpenAPI and Call parity

on:
  pull_request:
    paths:
      - commerce.yml
      - call/**
      - package.json
      - package-lock.json
      - scripts/check-contract.mjs
      - .github/workflows/contract-parity.yml
  push:
    branches:
      - master
    paths:
      - commerce.yml
      - call/**
      - package.json
      - package-lock.json
      - scripts/check-contract.mjs
      - .github/workflows/contract-parity.yml

jobs:
  contract-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: ./call/scripts/validate.sh
