name: OpenAPI and client collection parity

on:
  pull_request:
    paths:
      - commerce.yml
      - insomnia/**
      - postman/**
      - contract.lock.json
      - package.json
      - package-lock.json
      - scripts/**
      - .github/workflows/contract-parity.yml
  push:
    branches:
      - master
    paths:
      - commerce.yml
      - insomnia/**
      - postman/**
      - contract.lock.json
      - package.json
      - package-lock.json
      - scripts/**
      - .github/workflows/contract-parity.yml

jobs:
  contract-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: ./insomnia/scripts/validate.sh
      - run: ./postman/scripts/validate.sh
